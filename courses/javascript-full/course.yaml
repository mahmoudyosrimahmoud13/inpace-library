    minutes: 35
  - id: m8-l2
    title: Events
    file: lessons/m8-l2.md
    minutes: 30
  - id: m8-l3
    title: 'Project step 1: the page and the logic'
    file: lessons/m8-l3.md
    minutes: 45
  requires:
  - id: m8-practical
    type: practical
    prompt: 'Project step 1: create index.html, style.css and tasks.js as in the lesson. In the browser console,
