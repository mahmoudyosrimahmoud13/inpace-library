    file: lessons/m9-l2.md
    minutes: 35
  - id: m9-l3
    title: 'Project step 2: connect, save, load a quote'
    file: lessons/m9-l3.md
    minutes: 45
  requires:
  - id: m9-practical
    type: practical
    prompt: 'Project step 2: add storage.js and app.js. Add 3 tasks, tick one, reload the page (they must stay),
      and delete one. Then add a feature of your own: a "Clear done tasks" button. Upload a short screen recording
      or screenshots and the code.'
