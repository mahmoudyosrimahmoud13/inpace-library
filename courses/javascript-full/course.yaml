    file: lessons/m7-l3.md
    minutes: 25
    media: https://www.youtube.com/watch?v=PkZNo7MFNFg&t=12025&end=12360
  requires:
  - id: m7-practical
    type: practical
    prompt: 'Make a folder with package.json ("type": "module"), `shapes.js` exporting a class Rectangle (area,
      perimeter, a getter isSquare) and a subclass Square, and `main.js` importing them and printing 3 shapes. Upload
      the folder as a zip.'
  - id: m7-explain
    type: explain
    prompt: Why does modern JavaScript avoid var? Explain with the loop example.
    min_words: 40
  - id: m7-quiz
    type: quiz
    questions:
    - q25
    - q26
    - q27
    - q28
