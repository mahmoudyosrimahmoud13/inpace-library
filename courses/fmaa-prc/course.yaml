id: fmaa-prc
title: 'FMAA Exam Prep: Financial Management and Accounting'
version: 1
language: en
description: 'Complete preparation for the FMAA (PRC) exam. Covers all five sections: General Accounting, Financial
  Statement Preparation and Analysis, Planning and Budgeting, Cost Management and Performance Metrics, and Professional
  Ethics. Each module ends with a 10-question quiz. Pass mark is 60% (6/10).

  '
