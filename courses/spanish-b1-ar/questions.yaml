q1:
  text: 'بعد «Creo que...» تستخدم:'
  show: 4
  options:
    a: الـ subjuntivo
    b: المصدر
    c: الأمر
    d: المضارع العادي (indicativo)
q2:
  text: '«sin embargo» معناها:'
  show: 4
  options:
    a: لذلك
    b: لأن
    c: بالإضافة إلى ذلك
    d: ومع ذلك
q3:
  text: '«Echo de menos a mi familia» معناها:'
  show: 4
  options:
    a: أطرد عائلتي.
    b: أفتقد عائلتي.
    c: عائلتي أقل.
    d: أرى عائلتي أقل.
q4:
  text: أيها صحيح؟
  show: 4
  options:
    a: Llueve como, me quedo en casa.
    b: Porque llueve como me quedo.
    c: Como llueve, me quedo en casa.
    d: Me quedo en casa, como llueve.
q5:
  text: 'طريقة مهذبة للاعتراض:'
  show: 4
  options:
    a: No.
    b: Entiendo lo que dices, sin embargo...
    c: Estás equivocado y punto.
    d: Eso es tonto.
q6:
  text: 'subjuntivo من tener مع yo:'
  show: 4
  options:
    a: tiene
    b: tena
    c: tengo
    d: tenga
q7:
  text: Quiero que tú ___ conmigo.
  show: 4
  options:
    a: vengo
    b: vienes
    c: vengas
    d: venir
q8:
  text: Quiero ___ al cine esta noche.
  show: 4
  options:
    a: vaya
    b: que vaya
    c: ir
    d: voy
q9:
  text: '«Ojalá» أصلها من:'
  show: 4
  options:
    a: اللاتينية
    b: اليونانية
    c: الفرنسية
    d: العربية
q10:
  text: 'subjuntivo من ser مع ellos:'
  show: 4
  options:
    a: seran
    b: son
    c: fueran
    d: sean
q11:
  text: No creo que ella ___ razón.
  show: 4
  options:
    a: tener
    b: tenga
    c: tendrá
    d: tiene
q12:
  text: Creo que ella ___ razón.
  show: 4
  options:
    a: tenga
    b: tener
    c: tiene
    d: tengas
q13:
  text: Me alegro de que ___ bien.
  show: 4
  options:
    a: estás
    b: estar
    c: eres
    d: estés
q14:
  text: '«Llevo un año estudiando español» معناها:'
  show: 4
  options:
    a: درست الإسبانية منذ سنة.
    b: سأدرس الإسبانية لمدة سنة.
    c: منذ سنة وأنا أدرس الإسبانية.
    d: أحمل كتابًا إسبانيًا.
q15:
  text: '«Si yo fuera tú...» معناها:'
  show: 4
  options:
    a: عندما كنت أنت...
    b: لو كنت مكانك...
    c: لو ذهبت معك...
    d: لو كنت أنت أنا...
q16:
  text: Si ___ dinero, compraría una casa.
  show: 4
  options:
    a: tengo
    b: tendría
    c: tenga
    d: tuviera
q17:
  text: 'شرطي hacer مع yo:'
  show: 4
  options:
    a: haría
    b: hiciera
    c: hacía
    d: hacería
q18:
  text: 'طلب مهذب:'
  show: 4
  options:
    a: ¿Pudiste ayudarme?
    b: Ayúdame.
    c: ¿Puedes ayudarme ahora mismo ya?
    d: ¿Podrías ayudarme?
q19:
  text: Si llueve mañana, ___ en casa.
  show: 4
  options:
    a: me quedé
    b: me quedara
    c: me quedaré
    d: me quedaría
q20:
  text: '«Yo en tu lugar...» معناها:'
  show: 4
  options:
    a: أنا في بيتك...
    b: خذ مكاني.
    c: أنا في مكانك.
    d: لو كنت مكانك...
q21:
  text: '«Cuando llegué, la clase ya había empezado» معناها:'
  show: 4
  options:
    a: عندما وصلت، كان الدرس قد بدأ.
    b: عندما أصل، سيبدأ الدرس.
    c: عندما وصلت، بدأ الدرس.
    d: بدأ الدرس بعد وصولي.
q22:
  text: 'الماضي التام من ver مع yo:'
  show: 4
  options:
    a: había visto
    b: había veído
    c: he visto
    d: habí visto
q23:
  text: 'الرسالة الرسمية تبدأ بـ:'
  show: 4
  options:
    a: 'Estimada señora Ruiz:'
    b: ¡Hola, guapa!
    c: Querida Ruiz,
    d: 'Oye, señora:'
q24:
  text: «Llevo seis años trabajando aquí» — هل ما زال المتكلم يعمل هناك؟
  show: 4
  options:
    a: لا يمكن أن نعرف
    b: لا
    c: لست سنوات أخرى فقط
    d: نعم
q25:
  text: 'في المقابلة، ما لم تُدعَ لغير ذلك، يجب أن تستخدم:'
  show: 4
  options:
    a: بدون أي ضمير
    b: vosotros
    c: usted
    d: tú
q26:
  text: «Vivo en Sevilla.» → Dijo que ___ en Sevilla.
  show: 4
  options:
    a: vive
    b: vivió
    c: viviera
    d: vivía
q27:
  text: «Te llamaré.» → Dijo que me ___.
  show: 4
  options:
    a: llamara
    b: llamaba
    c: llamará
    d: llamaría
q28:
  text: «¿Vienes?» → Me preguntó ___ iba.
  show: 4
  options:
    a: cuando
    b: si
    c: qué
    d: que
q29:
  text: «Cierra la puerta.» → Me pidió que ___ la puerta.
  show: 4
  options:
    a: cerraba
    b: cierro
    c: cerrara
    d: cerraría
q30:
  text: '«¡Enhorabuena!» معناها:'
  show: 4
  options:
    a: بالتوفيق!
    b: بالهناء!
    c: صباح الخير!
    d: مبروك!
