    type: practical
    prompt: 'تسجيل صوتي (دقيقتان): ثلاثة أسئلة افتراضية مع الأسباب. ارفعه.'
  - id: m4-explain
    type: explain
    prompt: اكتب حوالي 70 كلمة بالإسبانية عمّا كنت ستفعله لو كانت عندك سنة فراغ، باستخدام الشرطي وsi + tuviera/pudiera.
    min_words: 60
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
