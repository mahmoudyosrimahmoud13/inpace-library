id: spanish-b1-ar
title: 'الإسباني B1: الرأي والـ subjuntivo والمحادثات الحقيقية'
version: 2
language: ar
description: 'الإسباني مستوى B1، بالشرح العربي وبنفس الطريقة المبنية على الأبحاث: محادثات حقيقية أولًا، والعبارات التي يستخدمها
  الناس، وقاعدة واحدة في كل وحدة، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة. عبّر عن رأيك ودافع عنه، واستخدم الـ subjuntivo
  للأمنيات والنصائح والمشاعر والشك، وتكلّم عن المواقف الافتراضية بالشرطي، وتعامل مع مقابلة عمل ورسائل رسمية، وانقل ما قاله
  الناس. وينتهي باختبار مستوى B1. حوالي أسبوعين إلى 3 أسابيع، 45 دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'Dreaming Spanish: فيديوهات مجانية مرتبة حسب المستوى، من الصفر (بالإسبانية)'
  url: https://www.dreaming.com/
- title: 'Easy Spanish: مقابلات في الشارع مع ترجمة (YouTube)'
  url: https://www.youtube.com/@EasySpanish
- title: 'SpanishDict: قاموس وجداول تصريف ونطق (بالإنجليزية)'
  url: https://www.spanishdict.com/
modules:
- id: m1
  title: 'الوحدة 1: في رأيي'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: إبداء الرأي والدفاع عنه
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: التعبير عن الرأي وربط الأفكار
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (دقيقتان): رأي مع أسباب، وحجة مضادة، وخلاصة. ارفعه.'
  - id: m1-explain
    type: explain
    prompt: اكتب حوالي 80 كلمة بالإسبانية تعبّر فيها عن رأيك في موضوع تختاره، بأربع أدوات ربط على الأقل.
    min_words: 70
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'الوحدة 2: أتمنى أن...'
  lessons:
  - id: m2-l1
    title: الأمنيات والطلبات
    file: lessons/m2-l1.md
    minutes: 35
  - id: m2-l2
    title: 'الـ subjuntivo في المضارع: الأمنيات والطلبات'
    file: lessons/m2-l2.md
    minutes: 40
  requires:
  - id: m2-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): أمنيات وطلبات لصديق يبدأ شيئًا جديدًا. ارفعه.'
  - id: m2-explain
    type: explain
    prompt: 'اكتب حوالي 60 كلمة بالإسبانية: ماذا تريد منك عائلتك أو مديرك، وماذا تتمنى هذه السنة (quiero que وespero que وojalá).'
    min_words: 50
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'الوحدة 3: النصيحة والمشاعر والشك'
  lessons:
  - id: m3-l1
    title: طلب النصيحة من صديق
    file: lessons/m3-l1.md
    minutes: 35
  - id: m3-l2
    title: الـ subjuntivo للنصيحة والمشاعر والشك
    file: lessons/m3-l2.md
    minutes: 40
  requires:
  - id: m3-practical
    type: practical
    prompt: 'تسجيل صوتي (دقيقتان): نصائح لصديق، بخمس عبارات subjuntivo على الأقل. ارفعه.'
  - id: m3-explain
    type: explain
    prompt: 'اكتب حوالي 70 كلمة بالإسبانية: نصائح لطالب أو موظف جديد في مدرستك أو شركتك (te recomiendo que وes importante
      que وno creo que).'
    min_words: 60
  - id: m3-quiz
    type: quiz
