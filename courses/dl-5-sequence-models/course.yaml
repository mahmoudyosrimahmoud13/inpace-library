id: dl-5-sequence-models
title: 'Deep Learning 5: sequence models, attention and transformers'
version: 1
language: en
description: 'Part 5 of a refresh of Andrew Ng''s Deep Learning Specialization, with the original slides in each
  lesson and everything updated for PyTorch 2.15 and Keras 3.15: RNNs, language models and sampling, GRU and LSTM,
  word embeddings (word2vec, negative sampling, GloVe), sentiment and debiasing, sequence-to-sequence models, beam
  search, BLEU, attention, speech, and transformers, plus how they became today''s large language models. Notebooks
  for Colab, as files and PDFs, and new charts from real runs. Plan: 9 days. Slides by DeepLearning.AI (CC BY-SA
  2.0, non-commercial).'
image: cover.jpg
modules:
- id: m1
  title: 'Day 1: Recurrent neural networks'
  lessons:
  - id: m1-l1
    title: Start here
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: Sequence data and notation
    file: lessons/m1-l2.md
    minutes: 20
    media: C5_W1.pdf#pages=2-7
  - id: m1-l3
    title: The recurrent network
    file: lessons/m1-l3.md
    minutes: 35
    media: C5_W1.pdf#pages=8-20
  requires:
  - id: m1-practical
    type: practical
    prompt: 'For each task, write the RNN shape (many-to-one, etc.), T_x and T_y: spam detection, speech to text,
      generating a melody from a genre, tagging people''s names in a sentence, translating Arabic to English. Upload
      your table.'
  - id: m1-explain
    type: explain
    prompt: Explain why an RNN uses the same weights at every time step, and what that buys you.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    pass: 70
- id: m2
  title: 'Day 2: Language models and sampling'
  lessons:
  - id: m2-l1
    title: Language models
    file: lessons/m2-l1.md
    minutes: 30
    media: C5_W1.pdf#pages=21-24
  - id: m2-l2
    title: Sampling, and character-level models
    file: lessons/m2-l2.md
    minutes: 30
    media: C5_W1.pdf#pages=25-28
  requires:
  - id: m2-practical
    type: practical
    prompt: Run section 2 of the PyTorch notebook in Colab, then replace the training text with a paragraph of your
      own (at least 300 characters, repeated) and sample at three temperatures. Upload the samples.
  - id: m2-explain
    type: explain
    prompt: Explain what temperature does when sampling from a language model, with a small example of probabilities.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q5
    - q6
    - q7
    - q8
    pass: 70
- id: m3
  title: 'Day 3: Vanishing gradients, GRU and LSTM'
  lessons:
  - id: m3-l1
    title: Vanishing gradients in RNNs
    file: lessons/m3-l1.md
    minutes: 20
    media: C5_W1.pdf#pages=29-30
  - id: m3-l2
    title: GRU and LSTM
    file: lessons/m3-l2.md
    minutes: 35
    media: C5_W1.pdf#pages=31-38
  - id: m3-l3
    title: Bidirectional and deep RNNs
    file: lessons/m3-l3.md
    minutes: 15
    media: C5_W1.pdf#pages=39-43
  requires:
  - id: m3-practical
    type: practical
    prompt: Run section 1 of the PyTorch notebook, then make the window 200 steps instead of 40. Report test MSE
      for RNN, GRU and LSTM in both cases, and explain the difference. Upload your table.
  - id: m3-explain
    type: explain
    prompt: Explain how the GRU's update gate lets information survive many time steps.
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q9
    - q10
    - q11
    - q12
    pass: 70
- id: m4
  title: 'Day 4: Word embeddings'
  lessons:
  - id: m4-l1
    title: Word representations and using embeddings
    file: lessons/m4-l1.md
    minutes: 30
    media: C5_W2.pdf#pages=2-9
  - id: m4-l2
    title: Analogies, cosine similarity and the embedding matrix
    file: lessons/m4-l2.md
    minutes: 25
    media: C5_W2.pdf#pages=10-15
  requires:
  - id: m4-practical
    type: practical
    prompt: Run section 3 of the PyTorch notebook, then add 'prince' and 'princess' with your own 3-number vectors
