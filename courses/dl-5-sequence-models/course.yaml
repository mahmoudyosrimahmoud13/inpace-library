    type: quiz
    questions:
    - q13
    - q14
    - q15
    - q16
    pass: 70
- id: m5
  title: 'Day 5: Learning embeddings, sentiment and bias'
  lessons:
  - id: m5-l1
    title: Neural language models, word2vec and negative sampling
    file: lessons/m5-l1.md
    minutes: 35
    media: C5_W2.pdf#pages=16-26
  - id: m5-l2
    title: GloVe
    file: lessons/m5-l2.md
    minutes: 15
    media: C5_W2.pdf#pages=27-30
  - id: m5-l3
    title: Sentiment classification and debiasing
    file: lessons/m5-l3.md
    minutes: 25
    media: C5_W2.pdf#pages=31-37
  requires:
  - id: m5-practical
    type: practical
    prompt: Write five short reviews where averaging word vectors would get the sentiment wrong (like the 'good'
      example) and explain for each why reading word order fixes it. Upload them.
  - id: m5-explain
    type: explain
    prompt: 'Explain negative sampling in plain words: what question the model answers, and why it''s faster than
      a full softmax.'
    min_words: 60
  - id: m5-quiz
    type: quiz
    questions:
    - q17
    - q18
    - q19
    - q20
    pass: 70
