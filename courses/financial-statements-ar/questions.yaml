q1:
  text: أي قائمة تغطي يومًا واحدًا وليس فترة؟
  show: 4
  options:
    a: قائمة الدخل
    b: الميزانية
    c: قائمة التغيّر في حقوق الملكية
    d: قائمة التدفقات النقدية
q2:
  text: 'صافي الربح يذهب أولًا إلى:'
  show: 4
  options:
    a: النقدية
    b: رأس المال المدفوع
    c: العملاء
    d: الأرباح المحتجزة، في قائمة التغيّر في حقوق الملكية
q3:
  text: 'الرأي النظيف لمراقب الحسابات يقول إن القوائم:'
  show: 4
  options:
    a: أعدّها المراقب
    b: تُظهر أن الشركة مربحة
    c: تعبّر بعدالة ووضوح، في جميع جوانبها الهامة
    d: خالية من أي خطأ
q4:
  text: في الشركة، ما الذي يحل محل مسحوبات المالك؟
  show: 4
  options:
    a: علاوة الإصدار
    b: المرتبات
    c: الأرباح المحتجزة
    d: توزيعات الأرباح
q5:
  text: 'فرض الاستمرارية يعني:'
  show: 4
  options:
    a: أن المشروع يُتوقع أن يستمر في العمل
    b: أن الربح يجب أن يكون موجبًا
    c: أن الأصول تظهر بسعر الخردة
    d: أن الشركة ستُباع
q6:
  text: 'صافي المبيعات 490,000 وتكلفة البضاعة المباعة 294,000. مجمل الربح:'
  show: 4
  options:
    a: 294,000
    b: 196,000
    c: 56,000
    d: 784,000
q7:
  text: 'ربح التشغيل يُسمّى أيضًا:'
  show: 4
  options:
    a: صافي الدخل
    b: EBITDA
    c: مجمل الربح
    d: EBIT
q8:
  text: 'مجمل ربح 196,000 على صافي مبيعات 490,000 هامشه:'
  show: 4
  options:
    a: 25%
    b: 60%
    c: 40%
    d: 15%
q9:
  text: 'هامش صافي 2% لسوبرماركت مقابل 20% لشركة برمجيات يعني:'
  show: 4
  options:
    a: شركة البرمجيات أكبر عشر مرات
    b: السوبرماركت سيُفلس
    c: السوبرماركت سيئ الإدارة
    d: 'لا شيء وحده: الهوامش تختلف حسب النشاط'
q10:
  text: 'مردودات ومسموحات المبيعات:'
  show: 4
  options:
    a: تُطرح من المبيعات للوصول لصافي المبيعات
    b: مصروف تشغيلي
    c: تزيد مجمل الربح
    d: تُسجَّل كتكلفة بضاعة مباعة
q11:
  text: 'قرض 50,000 منه 10,000 مستحقة السنة القادمة. في الميزانية:'
  show: 4
  options:
    a: الـ 50,000 كلها متداولة
    b: الـ 50,000 كلها غير متداولة
    c: تظهر الفائدة فقط
    d: 10,000 متداول و40,000 غير متداول
q12:
  text: 'أصول متداولة 148,000 وخصوم متداولة 52,000. نسبة التداول:'
  show: 4
  options:
    a: '2.85'
    b: '0.35'
    c: '1.60'
    d: 96,000
q13:
  text: 'النسبة السريعة تستبعد:'
  show: 4
  options:
    a: النقدية
    b: المخزون والمصروفات المدفوعة مقدمًا
    c: العملاء
    d: الخصوم المتداولة
q14:
  text: أيّ هذه لا يظهر عادة في الميزانية؟
  show: 4
  options:
    a: علامة تجارية بنتها الشركة بنفسها
    b: المخزون
    c: قرض بنكي
    d: رخصة برنامج مشتراة من مورّد
q15:
  text: 'الديون إلى حقوق الملكية انخفضت من 1.09 إلى 0.68. هذا يعني:'
  show: 4
  options:
    a: الربح انخفض
    b: الشركة تعتمد على أموال الغير أقل
    c: النقدية أقل
    d: الشركة اقترضت أكثر
q16:
  text: 'مخزون أول المدة 52,000، المشتريات 302,000، مخزون آخر المدة 60,000. تكلفة البضاعة المباعة:'
  show: 4
  options:
    a: 414,000
    b: 294,000
    c: 354,000
    d: 242,000
q17:
  text: 'مخزون آخر المدة جُرد ناقصًا 5,000. الربح:'
  show: 4
  options:
    a: أقل بـ 10,000
    b: أعلى من الحقيقة بـ 5,000
    c: أقل من الحقيقة بـ 5,000
    d: صحيح
q18:
  text: '100 وحدة بـ 10، و200 بـ 12، و100 بـ 15؛ بيع 300. تكلفة FIFO:'
  show: 4
  options:
    a: 3,400
    b: 3,900
    c: 4,900
    d: 3,675
q19:
  text: أي طريقة غير مسموحة في IFRS والمعايير المصرية؟
  show: 4
  options:
    a: LIFO
    b: التمييز العيني
    c: FIFO
    d: المتوسط المرجّح
q20:
  text: 'بضاعة تكلفتها 8 للوحدة ولن تُباع الآن إلا بـ 5 مع 0.50 تكاليف بيع. يظهر المخزون بـ:'
  show: 4
  options:
    a: 8 للوحدة
    b: 5.50 للوحدة
    c: 5 للوحدة
    d: 4.50 للوحدة
q21:
  text: 'العملاء 46,500 والمخصص 1,500. صافي العملاء:'
  show: 4
  options:
    a: 1,500
    b: 45,000
    c: 46,500
    d: 48,000
q22:
  text: 'إعدام دين عميل معيّن بطريقة المخصص:'
  show: 4
  options:
    a: يغيّر صافي العملاء
    b: مدين المخصص ودائن العملاء
    c: مدين مصروف الديون المعدومة
    d: دائن النقدية
q23:
  text: 'التكلفة 50,000، القيمة التخريدية 5,000، 5 سنوات. الإهلاك السنوي بالقسط الثابت:'
  show: 4
  options:
    a: 45,000
    b: 20,000
    c: 10,000
    d: 9,000
q24:
  text: 'إهلاك السنة الأولى بالمتناقص المضاعف لنفس الماكينة:'
  show: 4
  options:
    a: 9,000
    b: 20,000
    c: 10,000
    d: 18,000
q25:
  text: 'قيمة دفترية 23,000 بيعت بـ 25,000. النتيجة:'
  show: 4
  options:
    a: ربح 2,000
    b: لا ربح ولا خسارة
    c: إيراد 25,000
    d: خسارة 2,000
q26:
  text: 'دفعة قرض 14,000 منها 10,000 أصل و4,000 فائدة. المصروف:'
  show: 4
  options:
    a: 14,000
    b: 10,000
    c: 4,000
    d: '0'
q27:
  text: 'ربح التشغيل 74,000 والفوائد 4,000. تغطية الفوائد:'
  show: 4
  options:
    a: 0.05 مرة
    b: 78,000
    c: 70,000
    d: 18.5 مرة
q28:
  text: 'قضية ستخسرها الشركة غالبًا، وتقديرها موثوق:'
  show: 4
  options:
    a: تُذكر في الإيضاحات فقط
    b: تُسجَّل مخصصًا
    c: تُتجاهل حتى تُدفع
    d: تُسجَّل أصلًا
q29:
  text: 'توزيعات الأرباح المُقرّة:'
  show: 4
  options:
    a: تقلّل الأرباح المحتجزة مباشرة
    b: تزيد رأس المال
    c: مصروف تشغيلي
    d: تقلّل الإيرادات
q30:
  text: 'أرباح محتجزة أول المدة 8,000، صافي الربح 56,000، آخر المدة 56,000. التوزيعات:'
  show: 4
  options:
    a: 48,000
    b: 56,000
    c: 8,000
    d: '0'
q31:
  text: 'شراء معدات نقدًا تدفق:'
  show: 4
  options:
    a: استثماري
    b: تمويلي
    c: تشغيلي
    d: بند غير نقدي
q32:
  text: 'دفع التوزيعات غالبًا تدفق:'
  show: 4
  options:
    a: تمويلي
    b: بند غير نقدي
    c: استثماري
    d: مصروف تشغيلي
q33:
  text: 'في الطريقة غير المباشرة، الإهلاك:'
  show: 4
  options:
    a: يظهر في الاستثمار
    b: يُضاف إلى صافي الربح
    c: يُطرح من صافي الربح
    d: يُتجاهل
q34:
  text: 'العملاء زادوا 7,000. في الطريقة غير المباشرة:'
  show: 4
  options:
    a: تضيف 7,000
    b: تتجاهلها
    c: تطرح 7,000
    d: تضعها في الاستثمار
q35:
  text: 'نقدية التشغيل 56,000 والإنفاق الرأسمالي 20,000. التدفق النقدي الحر:'
  show: 4
  options:
    a: 76,000
    b: 20,000
    c: 36,000
    d: 56,000
q36:
  text: 'أيام المخزون 70، فترة التحصيل 31، فترة السداد 37. دورة تحويل النقدية:'
  show: 4
  options:
    a: 6 أيام
    b: 76 يومًا
    c: 138 يومًا
    d: 64 يومًا
q37:
  text: ROE = هامش صافي الربح × معدل دوران الأصول × ...؟
  show: 4
  options:
    a: نسبة التداول
    b: هامش مجمل الربح
    c: تغطية الفوائد
    d: مضاعف حقوق الملكية (الأصول ÷ حقوق الملكية)
q38:
  text: أيّ هذه علامة خطر؟
  show: 4
  options:
    a: تغطية فوائد 15 مرة
    b: مبيعات تزيد بهوامش ثابتة
    c: ديون تقل
    d: تدفق تشغيلي أقل بكثير من صافي الربح لعدة سنوات
q39:
  text: 'معدل دوران الأصول يقيس:'
  show: 4
  options:
    a: الديون لكل وحدة حقوق ملكية
    b: الربح لكل وحدة مبيعات
    c: المبيعات المحقّقة لكل وحدة أصول
    d: النقدية لكل وحدة خصوم
q40:
  text: 'أفضل طريقة للحكم على نسبة واحدة:'
  show: 4
  options:
    a: تجاهلها لو أقل من 1
    b: مقارنتها بالسنوات السابقة وبشركات مشابهة
    c: استخدامها وحدها للقرار
    d: البحث عنها في جدول قيم جيدة
