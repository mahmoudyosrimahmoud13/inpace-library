    file: lessons/m7-l1.md
    minutes: 25
    media: C4_W4.pdf#pages=2-7
  - id: m7-l2
    title: Siamese networks and triplet loss
    file: lessons/m7-l2.md
    minutes: 35
    media: C4_W4.pdf#pages=8-18
  requires:
  - id: m7-practical
    type: practical
    prompt: 'Run section 10 of the PyTorch notebook. Then compute the triplet loss by hand for 2-number embeddings:
      f(A) = (1, 0), f(P) = (0.8, 0.2), f(N) = (0.6, 0.5), α = 0.2. Upload your working and the result.'
  - id: m7-explain
