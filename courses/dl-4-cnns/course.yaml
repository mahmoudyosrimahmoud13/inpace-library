      Upload your code and results.
  - id: m5-explain
    type: explain
    prompt: Explain non-max suppression step by step, as if to a new teammate.
    min_words: 60
  - id: m5-quiz
    type: quiz
    questions:
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m6
  title: 'Day 6: Region proposals and segmentation'
  lessons:
  - id: m6-l1
    title: Region proposals (R-CNN family)
    file: lessons/m6-l1.md
    minutes: 15
    media: C4_W3.pdf#pages=34-36
  - id: m6-l2
    title: Semantic segmentation with U-Net
    file: lessons/m6-l2.md
    minutes: 35
    media: C4_W3.pdf#pages=37-47
  requires:
  - id: m6-practical
    type: practical
    prompt: Draw a small U-Net for 64×64 images (two levels down, two up) with the shape of every tensor and where
      each skip connection goes. Then build it in PyTorch and check that a 1×3×64×64 input gives a 1×C×64×64 output.
      Upload both.
  - id: m6-explain
    type: explain
    prompt: Explain why U-Net needs skip connections, in your own words.
    min_words: 60
  - id: m6-quiz
    type: quiz
    questions:
