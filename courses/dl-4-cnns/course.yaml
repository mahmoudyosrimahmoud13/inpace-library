id: dl-4-cnns
title: 'Deep Learning 4: convolutional networks and computer vision'
version: 1
language: en
description: 'Part 4 of a refresh of Andrew Ng''s Deep Learning Specialization, with the original slides in each
  lesson and everything updated for PyTorch 2.15, torchvision 0.29 and Keras 3.15: convolutions, padding and strides,
  pooling, LeNet to ResNet, 1×1 convolutions, Inception, MobileNet and EfficientNet, transfer learning and augmentation,
  YOLO, IoU, non-max suppression, anchor boxes, U-Net, face recognition with triplet loss, and neural style transfer,
  plus what changed since (vision transformers, modern detectors). Notebooks for Colab, as files and PDFs, and new
  charts. Plan: 9 days. Slides by DeepLearning.AI (CC BY-SA 2.0, non-commercial).'
image: cover.jpg
modules:
- id: m1
  title: 'Day 1: Convolutions'
  lessons:
  - id: m1-l1
    title: Start here
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: Computer vision and edge detection
    file: lessons/m1-l2.md
    minutes: 30
    media: C4_W1.pdf#pages=2-12
  - id: m1-l3
    title: Padding, strides and output size
    file: lessons/m1-l3.md
    minutes: 30
    media: C4_W1.pdf#pages=13-19
  requires:
  - id: m1-practical
    type: practical
    prompt: 'By hand, compute the output size for: a 64×64 image with a 5×5 filter, p = 0, s = 1; the same with
      p = 2; a 227×227 image with an 11×11 filter, s = 4, p = 0. Then check them with nn.Conv2d in Colab. Upload
      both.'
  - id: m1-explain
    type: explain
    prompt: Explain why a CNN learns its filters instead of using hand-made edge detectors, and why that's better.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    pass: 70
- id: m2
  title: 'Day 2: Convolution layers, pooling, and why convolutions'
  lessons:
  - id: m2-l1
    title: Convolutions over volumes, and one layer
    file: lessons/m2-l1.md
    minutes: 30
    media: C4_W1.pdf#pages=20-27
  - id: m2-l2
    title: A simple CNN, and pooling
    file: lessons/m2-l2.md
    minutes: 30
    media: C4_W1.pdf#pages=28-38
  - id: m2-l3
    title: Why convolutions work
    file: lessons/m2-l3.md
    minutes: 20
    media: C4_W1.pdf#pages=39-42
  requires:
  - id: m2-practical
    type: practical
    prompt: 'Compute the parameters and output shapes, layer by layer, for: input 32×32×3 → CONV 6 filters 5×5,
      s=1, valid → MAXPOOL 2×2 → CONV 16 filters 5×5 → MAXPOOL 2×2 → FC 120 → FC 84 → softmax 10. Then build it
      in PyTorch and print the shapes to check. Upload both.'
  - id: m2-explain
    type: explain
    prompt: Explain parameter sharing and sparse connections, and why they matter for images.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q5
    - q6
    - q7
    - q8
    pass: 70
- id: m3
  title: 'Day 3: Classic networks, ResNets and Inception'
  lessons:
  - id: m3-l1
    title: LeNet-5, AlexNet and VGG-16
    file: lessons/m3-l1.md
    minutes: 25
    media: C4_W2.pdf#pages=2-7
  - id: m3-l2
    title: Residual networks
    file: lessons/m3-l2.md
    minutes: 35
    media: C4_W2.pdf#pages=8-13
  - id: m3-l3
    title: 1×1 convolutions and Inception
    file: lessons/m3-l3.md
    minutes: 30
    media: C4_W2.pdf#pages=14-24
  requires:
  - id: m3-practical
    type: practical
    prompt: Run sections 5 and 6 of the PyTorch notebook. Then build a plain 20-layer CNN and a 20-layer one made
      of residual blocks, train both for 5 epochs on digits, and compare. Upload your code and results.
  - id: m3-explain
    type: explain
    prompt: Explain why adding a residual block can't make a ResNet much worse, using the identity function.
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q9
    - q10
    - q11
    - q12
    pass: 70
- id: m4
  title: 'Day 4: MobileNet, EfficientNet and practical advice'
  lessons:
  - id: m4-l1
    title: 'MobileNet: depthwise separable convolutions'
    file: lessons/m4-l1.md
    minutes: 30
    media: C4_W2.pdf#pages=25-39
  - id: m4-l2
    title: EfficientNet, and what came after
    file: lessons/m4-l2.md
    minutes: 20
    media: C4_W2.pdf#pages=40-41
  - id: m4-l3
    title: Transfer learning, augmentation and the state of vision
    file: lessons/m4-l3.md
    minutes: 30
    media: C4_W2.pdf#pages=42-51
  requires:
  - id: m4-practical
    type: practical
    prompt: In Colab, fine-tune a pre-trained ResNet-18 (notebook section 9) on a small image folder of your own
      (2 or 3 classes, about 30 images each, torchvision.datasets.ImageFolder). Upload your accuracy and three predictions.
  - id: m4-explain
    type: explain
    prompt: Explain depthwise separable convolution in two steps, and why it's so much cheaper.
    min_words: 60
  - id: m4-quiz
    type: quiz
    questions:
    - q13
    - q14
    - q15
    - q16
    pass: 70
- id: m5
  title: 'Day 5: Object detection'
  lessons:
  - id: m5-l1
    title: Localization and landmarks
    file: lessons/m5-l1.md
    minutes: 20
    media: C4_W3.pdf#pages=2-7
  - id: m5-l2
    title: Sliding windows and YOLO
    file: lessons/m5-l2.md
    minutes: 30
    media: C4_W3.pdf#pages=8-18
  - id: m5-l3
    title: IoU, non-max suppression and anchor boxes
    file: lessons/m5-l3.md
    minutes: 35
    media: C4_W3.pdf#pages=19-33
