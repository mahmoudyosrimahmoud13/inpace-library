    ob57732: FastAPI doesn't support Python 3.10
    o94051d: Starlette is faster at JSON validation
    o799aec: Starlette has OpenAPI docs
    o20553c: It serves HTML forms to one local user, not a JSON API
    oda5394: FastAPI can't serve HTML
