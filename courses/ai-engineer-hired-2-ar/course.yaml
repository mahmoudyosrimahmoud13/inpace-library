id: ai-engineer-hired-2-ar
title: 'التوظيف مهندس ذكاء اصطناعي 2: برنامج مقابلات البرمجة المكثف'
version: 1
language: ar
description: 'اثنا عشر أسبوعًا من التدريب المتعمد على جولات البرمجة التي يواجهها مهندسو الذكاء الاصطناعي: الطريقة
  التي يقيّمها المقابِلون، وتعقيد Big-O وأدوات بايثون، وكل أنماط LeetCode الكبرى مع القوالب ونحو 130 مسألة متدرجة،
  وبرمجة تعلّم الآلة من الصفر بـ NumPy، والجولات بمساعدة الذكاء الاصطناعي، وجولات التنفيذ على طبقات (مشروع TinyKV)،
  والمقابلات التجريبية. مبنية على Tech Interview Handbook وNeetCode ودليل هندسة الذكاء الاصطناعي.'
image: cover.jpg
modules:
- id: m1
  title: كيف تسير مقابلات البرمجة
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: البرنامج المكثف'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: كيف تُقيَّم
    file: lessons/m1-l2.md
    minutes: 15
  - id: m1-l3
    title: 'الطريقة: ست خطوات بصوت عالٍ'
    file: lessons/m1-l3.md
    minutes: 20
  - id: m1-l4
    title: أدوات بايثون وتعقيد Big-O
    file: lessons/m1-l4.md
    minutes: 25
  requires:
  - id: m1-practical
    type: practical
    prompt: جهّز جدول متتبعك بالأعمدة المذكورة في «ابدأ من هنا»، ثم حلّ 3 مسائل سهلة بالخطوات الست وبصوت عالٍ، مع
      تسجيل صوتك أو شاشتك (Two Sum وValid Anagram وContains Duplicate). ارفع المتتبع وتسجيلًا واحدًا.
  - id: m1-explain
    type: explain
    prompt: استمع إلى تسجيلك. وقيّم نفسك بصدق بالمجالات الأربعة لمعايير التقييم، واكتب ما ستفعله بشكل مختلف في المسألة
      التالية.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    pass: 70
