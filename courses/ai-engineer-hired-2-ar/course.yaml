- id: m11
  title: برمجة تعلّم الآلة من الصفر
  lessons:
  - id: m11-l1
    title: NumPy التي يجب أن تتقنها
    file: lessons/m11-l1.md
    minutes: 25
  - id: m11-l2
    title: خمسة تنفيذات يجب أن تعرفها جيدًا
    file: lessons/m11-l2.md
    minutes: 45
  - id: m11-l3
    title: جولات البرمجة بمساعدة الذكاء الاصطناعي
    file: lessons/m11-l3.md
    minutes: 15
  requires:
  - id: m11-practical
    type: practical
    prompt: 'في دفتر واحد أو ملف `.py`، نفّذ الخمسة من الذاكرة (دون ملاحظات ودون ذكاء اصطناعي) مع اختبار لكل منها:
      قارن softmax وcross-entropy بنسخة بطيئة بالحلقات، وأكبر k بتشابه جيب التمام بحل بدائي مرتب، ودقة الانحدار
      اللوجستي على بيانات تجريبية (`sklearn.datasets.make_classification` مناسبة)، وk-means على 3 تجمعات واضحة،
      وأن الصف الأول من الانتباه السببي يساوي V[0]. ارفعه مع الوقت الذي استغرقه كل تنفيذ.'
  - id: m11-explain
    type: explain
    prompt: 'اشرح الانتباه بالضرب النقطي المُقيَّس لمقابِل: أبعاد Q وK وV، وماذا تحسب كل خطوة، ولماذا التقسيم على
      √d، وماذا يفعل القناع السببي.'
    min_words: 100
  - id: m11-quiz
