      الحلول المقبولة وملف ملاحظاتك: لكل مسألة النمط، والفكرة الأساسية في سطر، وتعقيد الوقت والذاكرة.'
  - id: m2-explain
    type: explain
    prompt: 'إجابة مقابلة مكتوبة: كيف تحل *Longest Consecutive Sequence* في O(n)؟ اذكر الحل البدائي أولًا، ثم اشرح
      لماذا يكون حلك الأمثل O(n) رغم وجود حلقة داخل حلقة.'
