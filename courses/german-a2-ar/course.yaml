id: german-a2-ar
title: 'الألماني A2: احكِ عن الماضي واشرح الأسباب'
version: 2
language: ar
description: 'الألماني مستوى A2، بالشرح العربي وبنفس طريقة A1 المبنية على الأبحاث: محادثة حقيقية أولًا، والعبارات التي يستخدمها
  الناس، وقاعدة واحدة في كل وحدة، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة. احكِ ما فعلته (Perfekt مع haben وsein)، واستخدم
  حالة الجر Dativ، وقارن واشترِ ملابس، وتكلّم مع الطبيب واشرح الأسباب بـ weil وdass، وانتقل إلى شقة مع حروف الجر ذات الاتجاهين.
  وينتهي باختبار مستوى A2. حوالي أسبوعين، 45 دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'DW تعلّم الألمانية: دورات مجانية من A1 إلى B1، ومنها مسلسل Nicos Weg (وفيها واجهة عربية)'
  url: https://learngerman.dw.com/
- title: 'Easy German: مقابلات في الشارع مع ترجمة (YouTube)'
  url: https://www.youtube.com/@EasyGerman
- title: 'dict.cc: قاموس ألماني مع نطق صوتي'
  url: https://www.dict.cc/
modules:
- id: m1
  title: 'الوحدة 1: عطلة نهاية الأسبوع الماضية'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: ماذا فعلت؟
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: الماضي التام Perfekt مع haben
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): عطلة نهاية الأسبوع الماضية، بستة أفعال على الأقل في الـ Perfekt. ارفعه.'
  - id: m1-explain
    type: explain
    prompt: اكتب 5 جمل بالألمانية عمّا فعلته أمس.
    min_words: 30
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'الوحدة 2: رحلة'
