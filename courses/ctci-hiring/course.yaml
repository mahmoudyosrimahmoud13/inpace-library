id: ctci-hiring
title: 'Cracking the Coding Interview: get hired as a software engineer, from zero'
version: 1
language: en
description: 'The whole software engineering hiring process, from your CV to your offer, following Cracking the Coding Interview
  (6th edition) by Gayle Laakmann McDowell part by part. How companies hire and how interviewers judge you; your CV and behavioral
  stories; Big O with code that counts the work; a step-by-step method for any technical question; the question chapters (arrays
  and strings, linked lists, stacks and queues, trees and graphs, bits and maths, recursion and dynamic programming, sorting
  and searching, object-oriented and system design, testing, databases, threads); mock interviews; offers and negotiation.
  Each Read lesson opens the right pages of your own copy of the book; every other lesson has working Python code and verified
  LeetCode problems to practise. For beginners who can write simple programs. Plan: 8 days, about an hour a day, then weeks
  of practice.'
image: cover.jpg
book: ctci.pdf
book_info:
  title: Cracking the Coding Interview, 6th edition
  url: https://www.crackingthecodinginterview.com/
  pages: 708
downloads:
- title: Cracking the Coding Interview (the author's site, with errata and resources)
  url: https://www.crackingthecodinginterview.com/
modules:
- id: m1
  title: 'Day 1: How tech companies hire'
  lessons:
  - id: m1-l1
    title: 'Start here: how this course gets you hired'
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: 'Read: the interview process, behind the scenes, special situations (Parts I to III)'
    file: lessons/m1-l2.md
    minutes: 45
    media: ctci.pdf#pages=15-36
  - id: m1-l3
    title: The hiring loop, and what interviewers judge
    file: lessons/m1-l3.md
    minutes: 20
  requires:
  - id: m1-practical
    type: practical
    prompt: Choose one company you'd like to work for. Find its current interview steps (careers pages and recent candidate
      reports) and write them as a list from application to offer. Next to each step, write what you need to prepare for it.
      Hand in the list.
  - id: m1-explain
    type: explain
    prompt: Explain why thinking out loud matters in a coding interview, using the four things interviewers write down about
      you.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'Day 2: Your experience, your CV and your stories'
  lessons:
  - id: m2-l1
    title: 'Read: before the interview (Part IV)'
    file: lessons/m2-l1.md
    minutes: 30
    media: ctci.pdf#pages=37-42
  - id: m2-l2
    title: A CV that gets you to the interview
    file: lessons/m2-l2.md
    minutes: 25
  - id: m2-l3
    title: 'Behavioral questions: your stories, ready before the interview (Part V)'
    file: lessons/m2-l3.md
    minutes: 35
    media: ctci.pdf#pages=43-48
  requires:
  - id: m2-practical
    type: practical
    prompt: 'Rewrite your CV with the lesson''s checklist: one page, one column, a result in every bullet. Then build your
      preparation grid with at least 5 stories, and write out one of them as situation, action, result. Hand in your CV (as
      a PDF) and your grid.'
  - id: m2-explain
    type: explain
    prompt: Explain what makes a CV bullet strong, and rewrite one weak bullet of your own as an example.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'Day 3: Big O'
  lessons:
  - id: m3-l1
    title: 'Read: Big O (Part VI)'
    file: lessons/m3-l1.md
    minutes: 45
    media: ctci.pdf#pages=49-70
  - id: m3-l2
    title: 'Build: watch Big O happen in Python'
    file: lessons/m3-l2.md
    minutes: 35
  requires:
  - id: m3-practical
    type: practical
    prompt: Do at least ten of the book's Big O examples and exercises before checking the answers. Then write two Python
      functions of your own that solve the same task in O(n²) and in O(n), count their steps for four sizes of input as in
      the Build lesson, and hand in the code and its output.
  - id: m3-explain
    type: explain
    prompt: Explain, with an example of your own, why a loop that uses `x in my_list` inside it can be O(n²).
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'Day 4: A method for any technical question'
  lessons:
  - id: m4-l1
    title: 'Read: technical questions (Part VII)'
    file: lessons/m4-l1.md
    minutes: 40
    media: ctci.pdf#pages=71-92
  - id: m4-l2
    title: 'Build: one problem, from brute force to the best solution'
    file: lessons/m4-l2.md
    minutes: 40
  - id: m4-l3
    title: 'Practice: your first five problems, out loud'
    file: lessons/m4-l3.md
    minutes: 60
  requires:
  - id: m4-practical
    type: practical
    prompt: Solve the LeetCode problems listed in today's lessons, with a timer and out loud. Hand in a link to a document
      or repository with your code for each one, its Big O, how long it took, and one line on what you missed.
  - id: m4-explain
    type: explain
    prompt: Explain the best conceivable runtime (BCR) and how it tells you when to stop optimizing, using the stock price
      problem.
    min_words: 60
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
