  show: 4
  options:
    a: يسرّع ترجمة main
    b: يخفي الـ functions
    c: يحمي الملف من الهاكرز
    d: يتجنب أخطاء التعريف المكرر عندما تتضمن الـ headers بعضها
    e: يجعل الـ header خاصًا
    f: يمنع تضمين header file مرتين
q28:
  text: 'لبناء main.c وgrades.c معًا تكتب:'
  show: 4
  options:
    a: gcc grades.h
    b: gcc -c لكل ملف، ثم ربط ملفات .o
    c: gcc main.c -o grades
    d: make main.c
    e: gcc main.c grades.c -o grades
    f: gcc grades.c -o grades
q29:
  text: 'argv[0] تحتوي على:'
  show: 4
  options:
    a: أول معامل بعده
    b: اسم البرنامج
    c: عدد المعاملات
    d: الاسم المستخدم لتشغيل البرنامج
    e: لا شيء
    f: آخر معامل
q30:
  text: في gdb، أي أمر يبيّن الـ functions التي أوصلت إلى السطر الحالي؟
  show: 4
  options:
    a: backtrace
    b: next
    c: step
    d: print
    e: run
    f: bt (اختصار backtrace)
