id: cma-part-1-for-complete-beginners-12-weeks-through-sections-
title: 'CMA Part 1 for Complete Beginners: 12 Weeks Through Sections A–F'
version: '1'
description: A gentle, twelve-week self-study course built on your 171-page 'CMA Part 1' study guide (2026
  edition). It starts with the accounting basics a total beginner needs, then walks through every unit
  of Sections A to F in the book's own order, with simple explanations, worked examples, tables and a
  short exam-style quiz after every module.
language: en
modules:
- id: m1
  title: 'Module 1 — Foundations: accounting basics, the 2026 exam and your study plan'
  lessons:
  - id: m1-l1
    title: 'Lesson 1.1: Accounting basics part 1 — the equation, accounts, debits and credits'
    file: lessons/m1-l1.md
    media: CMA_Part1_Study_Material.pdf#pages=2-5
    minutes: 80
  - id: m1-l2
    title: 'Lesson 1.2: Accounting basics part 2 — the cycle, accrual accounting and the vocabulary of
      CMA'
    file: lessons/m1-l2.md
    media: CMA_Part1_Study_Material.pdf#pages=6-7
    minutes: 80
  - id: m1-l3
    title: 'Lesson 1.3: How the 2026 exam works and how to build your 12-week plan'
    file: lessons/m1-l3.md
    media: CMA_Part1_Study_Material.pdf#pages=8-9
    minutes: 80
  requires:
  - id: m1-r1
    type: practical
    prompt: Write a one-page 'accounting basics cheat sheet' (photo, PDF or document) with the accounting
      equation, the debit/credit rules for the five account types, the eight steps of the accounting cycle
      and three transactions of your own with their journal entries. Keep it — you will reuse it all course.
  - id: m1-r2
    type: explain
    prompt: In your own words and in five sentences or fewer, explain the difference between cash accounting
      and accrual accounting, using a small example of a sale where the customer pays later.
    min_words: 40
  - id: m1-r3
    type: quiz
    prompt: 'Quiz: 4 questions, 70% to pass.'
    questions:
    - q1
    - q2
    - q3
    - q4
    pass: 70
- id: m2
  title: 'Module 2 — Section A, Unit 01: Financial statements (pages 11-20)'
  lessons:
  - id: m2-l1
    title: 'Lesson 2.1: Users, the balance sheet and the income statement'
    file: lessons/m2-l1.md
    media: CMA_Part1_Study_Material.pdf#pages=11-13
    minutes: 80
  - id: m2-l2
    title: 'Lesson 2.2: Comprehensive income, the cash flow statement and how the statements link'
    file: lessons/m2-l2.md
    media: CMA_Part1_Study_Material.pdf#pages=14-16
    minutes: 80
  - id: m2-l3
    title: 'Lesson 2.3: Consolidation and integrated reporting'
    file: lessons/m2-l3.md
    media: CMA_Part1_Study_Material.pdf#pages=17-20
    minutes: 80
  requires:
  - id: m2-r1
    type: practical
    prompt: Draw a one-page 'statements map' file (photo or PDF) showing the four statements as boxes
      with arrows for net income, OCI, dividends and closing cash. Add your own numbers for a made-up
      company and mark where consolidation and goodwill appear.
  - id: m2-r2
    type: explain
    prompt: Explain in your own words why a profitable company can still run out of cash. Use at least
      two balance-sheet items and one cash-flow category in your answer.
    min_words: 40
  - id: m2-r3
    type: quiz
    prompt: 'Quiz: 4 questions, 70% to pass.'
    questions:
    - q5
    - q6
    - q7
    - q8
    pass: 70
- id: m3
  title: 'Module 3 — Section A, Unit 02: Recognising and measuring assets (pages 21-30)'
