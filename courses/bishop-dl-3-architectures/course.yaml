id: bishop-dl-3-architectures
title: 'Deep Learning (Bishop) 3: convolutional networks, transformers and graph networks'
version: 1
language: en
description: 'Part 3 of 5, following Deep Learning: Foundations and Concepts by Christopher M. Bishop and Hugh Bishop (Springer,
  2024), chapters 10, 12 and 13. Convolutional networks, attention and transformers, language models and sampling, and graph
  neural networks. Each Read lesson opens the right pages of your own copy of the book (the Springer PDF, or read free online
  at bishopbook.com). Big projects on your own NumPy deep learning library: a CNN made robust to shifts, a small GPT-style
  transformer that learns to sort, and a graph network that predicts the split of a karate club from two labels. Plan: 7 days.'
image: cover.jpg
book: bishop.pdf
book_info:
  title: 'Deep Learning: Foundations and Concepts'
  url: https://www.bishopbook.com
  pages: 656
modules:
- id: m1
  title: 'Day 1: Convolutional filters'
  lessons:
  - id: m1-l1
    title: Start here
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: 'Read: computer vision and convolutional filters (10.1–10.2)'
    file: lessons/m1-l2.md
    minutes: 50
    media: bishop.pdf#pages=303-318
  - id: m1-l3
    title: 'Watch: But what is a convolution?'
    file: lessons/m1-l3.md
    minutes: 23
    media: https://www.youtube.com/watch?v=KuXjwB4LzSA
  - id: m1-l4
    title: 'Build: convolution, equivariance and pooling in NumPy'
    file: lessons/m1-l4.md
    minutes: 30
  - id: m1-l5
    title: 'Module project: build an image classifier for CIFAR-10'
    file: lessons/m1-l5.md
    minutes: 120
    media: project-1-cifar-cnn.ipynb
  requires:
  - id: m1-practical
    type: practical
    prompt: Build the module project yourself and push it to your own GitHub repository, with a README that has a results
      table. Then do at least one idea from Make it yours and add its result to the README. Hand in the link to your repository.
    optional: true
  - id: m1-explain
    type: explain
    prompt: Explain the difference between translation equivariance and translation invariance, and which parts of a CNN provide
      each.
    min_words: 60
    optional: true
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
