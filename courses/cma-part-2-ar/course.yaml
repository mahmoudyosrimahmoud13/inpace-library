id: cma-part-2-ar
title: 'CMA الجزء الثاني: الإدارة المالية الاستراتيجية خطوة بخطوة'
version: 1
language: ar
description: 'تحضير كامل لامتحان CMA الجزء الثاني (امتحان 2026 بأسئلة الحالات)، بكلام بسيط وأمثلة محلولة واختبار بأسلوب الامتحان
  بعد كل وحدة: القيمة الزمنية للنقود؛ القسم A تحليل القوائم المالية (النسب، ديبونت، ربحية السهم، جودة الأرباح)؛ القسم B تمويل
  الشركات (CAPM، تقييم السندات والأسهم، WACC، هيكل رأس المال، رأس المال العامل، التمويل، التوزيعات، التمويل الدولي)؛ القسم
  C تحليل القرارات (التكلفة والحجم والربح، التحليل الحدّي، التسعير، عدم التأكد)؛ القسم D إدارة المخاطر؛ القسم E قرارات الاستثمار
  (التدفقات، NPV، IRR، فترة الاسترداد، الخيارات الحقيقية)؛ القسم F الأخلاقيات المهنية (قائمة IMA، الاحتيال، الحوكمة)؛ وورقة
  قوانين واستراتيجية للامتحان. يأتي بعد CMA الجزء الأول في المكتبة. حوالي 10 أسابيع، 12 إلى 15 ساعة أسبوعيًا.'
image: cover.jpg
downloads:
- title: 'IMA: امتحان CMA ومخططات محتواه (بالإنجليزية)'
  url: https://www.imanet.org/cma-certification
modules:
- id: m1
  title: 'الوحدة 1: الامتحان والقيمة الزمنية للنقود'
  lessons:
  - id: m1-l1
    title: 'ابدأ هنا: CMA الجزء الثاني وكيف تنجح فيه'
    file: lessons/m1-l1.md
    minutes: 30
  - id: m1-l2
    title: 'القيمة الزمنية للنقود: الأداة وراء الجزء الثاني'
    file: lessons/m1-l2.md
    minutes: 60
  requires:
  - id: m1-practical
    type: practical
    prompt: اعمل خطة مذاكرة من صفحة واحدة لموعد امتحانك، ثم ابنِ ورقة Excel تحسب PV وFV ودفعات الأقساط وNPV وIRR لثلاثة أمثلة
      من عندك، وتحقق من كل واحد يدويًا بالقوانين. ارفع الاثنين.
  - id: m1-explain
    type: explain
    prompt: اشرح بالأرقام لماذا 10,000 تستلمها بعد ثلاث سنوات أقل قيمة من 10,000 اليوم.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    - q6
    pass: 70
