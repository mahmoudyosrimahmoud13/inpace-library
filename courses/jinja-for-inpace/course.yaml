id: jinja-for-inpace
title: 'Jinja templates: how inPace draws every page'
version: 1
language: en
description: 'A four-day course on Jinja2, taught through inPace''s 50 templates: syntax, filters, autoescaping
  and Markup, inheritance with blocks, includes with context, macros, the Environment with custom globals and filters,
  the i18n extension, testing and security. Interview questions every day. Plan: 4 days, about 1.5 hours a day.'
image: cover.jpg
modules:
- id: m1
  title: 'Day 1: Templates, variables, filters and escaping'
  lessons:
  - id: m1-l1
    title: Start here, and the three kinds of tags
    file: lessons/m1-l1.md
    minutes: 25
  - id: m1-l2
    title: Filters and tests
    file: lessons/m1-l2.md
    minutes: 20
  - id: m1-l3
    title: Autoescaping and Markup
    file: lessons/m1-l3.md
    minutes: 25
  requires:
  - id: m1-practical
    type: practical
    prompt: Write a script that renders a template showing a list of courses with a progress bar, using if/elif/else,
      for/else, three filters and one test. Render it with a name containing <script> and show it's escaped. Upload
      the template, script and output HTML.
  - id: m1-explain
    type: explain
    prompt: Explain autoescaping and Markup. When is it right to return Markup from a Python function, and when
      is it dangerous?
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    pass: 70
- id: m2
  title: 'Day 2: Inheritance, includes and macros'
  lessons:
  - id: m2-l1
    title: One base, fifty pages
    file: lessons/m2-l1.md
    minutes: 25
  - id: m2-l2
    title: Includes with context
    file: lessons/m2-l2.md
    minutes: 15
  - id: m2-l3
    title: 'Macros: functions for markup'
    file: lessons/m2-l3.md
    minutes: 25
  requires:
  - id: m2-practical
    type: practical
    prompt: Make a base.html with title, width and main blocks; two pages that extend it (one using super()); a
      partial included with `with`; and a macro library imported with `import ... as`. Upload the templates and
      the rendered output.
  - id: m2-explain
    type: explain
    prompt: Compare include, import (macros) and extends. When would you use each?
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q5
    - q6
    - q7
    - q8
    pass: 70
- id: m3
  title: 'Day 3: The Environment: globals, filters and translation'
  lessons:
  - id: m3-l1
    title: Setting up the Environment
    file: lessons/m3-l1.md
    minutes: 25
  - id: m3-l2
    title: Translation with the i18n extension
    file: lessons/m3-l2.md
    minutes: 25
  - id: m3-l3
    title: Custom filters and tests you write
    file: lessons/m3-l3.md
    minutes: 15
  requires:
  - id: m3-practical
    type: practical
    prompt: Add a Jinja Environment with two globals, two filters, one test and the i18n extension with a tiny English
      to Arabic dictionary. Render one page in both languages. Upload the code and both outputs.
  - id: m3-explain
    type: explain
    prompt: What would break in inPace's translation if many users with different languages used one server at the
      same time? How would you fix it?
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q9
    - q10
    - q11
    - q12
    pass: 70
- id: m4
  title: 'Day 4: Testing, performance, security, interview drill'
  lessons:
  - id: m4-l1
    title: Testing templates
    file: lessons/m4-l1.md
    minutes: 20
  - id: m4-l2
    title: Performance and security checklist
    file: lessons/m4-l2.md
    minutes: 20
  - id: m4-l3
    title: Interview drill
    file: lessons/m4-l3.md
    minutes: 25
  requires:
  - id: m4-practical
    type: practical
    prompt: 'Write 5 pytest tests for your Day 2-3 templates: escaping, a missing variable with StrictUndefined,
      translation in both languages, a macro''s output, and tojson inside a script. Upload the tests and the passing
      output.'
  - id: m4-explain
    type: explain
    prompt: 'An interviewer asks: ''What''s the difference between XSS and SSTI, and how does Jinja help with each?''
      Answer.'
    min_words: 70
  - id: m4-quiz
    type: quiz
    questions:
    - q13
    - q14
    - q15
    - q16
    pass: 70
