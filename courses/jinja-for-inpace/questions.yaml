q7:
  text: What does {% with x=1 %}{% include 'p.html' %}{% endwith %} achieve?
  show: 4
  options:
    od08d93: x becomes global for every page
    o939d33: It's a syntax error
    oce6962: p.html can't see the rest of the context
    o2e33aa: p.html sees x=1 while it renders
    oa49557: x is only set inside the with block
    od5fbc1: It caches p.html
q8:
