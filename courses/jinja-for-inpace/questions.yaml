  show: 4
  options:
    o919822: Because of autoescaping
    ob043d0: You need import ... with context
    o640b41: Macros can't take arguments
    o8b8688: Macros run before the page
    o56329b: Imported macros don't get the page's context by default
    ofab669: Variables are deleted after use
q9:
  text: Why create the Jinja Environment once, not per request?
  show: 4
  options:
    o14941d: Jinja allows only one
    o0555c3: Because of autoescaping
    oe4a95f: To keep templates secret
    o81ab50: Building it again throws the cache away and costs time
    od3901b: Globals can't be set twice
    o7de74c: It caches compiled templates
