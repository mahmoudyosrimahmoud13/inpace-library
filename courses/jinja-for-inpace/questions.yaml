q1:
  text: With autoescape on, what does {{ name }} print when name is "<b>Hi</b>"?
  show: 4
  options:
    o1d21c0: The text with < and > escaped, shown literally
    o050417: Hi in bold
    oacb5cf: '&lt;b&gt;Hi&lt;/b&gt;'
    o9eaa7e: Nothing
    od5c0dd: <b>Hi</b> as HTML
    o861df4: An error
q2:
  text: Which are safe ways to put data into a <script> block?
  show: 4
  options:
    oae54cc: Markup(user_input)
    o92e372: json.dumps(...) with < replaced by \u003c
    o2a1b26: '{{ data | e }} inside a JS string'
    ob01685: '{{ data | safe }}'
    o2e9d01: '{{ data }} inside quotes'
    o3b105b: '{{ data | tojson }}'
q3:
  text: What does for ... else do in Jinja?
  show: 4
  options:
    o25ff18: Runs on the last item
    o97a29b: Shows a fallback for no items
    o910883: Runs the else part when the list is empty
    o574dbc: Runs after every item
    o7cbb15: Is a syntax error
    o18de0f: Runs when the loop breaks
q4:
  text: 'Which print ''Mona, Ali'' from people = [{name: ''Mona''}, {name: ''Ali''}]?'
  show: 4
  options:
    o35145e: '{{ people.name }}'
    ocf02c9: '{% for p in people %}{{ p.name }}{{ '', '' if not loop.last }}{% endfor %}'
    oa650c1: '{{ people[name] }}'
    oc7cc5e: '{{ names(people) }}'
    o738c4c: '{{ people | map(attribute=''name'') | join('', '') }}'
    oc002f8: '{{ people | join('', '') }}'
q5:
