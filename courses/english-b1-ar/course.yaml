id: english-b1-ar
title: 'الإنجليزي B1: الرأي والمحادثات الحقيقية وحياة العمل'
version: 2
language: ar
description: 'الإنجليزي مستوى B1 لمتحدثي العربية، بنفس الطريقة المبنية على الأبحاث: محادثات حقيقية أولًا، والعبارات التي يستخدمها
  الناس، وقاعدة واحدة في كل وحدة مع شرح الفروق عن العربية، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة. عبّر عن رأيك ودافع
  عنه، واستخدم المضارع التام مع for وsince، والشرط الأول والثاني، والمبني للمجهول، والجمل الموصولة في مقابلة عمل ورسالة رسمية،
  والكلام المنقول. وينتهي باختبار مستوى B1. حوالي أسبوعين إلى 3 أسابيع، 45 دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'BBC Learning English: دروس وفيديوهات وبودكاست مجانية حسب المستوى'
  url: https://www.bbc.co.uk/learningenglish/
- title: 'VOA Learning English: أخبار وقصص بإنجليزية بطيئة وواضحة مع النص'
  url: https://learningenglish.voanews.com/
- title: 'Cambridge Dictionary: قاموس مع نطق بريطاني وأمريكي وترجمة عربية'
  url: https://dictionary.cambridge.org/
modules:
- id: m1
  title: 'الوحدة 1: في رأيي'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: إبداء الرأي والدفاع عنه
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: تراكيب الرأي وأدوات الربط
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (دقيقتان): رأي مع أسباب، وحجة مضادة، وخلاصة. ارفعه.'
  - id: m1-explain
    type: explain
    prompt: اكتب حوالي 80 كلمة بالإنجليزية تعبّر فيها عن رأيك في موضوع تختاره، بأربع أدوات ربط على الأقل.
    min_words: 70
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'الوحدة 2: منذ متى؟'
  lessons:
  - id: m2-l1
    title: الكلام عن حياتك حتى الآن
    file: lessons/m2-l1.md
    minutes: 35
  - id: m2-l2
    title: المضارع التام مع for وsince، والتام المستمر
    file: lessons/m2-l2.md
    minutes: 40
  requires:
  - id: m2-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): حياتك حتى الآن مع for وsince. ارفعه.'
  - id: m2-explain
    type: explain
    prompt: اكتب 6 جمل بالإنجليزية عن نفسك بالمضارع التام مع for وsince، وواحدة بـ yet.
    min_words: 40
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'الوحدة 3: لو...'
  lessons:
  - id: m3-l1
    title: الشرط الحقيقي وغير الحقيقي
    file: lessons/m3-l1.md
    minutes: 35
  - id: m3-l2
    title: الشرط الأول والثاني
    file: lessons/m3-l2.md
    minutes: 40
  requires:
  - id: m3-practical
    type: practical
    prompt: 'تسجيل صوتي (دقيقتان): أسئلة افتراضية وخطط حقيقية بالشرط. ارفعه.'
  - id: m3-explain
    type: explain
    prompt: اكتب حوالي 70 كلمة بالإنجليزية عمّا كنت ستفعله لو كانت عندك سنة إجازة، بالشرط الثاني.
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'الوحدة 4: كيف يُصنع؟'
  lessons:
  - id: m4-l1
    title: شرح عملية
    file: lessons/m4-l1.md
    minutes: 35
  - id: m4-l2
    title: المبني للمجهول
    file: lessons/m4-l2.md
    minutes: 40
  requires:
  - id: m4-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): عملية خطوة بخطوة بالمجهول، ومعلومات عن مكان مشهور. ارفعه.'
  - id: m4-explain
    type: explain
    prompt: اكتب 6 جمل بالإنجليزية عن كيف يُنتج شيء أو عن تاريخ مكان، بالمجهول (مضارع وماضٍ).
    min_words: 40
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m5
  title: 'الوحدة 5: العمل'
  lessons:
  - id: m5-l1
    title: مقابلة عمل
    file: lessons/m5-l1.md
    minutes: 35
  - id: m5-l2
    title: الجمل الموصولة والرسالة الرسمية
    file: lessons/m5-l2.md
    minutes: 40
  requires:
  - id: m5-practical
    type: practical
    prompt: 'تسجيل صوتي (دقيقتان): إجابات مقابلة عمل بإنجليزية رسمية. ارفعه.'
  - id: m5-explain
    type: explain
    prompt: اكتب رسالة رسمية من حوالي 100 كلمة بالإنجليزية تطلب فيها معلومات من شركة أو جامعة.
    min_words: 80
  - id: m5-quiz
    type: quiz
    questions:
    - q21
    - q22
    - q23
    - q24
    - q25
    pass: 70
- id: m6
  title: 'الوحدة 6: قالت لي إن...'
  lessons:
  - id: m6-l1
    title: نقل الأخبار
    file: lessons/m6-l1.md
    minutes: 35
  - id: m6-l2
    title: الكلام المنقول
    file: lessons/m6-l2.md
    minutes: 40
  - id: m6-l3
    title: 'اختبار المستوى: هل أتقنت B1؟'
    file: lessons/m6-l3.md
    minutes: 40
  requires:
  - id: m6-practical
    type: practical
    prompt: 'تسجيل صوتي (دقيقتان): أعد حكي محادثة حقيقية بالكلام المنقول. ارفعه.'
  - id: m6-explain
    type: explain
    prompt: 'اكتب حوالي 80 كلمة بالإنجليزية تنقل فيها مكالمة هاتفية أو اجتماعًا: said that وtold me وasked if وasked me to.'
    min_words: 70
  - id: m6-quiz
    type: quiz
    questions:
    - q26
    - q27
    - q28
    - q29
    - q30
    pass: 70
