id: cpp-advanced-ar
title: '‏C++ المتقدمة: تقنيات حديثة'
version: 1
language: ar
description: الجزء الثاني بعد C++ للمبتدئين. move semantics وقاعدة الصفر والخمسة، وconstexpr وif constexpr والـ templates
  متغيرة المعاملات، وconcepts C++20، وlambdas بعمق وstd::function، والـ ranges والـ views، ومعالجة الأخطاء بالـ exceptions
  وoptional وvariant وexpected، والـ concurrency بـ jthread وmutex وatomic وasync، ثم الاختبار ومشاريع CMake والـ sanitizers
  والأدوات. وينتهي بمحلل سجلات متوازٍ. كل مثال تُرجم بـ -Werror وشُغّل مع الـ sanitizers. خطوة اختيارية في مسار برمجة الأنظمة.
  حوالي 2 إلى 3 أسابيع، ساعة يوميًا.
image: cover.jpg
downloads:
- title: cppreference (بالإنجليزية)
  url: https://en.cppreference.com/
- title: إرشادات C++ الأساسية (بالإنجليزية)
  url: https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines
- title: إطار الاختبار Catch2
  url: https://github.com/catchorg/Catch2
modules:
- id: m1
  title: 'الوحدة 1: النقل والملكية'
  lessons:
  - id: m1-l1
    title: move semantics
    file: lessons/m1-l1.md
    minutes: 55
  - id: m1-l2
    title: قاعدة الصفر والثلاثة والخمسة
    file: lessons/m1-l2.md
    minutes: 55
  requires:
  - id: m1-practical
    type: practical
    prompt: اكتب class `Matrix` يحمل أرقامه في std::vector<double> (قاعدة الصفر)، ونسخة `RawMatrix` تحمل pointer خامًا `double*`
      وتنفّذ العمليات الخمس كلها. اطبع رسائل من عمليات النسخ والنقل في RawMatrix وبيّن أيها يعمل عندما تضيف arrays إلى vector.
      ارفع الكود والمخرجات.
  - id: m1-explain
    type: explain
    prompt: اشرح ماذا تفعل std::move في الحقيقة، ولماذا يجب أن تكون عمليات النقل noexcept.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'الوحدة 2: الـ templates والـ concepts'
  lessons:
  - id: m2-l1
    title: 'الـ templates بعمق: constexpr وif constexpr والـ templates متغيرة المعاملات'
    file: lessons/m2-l1.md
    minutes: 55
  - id: m2-l2
    title: 'الـ concepts: templates بقواعد واضحة'
    file: lessons/m2-l2.md
    minutes: 50
  requires:
  - id: m2-practical
    type: practical
    prompt: اكتب function متغيرة المعاملات `log(args...)` تطبع كل المعاملات بمسافات بينها باستخدام الطي، وfunction constexpr
      ‏`is_prime(n)` تتحقق منها بـ static_assert، وconcept `Container` (فيه begin() وend() وsize()) تستخدمه function `print_all(const
      Container auto&)`. ارفع الكود والمخرجات.
  - id: m2-explain
    type: explain
    prompt: اشرح الفرق بين polymorphism compile time بالـ concepts وpolymorphism runtime بالـ functions virtual، ومتى تختار
      كلًا منهما.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'الوحدة 3: الـ functions والـ ranges'
  lessons:
  - id: m3-l1
    title: lambdas والـ functions كقيم
    file: lessons/m3-l1.md
    minutes: 50
  - id: m3-l2
    title: الـ Ranges والـ Views
    file: lessons/m3-l2.md
    minutes: 55
  requires:
  - id: m3-practical
    type: practical
    prompt: لديك vector من المنتجات (الاسم، السعر، الفئة). استخدم الـ ranges والـ views لطباعة أرخص 3 منتجات في فئة واحدة،
      وابنِ std::map<std::string, std::function<bool(const Product&)>> من مرشحات لها أسماء ('cheap' و'food' و'in stock') يختارها
      المستخدم. ارفع الكود والمخرجات.
  - id: m3-explain
    type: explain
    prompt: اشرح الفرق بين الالتقاط بالقيمة والالتقاط بالـ reference، مع مثال يكون فيه الالتقاط بالـ reference خطأ.
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'الوحدة 4: الأخطاء والـ concurrency'
  lessons:
  - id: m4-l1
    title: 'معالجة الأخطاء: الـ exceptions وoptional وvariant وexpected'
    file: lessons/m4-l1.md
    minutes: 55
  - id: m4-l2
    title: 'الـ concurrency: الـ threads والـ mutex والـ atomics وasync'
    file: lessons/m4-l2.md
    minutes: 60
  requires:
  - id: m4-practical
    type: practical
    prompt: اكتب function تقرأ أوقاتًا بالشكل 'HH:MM' وترجع std::expected<int, std::string> (الدقائق منذ منتصف الليل أو رسالة
      خطأ). ثم عدّ الأوقات الصحيحة في vector كبير باستخدام 4 مهام std::async، لكل منها عدّاد خاص. ابنِ مرة بـ -fsanitize=thread.
      ارفع الكود والمخرجات.
  - id: m4-explain
    type: explain
    prompt: اشرح ما هو data race، وثلاث طرق مختلفة من هذه الوحدة لتجنبه.
    min_words: 60
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m5
  title: 'الوحدة 5: الاختبار والأدوات ومشروع'
  lessons:
  - id: m5-l1
    title: الاختبار والأدوات وتنظيم مشروع حقيقي
    file: lessons/m5-l1.md
    minutes: 50
  - id: m5-l2
    title: 'مشروع: محلل سجلات متوازٍ'
    file: lessons/m5-l2.md
    minutes: 75
  requires:
  - id: m5-practical
    type: practical
    prompt: نفّذ ثلاثًا على الأقل من مهام 'دورك' في المشروع، منها اختبارات parse_line ومقارنة الأزمنة. ارفع ملفاتك (مع CMakeLists.txt)
      ومخرجات الاختبارات وجدول الأزمنة مع شرح قصير.
  - id: m5-explain
    type: explain
    prompt: اشرح لماذا لا يحتاج محلل السجلات إلى mutex، وما الذي يجب تغييره لو كتبت كل الـ threads في object Stats مشترك واحد.
    min_words: 60
  - id: m5-quiz
    type: quiz
    questions:
    - q21
    - q22
    - q23
    - q24
    - q25
    pass: 70
