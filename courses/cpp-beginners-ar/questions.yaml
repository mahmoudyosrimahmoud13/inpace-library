  show: 4
  options:
    a: 'الـ inheritance الافتراضي: public مقابل private'
    b: class أسرع
    c: struct لا يمكن أن يكون لها constructor
    d: struct لا يمكن أن تحتوي functions
    e: 'الوصول الافتراضي: public مقابل private'
    f: لا فرق إطلاقًا
