  show: 4
  options:
    a: الـ reference سيصبح dangling
    b: الـ compiler ينسخه مرتين
    c: لأنه أبطأ
    d: ينسخ كثيرًا
    e: الـ variable يُدمَّر عند انتهاء الـ function
    f: الـ references لا يمكن إرجاعها
