q1:
  text: أي خيار يشغّل إصدار C++20 من اللغة؟
  show: 4
  options:
    a: -O2
    b: -c20
    c: -std=gnu++20 (مع إضافات GNU)
    d: -Wall
    e: -c++20
    f: -std=c++20
q2:
  text: ماذا تفعل `int b{3.9};`؟
  show: 4
  options:
    a: خطأ compile لأن الأقواس {} تمنع الـ narrowing
    b: تقرّب b بصمت
    c: تجعل b تساوي 3
    d: 'لا تُترجَم: تضييق (narrowing)'
    e: تجعل b تساوي 3.9
    f: تجعل b تساوي 4
q3:
  text: '`std::cin >> name;` مع المدخل ''Nour Hassan'' تعطي:'
  show: 4
  options:
    a: Nour ومعها مسافة
    b: Hassan
    c: Hassan يبقى منتظرًا في الـ input
    d: Nour Hassan
    e: Nour
    f: نصًا فارغًا
q4:
  text: ماذا ترجع `find` عندما لا يوجد النص؟
  show: 4
  options:
    a: قيمة تساوي static_cast<size_t>(-1)
    b: exception
    c: -1 كـ int
    d: nullptr
    e: '0'
    f: std::string::npos
q5:
  text: ما طريقة C++ للتحويل عن قصد؟
  show: 4
  options:
    a: double x!
    b: static_cast، وهي سهلة البحث عنها
    c: reinterpret_cast<double>(x)
    d: convert(x)
    e: static_cast<double>(x)
    f: (double)x فقط
q6:
  text: ما هو `int& r = x;`؟
  show: 4
  options:
    a: خطأ
    b: alias مرتبط بـ x طوال حياته
    c: اسم آخر لـ x
    d: int جديد بقيمة x
    e: pointer إلى x قد يكون فارغًا
    f: نسخة من x
q7:
  text: كيف تأخذ الـ function نصًا كبيرًا تقرؤه فقط؟
  show: 4
  options:
    a: const reference لتجنب النسخ
    b: std::string*
    c: std::string&&
    d: std::string&
    e: const std::string&
    f: std::string
q8:
  text: 'functions اسمهما area بمعاملات مختلفة اسم ذلك:'
  show: 4
  options:
    a: الـ templates
    b: الـ overloading
    c: name hiding
    d: خطأ
    e: الاستبدال (overriding)
    f: مسموح عندما تختلف قوائم المعاملات
q9:
  text: أي سطر خطأ؟
  show: 4
  options:
    a: int& r = 5;
    b: int x = 5;
    c: int& r;
    d: const int y = 2;
    e: int z{};
    f: int& r = x;
q10:
