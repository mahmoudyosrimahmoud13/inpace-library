<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check yourself: analytic geometry (chapter 3)</title><style>
:root { --bg:#ffffff; --fg:#141414; --muted:#5d636b; --line:#141414; --soft:#f3f1ec; --blue:#2B6CB0; --pink:#D6336C;
  --green:#1F9D6A; --yellow:#E0A800; --grey:#8A8F98; --grid:#e3e1dc; --ok:#1F9D6A; --bad:#D6336C; --hl:#FFD43B; }

.q { border: 3px solid var(--line); padding: 12px 14px; margin: 12px 0; }

.mat { display: inline-block; vertical-align: middle; border-left: 2px solid currentColor; border-right: 2px solid currentColor; padding: 0 5px; margin: 0 2px; border-radius: 3px; }

</style></head>
<body><main><h1>Check yourself: analytic geometry (chapter 3)</h1><p class="lead">Lengths, angles, orthogonality and projections. Paper first, then check.</p>
<div class="score"><span id="score"></span><button id="again" type="button">Start over</button></div><div id="qs"></div><script type="application/json" id="data">[{"q": "For x = (3, −4), find the three norms.", "num": [5, 7, 4], "labels": ["‖x‖₂ =", "‖x‖₁ =", "‖x‖∞ ="], "tol": 0, "why": "<p>‖x‖₂ = √(9 + 16) = 5 (Euclidean).<\/p><p>‖x‖₁ = |3| + |−4| = 7 (Manhattan).<\/p><p>‖x‖∞ = max(|3|, |−4|) = 4.<\/p>"}, {"q": "What is the angle (in degrees) between (1, 0) and (1, 1)?", "num": [45], "why": "<p>cos ω = xᵀy / (‖x‖‖y‖) = 1 / (1 · √2) = 0.7071.<\/p><p>ω = arccos(0.7071) = 45°.<\/p>"}, {"q": "Distance between (1, 2) and (4, 6)?", "num": [5], "why": "<p>d(x, y) = ‖x − y‖ = ‖(−3, −4)‖ = √(9 + 16) = 5.<\/p>"}, {"q": "Project x = (2, 3) onto the line spanned by b = (1, 1).", "num": [2.5, 2.5], "labels": ["first", "second"], "why": "<p>π(x) = (bᵀx / bᵀb) · b.<\/p><p>bᵀx = 2 + 3 = 5 and bᵀb = 2, so λ = 2.5.<\/p><p>π(x) = 2.5 · (1, 1) = (2.5, 2.5).<\/p><p>Check: x − π(x) = (−0.5, 0.5), and (−0.5, 0.5)·(1, 1) = 0. ✓<\/p>"}, {"q": "With the inner product ⟨x, y⟩ = xᵀAy, A = <span class=\"mat\"><span>2 0<\/span><span>0 1<\/span><\/span>, what is ⟨x, y⟩ for x = (1, 1), y = (1, −1)?", "num": [1], "tol": 0, "why": "<p>Ay = (2, −1), so xᵀAy = 1·2 + 1·(−1) = 1.<\/p><p>With the usual dot product these two vectors are orthogonal (1 − 1 = 0). With this inner product they are not.<\/p><p>Orthogonality depends on which inner product you choose.<\/p>"}, {"q": "Gram-Schmidt on b₁ = (1, 1), b₂ = (1, 0): u₁ = b₁, u₂ = b₂ − π_{u₁}(b₂). What is u₂?", "num": [0.5, -0.5], "labels": ["first", "second"], "why": "<p>π_{u₁}(b₂) = (u₁ᵀb₂ / u₁ᵀu₁) u₁ = (1/2)(1, 1) = (0.5, 0.5).<\/p><p>u₂ = (1, 0) − (0.5, 0.5) = (0.5, −0.5).<\/p><p>u₁ᵀu₂ = 0.5 − 0.5 = 0. Divide each by its length to get an orthonormal basis.<\/p>"}, {"q": "Rotate (2, 1) by 90° counter-clockwise.", "num": [-1, 2], "labels": ["first", "second"], "why": "<p>R(90°) = [[cos 90°, −sin 90°], [sin 90°, cos 90°]] = [[0, −1], [1, 0]].<\/p><p>R·(2, 1) = (0·2 − 1·1, 1·2 + 0·1) = (−1, 2).<\/p>"}, {"q": "B has linearly independent columns. Which matrix projects any x onto the column space of B?", "options": ["B(BᵀB)⁻¹Bᵀ", "BᵀB", "(BᵀB)⁻¹", "BBᵀ, always"], "answer": 0, "why": "<p>The projection is Bλ with λ = (BᵀB)⁻¹Bᵀx (from the normal equations BᵀB λ = Bᵀx).<\/p><p>So the projection matrix is P = B(BᵀB)⁻¹Bᵀ. If the columns are orthonormal, BᵀB = I and P = BBᵀ.<\/p>"}]</script>
</main><script>
const C = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const f2 = (x, d = 2) => (Math.abs(x) < 5e-10 ? 0 : x).toFixed(d);
function Plane(canvas, view, opts = {}) {
  const p = { canvas, view, ctx: canvas.getContext('2d'), equal: opts.equal !== false };
  p.fit = () => {
    const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    canvas.width = Math.max(10, r.width * d); canvas.height = Math.max(10, r.height * d);
    p.W = r.width; p.H = r.height; p.ctx.setTransform(d, 0, 0, d, 0, 0);
    const v = p.view, sx = p.W / (v[1] - v[0]), sy = p.H / (v[3] - v[2]);
    if (p.equal) { const s = Math.min(sx, sy); p.sx = p.sy = s; } else { p.sx = sx; p.sy = sy; }
    p.ox = p.W / 2 - p.sx * (v[0] + v[1]) / 2; p.oy = p.H / 2 + p.sy * (v[2] + v[3]) / 2;
  };
  p.X = x => p.ox + p.sx * x; p.Y = y => p.oy - p.sy * y;
  p.inv = (px, py) => [(px - p.ox) / p.sx, (p.oy - py) / p.sy];
  p.clear = () => { p.ctx.fillStyle = C('--bg'); p.ctx.fillRect(0, 0, p.W, p.H); };
  p.grid = (step = 1, axes = true) => {
    const c = p.ctx, [x0, y0] = p.inv(0, p.H), [x1, y1] = p.inv(p.W, 0);
    c.lineWidth = 1; c.strokeStyle = C('--grid'); c.beginPath();
    for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) { c.moveTo(p.X(x), 0); c.lineTo(p.X(x), p.H); }
    for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) { c.moveTo(0, p.Y(y)); c.lineTo(p.W, p.Y(y)); }
    c.stroke();
    if (axes) { c.strokeStyle = C('--grey'); c.lineWidth = 1.2; c.beginPath(); c.moveTo(p.X(x0), p.Y(0)); c.lineTo(p.X(x1), p.Y(0));
      c.moveTo(p.X(0), p.Y(y0)); c.lineTo(p.X(0), p.Y(y1)); c.stroke(); }
  };
  p.line = (pts, color, w = 2, dash = []) => { const c = p.ctx; c.strokeStyle = color; c.lineWidth = w; c.setLineDash(dash);
    c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(p.X(q[0]), p.Y(q[1])) : c.moveTo(p.X(q[0]), p.Y(q[1]))); c.stroke(); c.setLineDash([]); };
  p.fill = (pts, color, alpha = .3) => { const c = p.ctx; c.globalAlpha = alpha; c.fillStyle = color; c.beginPath();
    pts.forEach((q, i) => i ? c.lineTo(p.X(q[0]), p.Y(q[1])) : c.moveTo(p.X(q[0]), p.Y(q[1]))); c.closePath(); c.fill(); c.globalAlpha = 1; };
  p.dot = (x, y, color, r = 4, ring) => { const c = p.ctx; c.fillStyle = color; c.beginPath(); c.arc(p.X(x), p.Y(y), r, 0, 7); c.fill();
    if (ring) { c.strokeStyle = ring; c.lineWidth = 2; c.stroke(); } };
  p.text = (s, x, y, color, size = 14, dx = 6, dy = -6) => { const c = p.ctx; c.fillStyle = color; c.font = `600 ${size}px system-ui, sans-serif`;
    c.fillText(s, p.X(x) + dx, p.Y(y) + dy); };
  p.arrow = (x0, y0, x1, y1, color, w = 3, label) => {
    const c = p.ctx, X0 = p.X(x0), Y0 = p.Y(y0), X1 = p.X(x1), Y1 = p.Y(y1), a = Math.atan2(Y1 - Y0, X1 - X0), L = Math.hypot(X1 - X0, Y1 - Y0);
    c.strokeStyle = c.fillStyle = color; c.lineWidth = w; c.beginPath(); c.moveTo(X0, Y0);
    const h = Math.min(12, L * .45); c.lineTo(X1 - h * .8 * Math.cos(a), Y1 - h * .8 * Math.sin(a)); c.stroke();
    c.beginPath(); c.moveTo(X1, Y1); c.lineTo(X1 - h * Math.cos(a - .38), Y1 - h * Math.sin(a - .38));
    c.lineTo(X1 - h * Math.cos(a + .38), Y1 - h * Math.sin(a + .38)); c.closePath(); c.fill();
    if (label) p.text(label, x1, y1, color, 15, 6 * Math.sign(Math.cos(a) || 1), 16 * (Math.sin(a) > 0 ? 1 : -.3));
  };
  p.fit();
  return p;
}
function onResize(fn) { let t; new ResizeObserver(() => { clearTimeout(t); t = setTimeout(fn, 30); }).observe(document.body); }
function bindSliders(ids, fn, fmt = {}) {
  ids.forEach(id => { const el = $(id), out = el.parentElement.querySelector('output');
    const show = () => { if (out) out.textContent = fmt[id] ? fmt[id](+el.value) : el.value; };
    el.addEventListener('input', () => { show(); fn(); }); show(); });
}
function setSliders(vals) { for (const k in vals) { const el = $(k); el.value = vals[k]; el.dispatchEvent(new Event('input')); } }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1);
  t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function normals(n, seed) { const r = rng(seed), out = []; for (let i = 0; i < n; i++) { const u = Math.max(r(), 1e-12), v = r();
  out.push([Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v), Math.sqrt(-2 * Math.log(u)) * Math.sin(2 * Math.PI * v)]); } return out; }
function eig2sym(a, b, d) { // eigenvalues and unit eigenvectors of [[a, b], [b, d]], largest first
  const t = (a + d) / 2, r = Math.hypot((a - d) / 2, b), l1 = t + r, l2 = t - r;
  let v = Math.abs(b) > 1e-12 ? [b, l1 - a] : (a >= d ? [1, 0] : [0, 1]); const n = Math.hypot(...v); v = [v[0] / n, v[1] / n];
  return [[l1, v], [l2, [-v[1], v[0]]]];
}
function ellipse(cx, cy, a, b, d, k) { // points of {x : (x-c)^T S^-1 (x-c) = k^2} for S = [[a, b], [b, d]]
  const [[l1, v1], [l2, v2]] = eig2sym(a, b, d), pts = [];
  for (let i = 0; i <= 80; i++) { const t = i / 80 * 2 * Math.PI, u = k * Math.sqrt(Math.max(l1, 0)) * Math.cos(t), w = k * Math.sqrt(Math.max(l2, 0)) * Math.sin(t);
    pts.push([cx + u * v1[0] + w * v2[0], cy + u * v1[1] + w * v2[1]]); } return pts;
}


const QS = JSON.parse(document.getElementById('data').textContent);
let done = 0, right = 0;
const box = $('qs');
function upd() { $('score').textContent = `${right} right of ${done} answered (${QS.length} questions)`; }
QS.forEach((q, i) => {
  const d = document.createElement('section'); d.className = 'q';
  d.innerHTML = `<div><span class="n">${i + 1}.</span>${q.q}</div>`;
  const fb = document.createElement('div'); fb.className = 'fb';
  const det = document.createElement('details'); det.innerHTML = `<summary>Show the worked answer</summary><div class="steps">${q.why}</div>`;
  let answered = false;
  const mark = ok => { if (!answered) { answered = true; done++; if (ok) right++; upd(); }
    fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.textContent = ok ? 'Right.' : 'Not quite. Try again, or open the worked answer.'; if (ok) det.open = true; };
  if (q.options) {
    const o = document.createElement('div'); o.className = 'opts';
    q.options.forEach((t, k) => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = t;
      b.onclick = () => { const ok = k === q.answer; b.classList.add(ok ? 'right' : 'wrong'); mark(ok); }; o.appendChild(b); });
    d.appendChild(o);
  } else {
    const o = document.createElement('div'); o.className = 'nums'; const ins = [];
    q.num.forEach((v, k) => { const l = document.createElement('label'); l.innerHTML = (q.labels ? q.labels[k] + ' ' : '');
      const inp = document.createElement('input'); inp.inputMode = 'decimal'; inp.setAttribute('aria-label', q.labels ? q.labels[k] : 'answer');
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') chk.click(); }); l.appendChild(inp); o.appendChild(l); ins.push(inp); });
    const chk = document.createElement('button'); chk.type = 'button'; chk.textContent = 'Check';
    chk.onclick = () => { const tol = q.tol ?? 0.01;
      const vals = ins.map(x => { const s = x.value.trim().replace(',', '.'); if (/^-?\d*\.?\d+\/\d*\.?\d+$/.test(s)) { const [a, b] = s.split('/'); return a / b; } return parseFloat(s); });
      if (vals.some(isNaN)) { fb.className = 'fb no'; fb.textContent = 'Type a number in each box (fractions like 3/4 work).'; return; }
      mark(vals.every((v, k) => Math.abs(v - q.num[k]) <= tol * Math.max(1, Math.abs(q.num[k])))); };
    o.appendChild(chk); d.appendChild(o);
  }
  d.appendChild(fb); d.appendChild(det); box.appendChild(d);
});
$('again').onclick = () => location.reload();
upd();
</script></body></html>
