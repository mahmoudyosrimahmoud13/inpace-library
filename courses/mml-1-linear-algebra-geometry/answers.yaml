q10:
  right:
  - oc7a998
  - o10b17b
  - o2c74ba
  why: 'A subspace must contain 0 and be closed under addition and scaling. The axes together fail addition: (1,0)+(0,1).'
q11:
  right:
  - odb5841
  - oc2cb6b
  why: 'Pairwise differences are not enough: (1,0), (0,1), (1,1) are pairwise different but dependent.'
q12:
  right:
  - o443334
  - o5e4f1b
  - o859e55
  why: 'Rank 4 = number of rows, so the columns span ℝ⁴. Rank-nullity: 6 − 4 = 2 kernel dimensions, so solutions
    are not unique.'
q13:
  right:
  - o7077f4
  - o67837c
  - o4bfad3
  why: Bases aren't unique and needn't be orthogonal, but they always have dim(V) vectors.
q14:
