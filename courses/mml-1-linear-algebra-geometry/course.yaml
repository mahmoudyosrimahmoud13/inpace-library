id: mml-1-linear-algebra-geometry
title: 'Maths for ML 1: linear algebra and analytic geometry'
version: 1
language: en
description: 'Part 1 of 4, following the free book Mathematics for Machine Learning (Deisenroth, Faisal, Ong). Systems
  of equations, matrices, Gaussian elimination, vector spaces, basis and rank, linear maps and change of basis,
  norms, inner products, angles, orthogonal projections, Gram-Schmidt and rotations. Each lesson opens the right
  pages of your own copy of the book (download it free from mml-book.com; inPace finds it for you), with notes,
  3Blue1Brown videos, interactive explorers, worked exercises with instant feedback, and charts. Plan: 7 days.'
image: cover.jpg
book: mml-book.pdf
book_info:
  title: Mathematics for Machine Learning
  url: https://mml-book.com
  pages: 412
modules:
- id: m1
  title: 'Day 1: What the book is for, and systems of equations'
  lessons:
  - id: m1-l1
    title: Start here
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: 'Read: the introduction (chapter 1)'
    file: lessons/m1-l2.md
    minutes: 25
    media: mml-book.pdf#pages=17-22
  - id: m1-l3
    title: 'Watch: Vectors, what even are they?'
    file: lessons/m1-l3.md
    minutes: 10
    media: https://www.youtube.com/watch?v=fNk_zzaMoSs
  - id: m1-l4
    title: 'Read: systems of linear equations (2.1)'
    file: lessons/m1-l4.md
    minutes: 30
    media: mml-book.pdf#pages=23-28
  requires:
  - id: m1-practical
    type: practical
    prompt: |-
      Take the system x₁ + x₂ = 4 and 2x₁ + 2x₂ = c.

      1. Sketch both lines for c = 8 and c = 6.
      2. For each, say whether there are 0, 1 or infinitely many solutions, and why.
      3. Change one coefficient so that the system has exactly one solution for every c, and solve it for c = 6.

      Write your answers here (a phone photo of your sketch is welcome if you keep notes in a file).
    optional: true
  - id: m1-explain
    type: explain
    prompt: 'In your own words: why can a system of linear equations never have exactly two solutions? Use the picture
      of lines or planes, or the idea that if x and y are solutions, so is every point between them.'
    min_words: 60
    optional: true
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    pass: 70
- id: m2
  title: 'Day 2: Matrices and solving systems'
  lessons:
  - id: m2-l1
    title: 'Read: matrices (2.2)'
    file: lessons/m2-l1.md
    minutes: 35
    media: mml-book.pdf#pages=28-33
  - id: m2-l2
    title: 'Read: solving systems, Gaussian elimination (2.3)'
    file: lessons/m2-l2.md
    minutes: 45
    media: mml-book.pdf#pages=33-41
  - id: m2-l3
    title: 'Watch: Linear transformations and matrices'
    file: lessons/m2-l3.md
    minutes: 11
    media: https://www.youtube.com/watch?v=kYB8IZa5AuE
  - id: m2-l4
    title: 'Watch: Matrix multiplication as composition'
    file: lessons/m2-l4.md
    minutes: 10
    media: https://www.youtube.com/watch?v=XkY2DOUCWMU
  - id: m2-l5
    title: 'Explore: a matrix moves the plane'
    file: lessons/m2-l5.md
    minutes: 15
  - id: m2-l6
    title: 'Watch: Inverse matrices, column space and null space'
    file: lessons/m2-l6.md
    minutes: 12
    media: https://www.youtube.com/watch?v=uQhTuRlWMxw
  requires:
  - id: m2-practical
    type: practical
    prompt: |-
      Solve this system by Gaussian elimination, showing each row operation:

          x₁ + 2x₂ −  x₃ = 1
         2x₁ + 4x₂ −  x₃ = 4
          x₁ + 2x₂       = 3

      1. Bring it to reduced row-echelon form.
      2. Which variable is free? Write **all** solutions as x = x_p + λ·x_k.
      3. Check one solution with λ = 1 by putting it back into all three equations.
      (Optional: check with NumPy: `np.linalg.matrix_rank` and `np.linalg.lstsq`.)
    optional: true
  - id: m2-explain
    type: explain
    prompt: Explain in your own words why the set of all solutions of Ax = b is "one particular solution plus the
      kernel". What would go wrong if you added two particular solutions instead?
    min_words: 60
    optional: true
  - id: m2-quiz
    type: quiz
    questions:
    - q5
    - q6
    - q7
    - q8
    - q9
    pass: 70
- id: m3
  title: 'Day 3: Vector spaces, independence, basis and rank'
  lessons:
  - id: m3-l1
    title: 'Read: groups, vector spaces and subspaces (2.4)'
    file: lessons/m3-l1.md
    minutes: 35
    media: mml-book.pdf#pages=41-46
  - id: m3-l2
    title: 'Read: linear independence (2.5) and basis and rank (2.6)'
    file: lessons/m3-l2.md
    minutes: 50
    media: mml-book.pdf#pages=46-54
  - id: m3-l3
    title: 'Watch: Linear combinations, span and basis vectors'
    file: lessons/m3-l3.md
    minutes: 10
    media: https://www.youtube.com/watch?v=k7RM-ot2NWY
  - id: m3-l4
    title: 'Watch: Abstract vector spaces'
    file: lessons/m3-l4.md
    minutes: 17
    media: https://www.youtube.com/watch?v=TgKwz5Ikpc8
  requires:
  - id: m3-practical
    type: practical
    prompt: |-
      Take v₁ = (1, 0, 1), v₂ = (0, 1, 1), v₃ = (1, 1, 2), v₄ = (1, −1, 0).

      1. Put them as columns of a 3 × 4 matrix and bring it to row-echelon form.
      2. Which vectors are pivot columns? Write each non-pivot vector as a combination of the pivot ones.
      3. What is the dimension of their span? Is it a line, a plane or all of ℝ³?
      4. Using rank-nullity, what is the dimension of the kernel of this matrix?
    optional: true
  - id: m3-explain
    type: explain
    prompt: Explain the difference between "these vectors span the space" and "these vectors are a basis". Give
      an example of a set that spans ℝ² but is not a basis, and say why every basis of ℝ² has exactly two vectors.
    min_words: 60
    optional: true
  - id: m3-quiz
    type: quiz
    questions:
    - q10
    - q11
    - q12
    - q13
    pass: 70
- id: m4
  title: 'Day 4: Linear mappings, change of basis and affine spaces'
  lessons:
  - id: m4-l1
    title: 'Read: linear mappings and matrix representations (2.7, first half)'
    file: lessons/m4-l1.md
    minutes: 45
    media: mml-book.pdf#pages=54-60
  - id: m4-l2
    title: 'Read: change of basis, image and kernel (2.7, second half)'
    file: lessons/m4-l2.md
    minutes: 45
    media: mml-book.pdf#pages=60-67
  - id: m4-l3
    title: 'Watch: Change of basis'
    file: lessons/m4-l3.md
    minutes: 13
    media: https://www.youtube.com/watch?v=P2LTAUO1TdA
  - id: m4-l4
    title: 'Read: affine spaces (2.8) and further reading (2.9)'
    file: lessons/m4-l4.md
    minutes: 20
    media: mml-book.pdf#pages=67-70
  - id: m4-l5
    title: 'Watch: Nonsquare matrices as transformations between dimensions'
    file: lessons/m4-l5.md
    minutes: 5
    media: https://www.youtube.com/watch?v=v8VSDg_WQlA
  - id: m4-l6
    title: 'Check yourself: chapter 2'
    file: lessons/m4-l6.md
    minutes: 30
    media: mml-book.pdf#pages=70-75
  requires:
  - id: m4-practical
    type: practical
    prompt: |-
      Let Φ: ℝ² → ℝ² rotate every vector by 90° counter-clockwise.

      1. Where do e₁ = (1, 0) and e₂ = (0, 1) go? Write the transformation matrix A in the standard basis.
      2. Now use the basis b₁ = (1, 1), b₂ = (1, −1). Write S (its columns are b₁, b₂), compute S⁻¹ and Ã = S⁻¹AS.
      3. Check your Ã: apply it to the coordinates of b₁ in the new basis, (1, 0), and translate the result back with S.
         You should get the rotation of b₁, which is (−1, 1).
    optional: true
  - id: m4-explain
    type: explain
    prompt: Explain change of basis to a friend who knows matrices but not this topic. Why does the same linear
      map have different matrices, and what stays the same about it (for example, its rank or its determinant)?
    min_words: 60
    optional: true
  - id: m4-quiz
    type: quiz
    questions:
    - q14
    - q15
    - q16
    - q17
    pass: 70
- id: m5
  title: 'Day 5: Norms, inner products, lengths and angles'
  lessons:
  - id: m5-l1
    title: 'Read: norms (3.1) and inner products (3.2)'
    file: lessons/m5-l1.md
    minutes: 35
    media: mml-book.pdf#pages=77-81
  - id: m5-l2
    title: 'Read: lengths, distances (3.3) and angles (3.4)'
    file: lessons/m5-l2.md
    minutes: 25
    media: mml-book.pdf#pages=81-84
  - id: m5-l3
    title: 'Watch: Dot products and duality'
    file: lessons/m5-l3.md
    minutes: 14
    media: https://www.youtube.com/watch?v=LyGKycYT2v0
  requires:
  - id: m5-practical
    type: practical
    prompt: |-
      Let x = (1, 2) and y = (3, −1).

      1. Compute ‖x‖₁, ‖x‖₂, ‖x‖∞ and the same for y.
      2. Compute the angle between x and y with the dot product.
      3. Now use the inner product ⟨x, y⟩ = xᵀAy with A = [[2, 1], [1, 2]]. First check A is positive definite (hint:
         xᵀAx = 2x₁² + 2x₁x₂ + 2x₂², write it as a sum of squares). Then compute the new lengths and the new angle.
      4. Are x and y "more" or "less" orthogonal with the new inner product?
    optional: true
  - id: m5-explain
    type: explain
    prompt: Why do we need the matrix in ⟨x, y⟩ = xᵀAy to be symmetric and positive definite? Say what would go
      wrong with lengths or angles if it weren't.
    min_words: 60
    optional: true
  - id: m5-quiz
    type: quiz
    questions:
    - q18
    - q19
    - q20
    - q21
    pass: 70
- id: m6
  title: 'Day 6: Orthogonality and projections'
  lessons:
  - id: m6-l1
    title: 'Read: orthonormal bases, complements, function spaces (3.5–3.7)'
    file: lessons/m6-l1.md
    minutes: 30
    media: mml-book.pdf#pages=84-87
  - id: m6-l2
    title: 'Read: orthogonal projections (3.8)'
    file: lessons/m6-l2.md
    minutes: 60
    media: mml-book.pdf#pages=87-97
  - id: m6-l3
    title: 'Explore: projection onto a line'
    file: lessons/m6-l3.md
    minutes: 15
  requires:
  - id: m6-practical
    type: practical
    prompt: |-
      Project x = (6, 0, 0) onto the plane U spanned by b₁ = (1, 1, 1) and b₂ = (0, 1, 2) (the book's example uses the same
      plane, so you can compare).

      1. Form B = [b₁ b₂], compute BᵀB and Bᵀx.
      2. Solve the normal equations for λ, then π(x) = Bλ.
      3. Check that x − π(x) is orthogonal to both b₁ and b₂.
      4. What is the distance from x to the plane?
    optional: true
  - id: m6-explain
    type: explain
    prompt: 'Explain the "three steps" recipe for orthogonal projection in your own words, and why the condition
      "the error is orthogonal to the subspace" gives the closest point (hint: Pythagoras).'
    min_words: 60
    optional: true
  - id: m6-quiz
    type: quiz
    questions:
    - q22
    - q23
    - q24
    - q25
    pass: 70
- id: m7
  title: 'Day 7: Rotations, and putting it together'
  lessons:
  - id: m7-l1
    title: 'Read: rotations (3.9) and further reading (3.10)'
    file: lessons/m7-l1.md
    minutes: 35
    media: mml-book.pdf#pages=97-103
  - id: m7-l2
    title: 'Watch: Three-dimensional linear transformations'
    file: lessons/m7-l2.md
    minutes: 5
    media: https://www.youtube.com/watch?v=rHLEWRxRGiM
  - id: m7-l3
    title: 'Check yourself: chapter 3'
    file: lessons/m7-l3.md
    minutes: 25
  requires:
  - id: m7-practical
    type: practical
    prompt: |-
      1. Write R(30°) and R(60°). Multiply them (both orders) and check you get R(90°) both times: in 2D, rotations commute.
      2. Check R(60°)ᵀR(60°) = I with numbers.
      3. In 3D, take the rotation by 90° about the x-axis and the rotation by 90° about the z-axis. Multiply them in both
         orders and show the results differ. Apply both to the vector (0, 1, 0) to see it.
    optional: true
  - id: m7-explain
    type: explain
    prompt: What makes a matrix a rotation? Explain, in your own words, why an orthogonal matrix keeps lengths and
      angles (use ⟨Ax, Ay⟩ = xᵀAᵀAy), and how you can tell a rotation from a reflection.
    min_words: 60
    optional: true
  - id: m7-quiz
    type: quiz
    questions:
    - q26
    - q27
    - q28
    - q29
    pass: 70
