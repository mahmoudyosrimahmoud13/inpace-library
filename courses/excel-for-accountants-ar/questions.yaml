  show: 4
  options:
    a: احذفها
    b: اقفل خلايا المعادلات واحمِ الشيت، مع ترك المدخلات غير مقفلة
    c: أخفِ الملف
    d: لوّنها بالأحمر
q30:
  text: 'معادلة إجمالي تفوّت الصفوف المضافة حديثًا تُتجنّب بـ:'
  show: 4
  options:
    a: الخلايا المدمجة
    b: كتابة الإجمالي
    c: استخدام الجداول
    d: مزيد من IF
