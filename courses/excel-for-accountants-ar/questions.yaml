  show: 4
  options:
    a: ROUND
    b: TRIM فقط
    c: VALUE، أو Text to Columns
    d: PROPER
q28:
  text: أيّ هذه ضابط جيد؟
  show: 4
  options:
    a: معادلات مخفية بداخلها ثوابت
    b: شيت فحوص يجب أن يُظهر ALL OK
    c: إجماليات مكتوبة
    d: خلايا مدمجة في البيانات
q29:
