id: spanish-a1-ar
title: 'الإسباني من الصفر: مستوى A1'
version: 2
language: ar
description: 'إسباني للمبتدئين تمامًا، بالشرح العربي وبطريقة مبنية على الأبحاث: استمع لمحادثة حقيقية أولًا، واحفظ العبارات
  التي يستخدمها الناس فعلًا، وقاعدة واحدة في كل وحدة، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة. التحية والعائلة ويومك والمدينة
  والأكل والتسوق والخطط، مع ser وestar وtener والمضارع وgustar وir a. وينتهي باختبار مستوى A1. حوالي أسبوعين، 45 دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'Dreaming Spanish: فيديوهات مجانية مرتبة حسب المستوى، من الصفر (بالإسبانية)'
  url: https://www.dreaming.com/
- title: 'Easy Spanish: مقابلات في الشارع مع ترجمة (YouTube)'
  url: https://www.youtube.com/@EasySpanish
- title: 'SpanishDict: قاموس وجداول تصريف ونطق (بالإنجليزية)'
  url: https://www.spanishdict.com/
modules:
- id: m1
  title: 'الوحدة 1: مرحبًا، أنا...'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: التعرّف على شخص جديد
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: 'ser وme llamo: من أنت؟'
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (30 ثانية): حيِّ المستمع، وقدّم نفسك (الاسم، البلد، المدينة، المهنة)، واسأل عن اسمه، وودّعه. ارفع
      التسجيل.'
  - id: m1-explain
    type: explain
    prompt: اكتب من 4 إلى 6 جمل بالإسبانية تقدّم فيها نفسك، باستخدام soy وme llamo وvivo en.
    min_words: 20
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'الوحدة 2: عائلتي'
  lessons:
