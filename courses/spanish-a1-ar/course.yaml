    title: الكلام عن عائلتك
    file: lessons/m2-l1.md
    minutes: 35
  - id: m2-l2
    title: tener وel / la والكلمات التي تتطابق
    file: lessons/m2-l2.md
    minutes: 40
  requires:
  - id: m2-practical
    type: practical
    prompt: 'تسجيل صوتي (45 ثانية): صِف عائلتك (الأسماء، الأعمار، المهن، صفة لكل واحد). ارفع التسجيل.'
  - id: m2-explain
    type: explain
    prompt: اكتب 5 جمل بالإسبانية عن شخص واحد من عائلتك.
    min_words: 25
  - id: m2-quiz
    type: quiz
    questions:
