id: spanish-a1-ar
title: 'الإسباني من الصفر: مستوى A1'
version: 1
language: ar
description: 'كورس إسباني للمبتدئين تمامًا من متحدثي العربية: الشرح بالعربي البسيط، والأمثلة والتمارين بالإسباني.
  تبدأ بالكلام من اليوم الأول، ثم ser و estar و tener، والمضارع، والروتين، والعائلة، و gustar، والأكل والتسوق والاتجاهات.
  فوق أغلب الدروس فيديو اختياري لمتحدثين ومعلمين أصليين، والشرح كامل بدونه. الخطة: 4 أسابيع، 30 إلى 45 دقيقة يوميًا.'
image: cover.jpg
modules:
- id: m1
  title: 'الأيام 1-4: ابدأ بالكلام: التحية وتقديم نفسك'
  lessons:
  - id: m1-l1
    title: ابدأ من هنا
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: 'تكلّم من أول يوم: Hola, me llamo...'
    file: lessons/m1-l2.md
    minutes: 25
    media: https://www.youtube.com/watch?v=JsGQizTuPSo
  - id: m1-l3
    title: الحروف والنطق
    file: lessons/m1-l3.md
    minutes: 30
  - id: m1-l4
    title: الأرقام والعمر ورقم الهاتف
    file: lessons/m1-l4.md
    minutes: 30
    media: https://www.youtube.com/watch?v=bp9OZoQu3A0&t=992&end=2733
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (30 ثانية): حيِّ المستمع، قدّم نفسك بالإسباني (اسمك، بلدك، مدينتك، عملك)، وتهجَّ اسمك.'
  - id: m1-explain
    type: explain
    prompt: 'Escribe 5 frases sobre ti: tu nombre, tu país, tu ciudad, tu trabajo y tu edad.'
    min_words: 25
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
