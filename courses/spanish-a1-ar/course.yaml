    type: practical
    prompt: 'تسجيل صوتي (45 ثانية): يومك العادي بالأوقات وستة أفعال على الأقل. ارفعه.'
  - id: m3-explain
    type: explain
    prompt: اكتب 5 جمل بالإسبانية عمّا يفعله صديق كل يوم (صيغ él/ella).
