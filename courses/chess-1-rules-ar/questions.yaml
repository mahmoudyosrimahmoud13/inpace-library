q1:
  text: أي قطعة تبدأ على d1؟
  show: 4
  options:
    a: الملك الأبيض
    b: الوزير الأسود
    c: الوزير الأبيض
    d: فيل أبيض
q2:
  text: كم مربعًا تتحكم فيه قلعة في وسط رقعة فاضية؟
  show: 4
  options:
    a: '27'
    b: '14'
    c: '16'
    d: '8'
q3:
  text: 'الجندي يأكل:'
  show: 4
  options:
    a: مثل الحصان
    b: للأمام مباشرة
    c: قطريًا للأمام، مربعًا واحدًا
    d: قطريًا للخلف
q4:
  text: أي قطعة تستطيع القفز فوق القطع؟
  show: 4
  options:
    a: الوزير
    b: الملك
    c: الحصان
    d: الفيل
q5:
  text: 'إعطاء حصان مقابل قلعة:'
  show: 4
  options:
    a: غير مسموح
    b: 'سيئ: تخسر نقطتين'
    c: 'جيد: تكسب حوالي نقطتين'
    d: متساوٍ
q6:
  text: 'في التبييت القصير، يذهب الملك الأبيض إلى:'
  show: 4
  options:
    a: f1
    b: g1
    c: h1
    d: c1
q7:
  text: 'لا يجوز لك التبييت لو:'
  show: 4
  options:
    a: كان ملكك في كش
    b: تحرّك وزيرك
    c: بيّت خصمك
    d: كانت النقلة 20
q8:
  text: 'الأخذ في الطريق ممكن:'
  show: 4
  options:
    a: للملك فقط
    b: على الصف الثامن فقط
    c: في أي وقت لاحق
    d: في النقلة التالية مباشرة لنقلة المربعين للجندي فقط
q9:
  text: 'اللاعب الذي عليه الدور ليس في كش لكنه بلا أي نقلة قانونية. النتيجة:'
  show: 4
  options:
    a: كش مات
    b: فوز للاعب الذي عليه الدور
    c: تعادل بالجمود
    d: يتخطى اللاعب دوره
q10:
  text: أي هذه تعادل لعدم كفاية القطع؟
  show: 4
  options:
    a: ملك وجنديان ضد ملك
    b: ملك ووزير ضد ملك
    c: ملك وقلعة ضد ملك
    d: ملك وفيل ضد ملك
q11:
  text: ماذا تعني Nbd2 (الحصان إلى d2)؟
  show: 4
  options:
    a: فيل يذهب إلى d2
    b: حصانان يتحركان
    c: الحصان الذي على العمود b يذهب إلى d2
    d: حصان يأكل على d2
q12:
  text: ماذا تعني exd5 (الجندي يأكل على d5)؟
  show: 4
  options:
    a: الجندي الذي على العمود e يأكل على d5
    b: قطعة على e5 تذهب إلى d5
    c: جندي e يترقّى
    d: الملك يذهب إلى d5
q13:
  text: 'الأبيض: الملك على g1 والقلعة على d1 وجنود f2 g2 h2. الأسود: الملك على g8 وجنود f7 g7 h7. الأبيض يلعب:'
  show: 4
  options:
    a: Kf1 (الملك إلى f1)
    b: Rd8# (القلعة إلى d8، كش مات)
    c: h3
    d: Rd7 (القلعة إلى d7)
q14:
  text: 'بعد 1. e4 e5 2. Bc4 (الفيل إلى c4) Nc6 (الحصان إلى c6) 3. Qh5 (الوزير إلى h5)، نقلة جيدة للأسود:'
  show: 4
  options:
    a: 3... Nd4 (الحصان إلى d4)
    b: 3... Ke7 (الملك إلى e7)
    c: 3... Nf6 (الحصان إلى f6)
    d: 3... g6
q15:
  text: 'عند المات بالملك والوزير، أكبر خطر هو:'
  show: 4
  options:
    a: التعادل بالاتفاق
    b: خسارة الوزير بكش الملك
    c: نفاد النقلات
    d: الجمود
q16:
  text: أي نقلة أولى جيدة؟
  show: 4
  options:
    a: 1. Nh3 (الحصان إلى h3)
    b: 1. e4
    c: 1. h4
    d: 1. a3
q17:
  text: أي مبدأ افتتاح صحيح؟
  show: 4
  options:
    a: أخرج الوزير أولًا
    b: طوّر الأحصنة والأفيال مبكرًا وبيّت
    c: ادفع جنود الحافة أولًا
    d: حرّك نفس القطعة مرات كثيرة
q18:
  text: 'خصمك أخرج الوزير مبكرًا. يجب أن:'
  show: 4
  options:
    a: تطوّر قطعك مع مهاجمة الوزير
    b: تقدّم ملكك
    c: تدفع كل جنودك
    d: تخرج وزيرك أيضًا
q19:
  text: 'أول سؤال في روتين التفكير:'
  show: 4
  options:
    a: أي قطعة أجمل؟
    b: ماذا فعلت نقلة خصمي الأخيرة؟
    c: كم بقي من الوقت؟
    d: هل أستطيع التبييت؟
q20:
  text: 'أفضل نظام وقت للتعلّم:'
  show: 4
  options:
    a: أي نظام، لا يهم
    b: البُلِت، دقيقة واحدة
    c: الرابيد، مثل 15+10
    d: البليتز، 3 دقائق
