q30:
  text: أيّ حقائق الترتيب التالية صحيحة؟
  show: 4
  options:
    a: الـ bubble sort هي O(n log n)
    b: الـ quick sort قد تكون O(n²) في أسوأ حالة
    c: الـ merge sort هي O(n log n) حتى في أسوأ حالة
    d: الـ quick sort دائمًا stable
    e: الـ merge sort بلا ذاكرة إضافية
    f: sorted في Python هي O(n²)
