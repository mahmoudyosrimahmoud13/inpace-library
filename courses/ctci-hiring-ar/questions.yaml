q26:
  text: أيّ مما يلي صحيح عن حيل الـ bits؟
  show: 4
  options:
    a: n | 1 يضاعف n دائمًا
    b: عمل XOR على قائمة كل قيمة فيها مكررة مرتين إلا واحدة يترك تلك الواحدة
    c: x ^ x تساوي x
    d: ~x تساوي x في Python
    e: n & (n - 1) يمسح أدنى bit قيمتها 1
    f: الإزاحة لليسار تقسم على 2
q27:
  text: دالة الدرج الـ recursive البسيطة عملت 433,993 استدعاءً لـ n = 20. ما الحل؟
  show: 4
  options:
