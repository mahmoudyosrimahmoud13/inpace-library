q1:
  text: بحسب الكتاب، كيف تُقيَّم إجابتك عن سؤال المقابلة؟
  show: 4
  options:
    a: السؤال الصعب عليك صعب على الأغلب على غيرك أيضًا
    b: من مدير التوظيف وحده، بلا ملاحظات مكتوبة
    c: فقط على هل يعمل الكود النهائي
    d: مقابل إجابة مثالية، فأي خطأ يعني الرسوب
    e: بسرعة بدئك في الكتابة
    f: بالمقارنة مع مرشحين آخرين جاءهم السؤال نفسه
q2:
  text: أيّ مما يلي خطوات في مسار التوظيف المعتاد؟
  show: 4
  options:
    a: فرز تقني قبل الجولة النهائية
    b: قرار مبني على الملاحظات المكتوبة للمقابِلين
    c: أن تختار المقابِلين بنفسك
    d: امتحان مكتوب عن تاريخ الشركة
    e: جولة نهائية بلا برمجة إطلاقًا، لكل وظائف الهندسة
    f: عرض قبل أي مقابلة
q3:
  text: أيّ مما يلي من الأشياء الأربعة التي يكتبها مقابِل البرمجة عادةً؟
  show: 4
  options:
    a: 'التواصل: هل استطاع أن يتابع تفكيرك؟'
    b: أي محرر تستخدم
    c: 'التحقق: هل اختبرت كودك بنفسك؟'
    d: سرعتك في الكتابة
    e: درجاتك الجامعية
    f: كم لغة تعرف
q4:
  text: مرشح حلّ المسألة صحيحةً لكن في صمت. لماذا قد يحصل على تقييم أقل من المتوقع؟
  show: 4
  options:
    a: المقابِلون يقيّمون الكلام فقط
    b: على المرشح الصامت أن يبدأ من جديد
    c: لا يجد المقابِل ما يكتبه عن التواصل
    d: الصمت مخالف للقواعد
    e: لا يرى المقابِل طريقة حله للمشكلة
    f: الإجابات الصحيحة تُخصم دائمًا
q5:
  text: كيف تستخدم وصف الجزء II لشركات بعينها؟
  show: 4
  options:
    a: اقرأه لتفهم النمط المشترك
    b: راجع إجراءات كل شركة الحالية قبل المقابلة
    c: استخدمه لتعرف الأسئلة التي ستأتيك
    d: 'تجاهله: الشركات ليس لها إجراءات'
    e: اعتبره قواعد تتبعها كل الشركات
    f: احفظه على أنه الإجراء الدقيق اليوم
q6:
  text: أيّ نقاط السيرة الذاتية التالية قوية؟
  show: 4
  options:
    a: عملت على الـ backend
    b: مجتهد وأحب العمل الجماعي
    c: كتبت 120 اختبارًا آليًا كشفت 14 خطأً قبل الإصدار
    d: استخدمت تقنيات كثيرة
    e: خفّضت زمن استجابة الـ API من 900 ms إلى 200 ms بإضافة caching
    f: مسؤول عن الاختبار
q7:
  text: لماذا تستخدم تصميمًا بسيطًا بعمود واحد للسيرة الذاتية؟
  show: 4
  options:
    a: أسرع على الـ recruiter في المرور عليها
    b: الأيقونات أفضل دائمًا
    c: برامج الـ ATS كثيرًا ما تقرأ السيرة أولًا وقد تربكها الجداول والأعمدة
    d: يجعل السيرة أطول
    e: الأعمدة ممنوعة قانونًا
    f: الـ recruiters يقرؤون السطر الأول فقط
q8:
  text: في الإجابة السلوكية، ماذا يجب أن تفعل؟
  show: 4
  options:
    a: أن تبدأ بجملة تلخص القصة
    b: أن تختار ميزة متخفية حين تُسأل عن نقطة ضعف
    c: أن تقول 'نحن' طوال الوقت لتبدو متواضعًا
    d: أن تقضي أغلب الوقت على ما فعلتَه أنت
    e: أن تتكلم عشر دقائق على الأقل
    f: ألا تذكر أي نتائج
q9:
  text: كم قصة جاهزة يقترح الدرس أنك تحتاج؟
  show: 4
  options:
    a: من وظيفتك الأخيرة فقط
    b: قصة لكل سؤال ممكن بالضبط
    c: عددًا يكفي لأن تغطي القصة الواحدة عدة موضوعات
    d: 'ولا واحدة: ارتجل'
    e: من خمس إلى ثماني
    f: ثلاثون على الأقل
q10:
  text: ما الذي يجعل المشروع يُحسب جيدًا في السيرة الذاتية؟
  show: 4
  options:
    a: أنه منسوخ من شرح بلا تغيير
    b: أنه بلا README ليبدو غامضًا
    c: أنه منتهٍ ويعمل، وله README جيد
    d: أنه غير منتهٍ لكنه طموح
    e: أنك تستطيع شرح كل جزء منه بعمق
    f: أنه يستخدم أكبر عدد من الـ frameworks
q11:
  text: أيّ العبارات التالية عن Big O صحيحة؟
  show: 4
  options:
    a: O(n + m) تُبسَّط دائمًا إلى O(n)
    b: O(log n) تنمو أسرع من O(n)
    c: O(n² + n) تُبسَّط إلى O(n²)
    d: O(n²) أسرع من O(n) مع n الكبيرة
    e: Big O تقيس الثواني على جهازك
    f: O(2n) تُبسَّط إلى O(n)
q12:
  text: في درس البناء، زادت n من 1,000 إلى 2,000. ماذا حدث؟
  show: 4
  options:
    a: عملت نسخة الأزواج نصف العمل
    b: لم تتغير أي منهما
    c: عملت نسخة الـ set نحو ضعف العمل
    d: عملت نسخة الأزواج نحو أربعة أضعاف العمل
    e: عملت نسخة الـ set أربعة أضعاف
    f: عملت النسختان العمل نفسه
q13:
  text: احتاج الـ binary search على قائمة مرتبة من 1,000,000,000 عنصر إلى 30 خطوة. لماذا هذا العدد القليل؟
  show: 4
  options:
    a: 2 أس 30 نحو مليار
    b: يعمل على القوائم الصغيرة فقط
    c: يستخدم hash table
    d: يقرأ كل عنصر بسرعة كبيرة
    e: يتخطى أول مليار عنصر
    f: كل خطوة تقسم العناصر الباقية نصفين
q14:
  text: أيّ مما يلي صحيح عن مثال Fibonacci الـ recursive؟
  show: 4
  options:
    a: النسختان تعملان عدد الاستدعاءات نفسه
    b: النسخة البطيئة O(n)
    c: مع الـ memoization تُحسب كل قيمة مرة واحدة، فيصبح O(n)
    d: الـ memoization تجعله أبطأ
    e: بدون ذاكرة، ينمو عدد الاستدعاءات أُسّيًا
    f: الـ recursion لا يمكن أن تكون سريعة أبدًا
q15:
  text: تمر بحلقة على القائمة a، وبداخلها على قائمة مختلفة b. كم الوقت؟
  show: 4
  options:
    a: O(1)
    b: O(a · b)
    c: O(a²) دائمًا
    d: O(a + b)
    e: ليس O(n²) إلا إذا كان لـ a وb الحجم نفسه
    f: O(log a)
q16:
  text: في 'Look for BUD'، علامَ تدل الحروف؟
  show: 4
  options:
    a: Binary search
    b: الـ Bottlenecks والعمل غير الضروري (Unnecessary work)
    c: Big O، الحد الأعلى
    d: تراجع عن الخطوة الأخيرة (Undo)
    e: Debugging
    f: العمل المكرر (Duplicated work)
q17:
  text: أيّ الخطوات تأتي قبل كتابة الكود في الطريقة؟
  show: 4
  options:
    a: قول brute force والـ Big O الخاص به
    b: اختبار الحالات الحدّية على الكود المنتهي
    c: تتبع الخطة على مثالك
    d: تحسين أسماء المتغيرات
    e: إرسال الكود
    f: طلب الإجابة
q18:
  text: في مسألة أسعار السهم، لماذا O(n) هي أفضل زمن ممكن؟
  show: 4
  options:
    a: أي سعر قد يكون أفضل يوم للشراء أو البيع
    b: لأن الترتيب O(n)
    c: لأن O(1) مستحيلة في كل مسألة
    d: لأن الـ brute force هو O(n)
    e: يجب النظر إلى كل سعر مرة على الأقل
    f: لأن الإجابة رقم واحد
q19:
  text: ما الذي جعل الحل السريع لمسألة السهم ممكنًا؟
  show: 4
  options:
    a: بحث recursive
    b: hash table لكل الأسعار
    c: تجربة كل الأزواج
    d: لكل يوم، لا يهم إلا أرخص سعر سابق
    e: الاحتفاظ بأقل قيمة حتى الآن أثناء المرور على القائمة
