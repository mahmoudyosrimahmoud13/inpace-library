q22:
  text: ماذا يجد المؤشران البطيء والسريع (تقنية الـ runner) في الـ linked list؟
  show: 4
  options:
    a: طول كل عقدة
    b: القائمة مرتبة
    c: هل توجد دائرة
    d: العنصر رقم k الأكبر مباشرةً
