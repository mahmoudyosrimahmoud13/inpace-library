q20:
  text: 'من الطرق الجيدة لاختبار كود المقابلة:'
  show: 4
  options:
    a: المقارنة مع brute force تثق به على مدخلات عشوائية كثيرة
    b: تتبع مثالك يدويًا
    c: أن تطلب من المقابِل أن يختبره
    d: اختبار المدخلات الكبيرة جدًا فقط
