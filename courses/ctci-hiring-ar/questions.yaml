  show: 4
  options:
    a: اختر الأكبر دائمًا
    b: اختر، ثم استكشف من هذا الاختيار
    c: توقف عند أول إجابة حتى لو احتجت كل الإجابات
    d: انسخ المدخلات كاملة في كل خطوة
    e: تراجع عن الاختيار بعد ذلك
    f: رتّب المدخلات أولًا
