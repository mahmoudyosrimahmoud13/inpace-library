    o71e689: Because Jinja escapes it
    o1bd892: Web pages can't run JavaScript at all
    o4dfbbb: It's served with a sandbox Content-Security-Policy
    o7aafc5: Because it's in a different folder
    o93f01c: Its CSP blocks connections (connect-src 'none') and isolates it
q13:
