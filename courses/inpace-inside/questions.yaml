q1:
  text: Why does inPace's server listen on 127.0.0.1 and not 0.0.0.0?
  show: 4
  options:
    o79da0a: So only programs on the same device can reach it
    o08ce03: Android doesn't allow other addresses
    obc9258: Because SQLite only works on 127.0.0.1
    o029c39: To keep other devices on the network from opening the app
    o4004ca: To get a free HTTPS certificate
    oabec69: 127.0.0.1 is faster than any other address
q2:
  text: What does NavMiddleware do when a request has the X-InPace-Nav header and the route answers with a redirect?
  show: 4
  options:
    o16a6e0: It lets the page script decide how to navigate, so it can replace the page
    of04257: It follows the redirect on the server
    o0d65cf: It returns a 500 error
    o3719a1: 'It turns the redirect into JSON {"go": url}'
    od3262f: It caches the redirect for an hour
    oed5824: It strips the header and does nothing
q3:
  text: Where does a lesson's 'done' state really live?
  show: 4
  options:
    oee8d82: As a lesson_done event that progress is computed from
    of3e419: In an append-only event in vault.db
    o57c742: On a server in the cloud
    o066d19: In the course.yaml file
    of1b996: In a progress column that is updated
    o31096f: In the browser's localStorage
q4:
  text: Which pair is the right match of tool and job in inPace?
  show: 4
  options:
    off7169: 'Mermaid: building the APK'
    o334f38: 'PyInstaller: one installable desktop file per system'
    o592a73: 'SQLite: drawing the island'
    of974a9: 'serious_python: running the Python app inside the Android app'
    of0edd4: 'Jinja: signing milestones'
    o532d29: 'pywebview: the database'
q5:
  text: What is a person's inPace id?
  show: 4
  options:
    off715e: Their email address
    o850796: A random number from a server
    o2e667f: Their Ed25519 public key, written in hex
    o0e69f4: Their phone number
    o84aef2: The public half of the key pair made on their device
    o828d6b: The SHA-256 of their name
q6:
  text: Why are keys sorted and spaces removed before signing?
  show: 4
  options:
    oc65460: Because Ed25519 can't read spaces
    o13ea35: So signatures made on one device verify on another
    od36f1e: So every device turns the same data into exactly the same bytes
    o3d1907: To hide the data
    o120d98: To make the file smaller for WhatsApp
    obc853a: Because SQLite requires it
q7:
  text: What stops a bug in the app from rewriting an old event?
  show: 4
  options:
    o71762e: Python's type hints
    o998b0e: Uvicorn blocks it
    o87fef4: SQLite triggers that abort UPDATE and DELETE on events
    o710a48: A comment in the code
    o119c96: The database itself refuses changes to append-only tables
    ob96e6c: The milestones are in a separate file
q8:
