  show: 4
  options:
    o896a83: Nothing, it's removed
    oa2a4c3: A diagram, drawn offline, that you can zoom and open full screen
    o96147f: A diagram drawn in the page by the bundled Mermaid library
    o37c883: An image fetched from the internet
    o44fcc0: A Python code block
    o437c60: A link to mermaid.live
q11:
  text: How does the app make sure a library pack wasn't changed on the way?
  show: 4
  options:
    oea5e52: It checks the pack's SHA-256 against library.json
    o68de23: It doesn't check
    of8ada1: It asks the author by email
    oddcbfd: It checks the file name
    o2c394d: It trusts GitHub
