  show: 4
  options:
    ob1c798: 'The chain is reported broken at milestone #2'
    o3235c4: Nothing, summaries aren't checked
    o2cad0a: 'Only milestone #3 fails'
    o8fd75a: 'Milestone #2''s hash no longer matches its body'
    o35d649: The checker's key is rejected
    o640a0c: The file opens normally
q9:
  text: How does inPace name quiz options when it converts an all-in-one course?
  show: 4
  options:
    o355997: By numbering right answers 1 and wrong ones 0
    o712904: a, b, c, d with the right answer first
    oe13a33: With neutral ids from a SHA-256 of the question id and the option text
    o9e6f09: With random ids that change every launch
    o5c9cdd: With ids like o1a2b3 that don't reveal which is right
    oc9217a: With the option text itself
q10:
