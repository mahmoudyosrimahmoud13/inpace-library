id: fmaa-prc-ar
title: 'التحضير لاختبار FMAA: الإدارة المالية والمحاسبة'
version: 1
language: ar
description: 'تحضير كامل لاختبار FMAA (PRC) في 12 وحدة: المحاسبة الأساسية والقوائم المالية، والحوكمة والرقابة الداخلية،
  والأصول والالتزامات والإيرادات، وتحليل القوائم والنسب المالية، والموازنات، والتكاليف والتكاليف غير المباشرة، وتحليل
  الأداء ونقطة التعادل، والأخلاقيات المهنية والاحتيال. الشرح بالعربي والمصطلحات بالإنجليزي كما في الاختبار. اختبار
  من 10 أسئلة بعد كل وحدة، والنجاح بنسبة 60%. الوحدتان الأخيرتان مراجعة شاملة.'
image: cover.jpg
