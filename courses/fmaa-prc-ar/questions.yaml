    b: التكاليف غير المباشرة المقدرة ÷ النشاط المقدر
    c: التكاليف غير المباشرة الفعلية ÷ النشاط المقدر
    d: التكاليف غير المباشرة المقدرة ÷ النشاط الفعلي
    e: إجمالي التكاليف غير المباشرة ÷ الوحدات المنتجة
    f: الثابتة ÷ المتغيرة
m10q2:
  text: 'إذا زادت التكاليف غير المباشرة المحمّلة عن الفعلية، فالتحميل:'
  show: 4
  options:
    a: ناقص
    b: زائد
    c: صحيح تمامًا
    d: لا علاقة له بقائمة الدخل
    e: يُضاف لتحت التشغيل
    f: يُحوَّل لحقوق الملكية
m10q3:
  text: 'التكاليف على أساس الأنشطة (ABC) أفضل من الطريقة التقليدية عندما:'
  show: 4
  options:
    a: تصنع الشركة منتجًا واحدًا
    b: تستهلك المنتجات التكاليف غير المباشرة بنسب مختلفة وتكون هذه التكاليف كبيرة
    c: تكون عملية التصنيع بسيطة
    d: تكون التكاليف غير المباشرة صغيرة
    e: تستخدم الشركة تكاليف الأوامر فقط
    f: يوجد مسبب تكلفة واحد فقط
m10q4:
  text: 'في ABC، مسبب التكلفة (Cost driver) هو:'
  show: 4
  options:
    a: الشخص الذي يعتمد الإنفاق
    b: النشاط أو العامل الذي يجعل التكاليف غير المباشرة تتغير
    c: الفرق بين المقدر والفعلي
    d: أي تكلفة غير مباشرة محمّلة على المنتجات
    e: المعدل المستخدم للتحميل
    f: نوع من التكاليف الثابتة
m10q5:
  text: 'الطريقة المباشرة لتوزيع تكاليف أقسام الخدمات:'
  show: 4
  options:
    a: توزع على أقسام الإنتاج فقط وتتجاهل الخدمات المتبادلة
    b: توزع بين أقسام الخدمات أولًا ثم على الإنتاج
    c: توزع كل الخدمات المتبادلة رياضيًا
    d: هي أدق طريقة
    e: تستخدم معادلات تبادلية
    f: تتطلب موافقة رؤساء الأقسام
m10q6:
  text: إذا استخدمت شركة ساعات الآلات أساسًا للتحميل، فأي حالة تسبب أكبر تشويه للتكلفة؟
  show: 4
  options:
    a: كل المنتجات تستخدم نفس ساعات الآلات
    b: ساعات الآلات هي المسبب الوحيد
    c: بعض المنتجات تعتمد على العمالة وبعضها على الآلات
    d: التكاليف غير المباشرة صغيرة مقارنة بالمباشرة
    e: الشركة تصنع منتجًا واحدًا
    f: المتغيرة أكبر من الثابتة
m10q7:
  text: 'التكاليف غير المباشرة الثابتة للوحدة تنخفض إذا:'
  show: 4
  options:
    a: زاد إجمالي الثابتة
    b: زاد حجم الإنتاج
    c: زادت المتغيرة
    d: زادت أسعار البيع
    e: زادت التكاليف الإدارية
    f: ارتفعت أسعار المواد
m10q8:
  text: 'التحميل الناقص في نهاية السنة يُقفل عادة في:'
  show: 4
  options:
    a: إيرادات المبيعات
    b: حقوق الملكية
    c: تكلفة البضاعة المباعة
    d: إنتاج تحت التشغيل
    e: الذمم الدائنة
    f: مخزون المواد الخام
m10q9:
  text: 'التكاليف الثابتة غير المباشرة المقدرة $120,000، والفعلية $118,000. انحراف الإنفاق للتكاليف الثابتة:'
  show: 4
  options:
    a: $2,000 مواتٍ
    b: $6,000 غير مواتٍ
    c: $2,000 غير مواتٍ
    d: $8,000 مواتٍ
    e: $6,000 مواتٍ
    f: صفر
m10q10:
  text: 'تختلف الطريقة التنازلية عن المباشرة في أنها:'
  show: 4
  options:
    a: تستخدم معادلات تبادلية
    b: تعترف جزئيًا بالخدمات التي تقدمها أقسام الخدمات لبعضها
    c: توزع المتغيرة فقط
    d: أبسط في التطبيق
    e: لا تحتاج ترتيبًا للتوزيع
    f: توزع الثابتة فقط
m11q1:
  text: قسم حقق ربحًا تشغيليًا $80,000 بأصول $400,000، والعائد المطلوب 15%. كم الدخل المتبقي؟
  show: 4
  options:
    a: $20,000
    b: −$20,000
    c: $60,000
    d: $80,000
    e: $20,000 سالب
    f: $140,000
m11q2:
  text: 'عائد القسم (أ) 25% وتكلفة رأس المال 18%. عُرض عليه مشروع عائده 21%. مدير القسم غالبًا سوف:'
  show: 4
  options:
    a: يقبله لأنه يتجاوز تكلفة رأس المال
    b: يرفضه لأنه سيخفض عائد القسم عن 25%
    c: يقبله لأنه يعظم قيمة المساهمين دائمًا
    d: يرفضه لأن 21% أقل من تكلفة رأس المال
    e: يقبله لأن عائد الشركة سيرتفع
    f: يرفضه لأن هامش الأمان غير كافٍ
m11q3:
  text: سعر البيع $80، والتكلفة المتغيرة $50، والتكاليف الثابتة $90,000. كم نقطة التعادل بالوحدات؟
  show: 4
  options:
    a: 1,125 وحدة
    b: 1,800 وحدة
    c: 3,000 وحدة
    d: 1,500 وحدة
    e: 1,000 وحدة
    f: 2,000 وحدة
m11q4:
  text: 'هامش الأمان يقيس:'
  show: 4
  options:
    a: أقل ربح مطلوب لاستمرار النشاط
    b: كم يمكن أن تنخفض المبيعات قبل الوصول للتعادل
    c: نسبة التكاليف الثابتة المغطاة بهامش المساهمة
    d: أقصى خصم يمكن منحه للعملاء
    e: الفرق بين المبيعات المقدرة والفعلية
    f: زيادة الربح عن العائد المطلوب
m11q5:
  text: 'في قرار التصنيع أو الشراء، التكاليف الملائمة للمقارنة هي:'
  show: 4
  options:
    a: التكاليف غير المباشرة الكلية مقابل سعر الشراء
    b: التكلفة الكلية للوحدة مقابل سعر المورد
    c: التكلفة الصناعية المتغيرة مع الثابتة التي يمكن تجنبها مقابل سعر المورد
    d: التكاليف الغارقة مع المتغيرة مقابل سعر الشراء
    e: إجمالي التكاليف الثابتة مقابل سعر الشراء
    f: سعر التحويل مقابل سعر السوق
m11q6:
  text: أي تكلفة يجب تجاهلها عند قرار قبول طلبية خاصة بسعر أقل (مع وجود طاقة فائضة)؟
  show: 4
  options:
    a: التكلفة الصناعية المتغيرة للوحدة
    b: تكلفة التغليف الخاص بالطلبية
    c: التكاليف الثابتة غير المباشرة التي لن تتغير
    d: المواد المباشرة للطلبية
    e: الأجور المباشرة للطلبية
    f: تكاليف التوصيل الإضافية
m11q7:
  text: 'خط إنتاج صافي ربحه سالب لكن هامش قطاعه موجب. القرار الصحيح:'
  show: 4
  options:
    a: إلغاؤه فورًا
    b: الإبقاء عليه لأن إلغاءه سيخفض الربح الكلي
    c: استبداله بمنتج جديد
    d: خفض سعره لزيادة الكمية
    e: نقل الإنتاج لمكان أرخص
    f: تعهيد الإنتاج
m11q8:
  text: 'عند نقطة الانفصال في الإنتاج المشترك، تقرر الإدارة بيع المنتج أو تشغيله إضافيًا. التكاليف المشتركة حتى
    نقطة الانفصال:'
  show: 4
  options:
    a: ملائمة للقرار
    b: متغيرة ولذلك ملائمة
    c: تكاليف غارقة ولذلك غير ملائمة
    d: العامل الأساسي في القرار
    e: توزع بالتساوي على كل المنتجات
    f: تُطرح من الإيراد الإضافي
m11q9:
  text: 'باستخدام دوبونت: صافي الربح $60,000، والمبيعات $600,000، والأصول $400,000. كم العائد على الاستثمار؟'
  show: 4
  options:
    a: 15%
    b: 10%
    c: 25%
    d: 150%
    e: 6.67%
    f: 12%
m11q10:
  text: 'مبيعات شركة $500,000، والتكاليف المتغيرة $300,000، والثابتة $120,000. نسبة هامش المساهمة:'
  show: 4
  options:
    a: 24%
    b: 60%
    c: 40%
    d: 75%
    e: 16%
    f: 50%
m12q1:
  text: اكتشفت محاسبة أن الشركة تسجل مبيعات وهمية. وفق معايير IMA، أي معيار يُنتهك مباشرة بالمشاركة في ذلك؟
  show: 4
  options:
    a: الكفاءة
    b: السرية
    c: النزاهة
    d: المساءلة
    e: الاستقلال
    f: الشفافية
m12q2:
  text: أي ضلع في مثلث الاحتيال يعني أن المحتال يقنع نفسه بأن فعله مبرَّر؟
  show: 4
  options:
    a: الضغط
    b: الفرصة
    c: التبرير
    d: الحافز
    e: المخاطرة
    f: الدافع
m12q3:
  text: 'طلب المشرف من محاسب إدارة إخفاء معلومات مالية سلبية عن تقرير مجلس الإدارة. المعيار الذي يُختبر هنا:'
  show: 4
  options:
    a: الكفاءة، فقد لا يملك المحاسب المهارة لعرضها
    b: المصداقية، فيجب عرض المعلومات بعدل والإفصاح عن النتائج السلبية
    c: السرية، فيجب إبقاء المعلومات خاصة
    d: النزاهة، فيجب رفض الهدايا
    e: الاستقلال، فلا يجب أن يتبع المشرف
    f: الموضوعية، فيجب حساب الأرقام بدقة
m12q4:
  text: ما المرحلة الأولى في غسل الأموال؟
  show: 4
  options:
    a: 'التمويه: نقل الأموال عبر عمليات معقدة'
    b: 'الدمج: إعادة الأموال للاقتصاد كأنها مشروعة'
    c: 'الإيداع: إدخال الأموال غير المشروعة في النظام المالي'
    d: 'التحويل: تغيير العملة'
    e: 'الإخفاء: إخفاء المصدر في السجلات'
    f: 'الهيكلة: إنشاء شركات وهمية'
m12q5:
  text: 'طلب المدير المالي رسملة مصروف إصلاح كبير بدلًا من تحميله مصروفًا لتحقيق أهداف الأرباح. هذا مثال على:'
  show: 4
  options:
    a: اختلاس الأصول
    b: الفساد
    c: احتيال القوائم المالية
    d: غسل الأموال
    e: محاسبة جريئة لكنها مقبولة
    f: تغيير في تقدير محاسبي
m12q6:
  text: 'موظف يحتفظ بنقدية الشركة ويسجل عمليات النقدية أيضًا. هذا يخلق أكبر خطر لـ:'
  show: 4
  options:
    a: احتيال القوائم المالية من الإدارة
    b: اختلاس الأصول بالسرقة قبل التسجيل أو بعده
    c: الفساد بالرشوة
    d: غسل الأموال
    e: تضارب المصالح
    f: قصور الإفصاح في التقارير
m12q7:
  text: أي إطار لاتخاذ القرار الأخلاقي يركز على تحقيق أكبر خير لأكبر عدد؟
  show: 4
  options:
    a: الحقوق والواجبات
    b: الفضيلة
    c: النفعي
    d: العدالة
    e: الصالح العام
    f: الإبلاغ عن المخالفات
m12q8:
  text: علمت محاسبة أن موردًا يبالغ في الأسعار بسبب أخطاء، وسكتت لأنها تلقت منه هدايا ثمينة. أي معيارين من IMA انتُهكا
    بوضوح؟
  show: 4
  options:
    a: الكفاءة والسرية
    b: النزاهة والمصداقية
    c: الكفاءة والمصداقية
    d: النزاهة والكفاءة
    e: السرية والمصداقية
    f: الاستقلال والموضوعية
m12q9:
  text: 'وفق نهج IMA، إذا لم تُحل المعضلة الأخلاقية مع المشرف المباشر، فالخطوة التالية:'
  show: 4
  options:
    a: الاستقالة فورًا
    b: إبلاغ الجهات الرقابية الخارجية
    c: التصعيد للمستوى الإداري الأعلى أو لجنة المراجعة أو مجلس الإدارة
    d: التواصل مع الإعلام
    e: استشارة محامٍ والاستقالة
    f: عدم فعل شيء وتوثيق الموقف
m12q10:
  text: أي وصف يوضح أفضل الفرق بين الموظف الأخلاقي والموظف الفاضل؟
  show: 4
  options:
    a: الأخلاقي يتبع القانون والفاضل يتجاهله
    b: الأخلاقي يطبق إرشادات المنظمة، والفاضل يتجاوزها ويفعل الصواب حتى لو لم يكن مطلوبًا
    c: الفاضل يتبع ميثاق IMA فقط والأخلاقي يتبع كل القوانين
    d: الأخلاقي أكثر أخلاقًا من الفاضل
    e: لا فرق حقيقي بينهما
    f: الفاضل يعظم الأرباح والأخلاقي يقلل التكاليف
