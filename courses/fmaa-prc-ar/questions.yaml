m1q1:
  text: ما الهدف الأساسي من المحاسبة؟
  show: 4
  options:
    a: تقليل الضرائب المستحقة على المنشأة
    b: تقديم معلومات مالية مفيدة لاتخاذ القرار
    c: إعداد رواتب الموظفين
    d: التأكد من قانونية كل العمليات
    e: إدارة العمليات اليومية للمنشأة
    f: حساب القيمة السوقية للشركة
m1q2:
  text: 'معادلة المحاسبة هي:'
  show: 4
  options:
    a: الأصول = الالتزامات − حقوق الملكية
    b: الأصول = حقوق الملكية + الإيرادات
    c: الأصول = الالتزامات + حقوق الملكية
    d: الالتزامات = الأصول + حقوق الملكية
    e: حقوق الملكية = الأصول − الإيرادات
    f: الأصول + الإيرادات = الالتزامات
m1q3:
  text: أي شكل قانوني يحمي ملاكه أكثر من المسؤولية الشخصية؟
  show: 4
  options:
    a: المنشأة الفردية
    b: شركة الأشخاص
    c: شركة المساهمة (Corporation)
    d: الجمعية غير الرسمية
    e: المشروع المشترك
    f: الجمعية التعاونية
m1q4:
  text: استثمرت المالكة $20,000 نقدًا في منشأتها. ما الأثر على المعادلة؟
  show: 4
  options:
    a: زيادة الأصول وزيادة الالتزامات
    b: زيادة الأصول وزيادة حقوق الملكية
    c: نقص الأصول ونقص حقوق الملكية
    d: لا أثر، فقط الحساب البنكي تغيّر
    e: زيادة الالتزامات ونقص حقوق الملكية
    f: زيادة الأصول وزيادة الإيرادات
m1q5:
  text: أي حساب يظهر في قائمة الدخل؟
  show: 4
  options:
    a: الذمم المدينة
    b: حقوق الملكية
    c: إيرادات المبيعات
    d: المخزون
    e: أوراق الدفع
    f: الأراضي
m1q6:
  text: المدين (Debit) يزيد أي أنواع الحسابات؟
  show: 4
  options:
    a: الالتزامات وحقوق الملكية
    b: الأصول والمصروفات
    c: الإيرادات وحقوق الملكية
    d: الالتزامات والإيرادات
    e: حقوق الملكية والأصول
    f: الإيرادات والمصروفات
m1q7:
  text: أي مما يلي يُعد التزامًا؟
  show: 4
  options:
    a: التأمين المدفوع مقدمًا
    b: الذمم المدينة
    c: الذمم الدائنة (Accounts payable)
    d: رأس مال المالك
    e: معدات المكتب
    f: النقدية
m1q8:
  text: 'اشترت المنشأة أدوات مكتبية بالآجل بمبلغ $500. القيد الصحيح:'
  show: 4
  options:
    a: مدين النقدية $500، دائن الأدوات المكتبية $500
    b: مدين الأدوات المكتبية $500، دائن الذمم الدائنة $500
    c: مدين الذمم الدائنة $500، دائن الأدوات المكتبية $500
    d: مدين المصروفات $500، دائن النقدية $500
    e: مدين الأدوات المكتبية $500، دائن الإيرادات $500
    f: مدين النقدية $500، دائن الذمم المدينة $500
m1q9:
  text: أي مما يلي ليس أصلًا؟
  show: 4
  options:
    a: النقدية
    b: المخزون
    c: الذمم المدينة
    d: الأجور المستحقة الدفع
    e: الإيجار المدفوع مقدمًا
    f: المعدات
m1q10:
  text: أصول المنشأة $80,000 والتزاماتها $30,000. كم حقوق الملكية؟
  show: 4
  options:
    a: $110,000
    b: $80,000
    c: $50,000
    d: $30,000
    e: $20,000
    f: $60,000
m2q1:
  text: أي قائمة مالية تعرض المركز المالي في تاريخ محدد؟
  show: 4
  options:
    a: قائمة الدخل
    b: قائمة التدفقات النقدية
    c: الميزانية
    d: قائمة التغيرات في حقوق الملكية
    e: تقرير الموازنة
    f: ميزان المراجعة
m2q2:
  text: 'في قائمة الدخل، مجمل الربح يُحسب كالتالي:'
  show: 4
  options:
    a: الإيرادات − المصروفات التشغيلية
    b: الإيرادات − تكلفة البضاعة المباعة
    c: الإيرادات − كل المصروفات
    d: صافي الربح + الضرائب
    e: المبيعات − المصروفات الإدارية
    f: تكلفة البضاعة المباعة − الإيرادات
m2q3:
  text: في أي قسم من قائمة التدفقات النقدية يظهر شراء معدات؟
  show: 4
  options:
    a: الأنشطة التشغيلية
    b: الأنشطة التمويلية
    c: الأنشطة الاستثمارية
    d: الأنشطة الرأسمالية
    e: الأنشطة غير النقدية
    f: الأنشطة التكميلية
m2q4:
  text: دفع توزيعات الأرباح يظهر في أي قسم من قائمة التدفقات النقدية؟
  show: 4
  options:
    a: الأنشطة التشغيلية
    b: الأنشطة الاستثمارية
    c: الأنشطة التمويلية
    d: الأنشطة الرأسمالية
    e: الأنشطة التكميلية
    f: أنشطة الأصول
m2q5:
  text: 'قائمة التغيرات في حقوق الملكية تعرض كل ما يلي ما عدا:'
  show: 4
  options:
    a: الرصيد الافتتاحي لحقوق الملكية
    b: صافي الربح للفترة
    c: النقدية المحصلة من العملاء
    d: التوزيعات المدفوعة للمساهمين
    e: الأسهم الجديدة المصدرة
    f: الرصيد الختامي لحقوق الملكية
m2q6:
  text: أي مما يلي يزيد صافي الربح في قائمة الدخل؟
  show: 4
  options:
    a: دفع توزيعات أرباح
    b: سداد قرض بنكي
    c: زيادة إيرادات المبيعات
    d: شراء معدات
    e: الحصول على قرض
    f: زيادة الذمم الدائنة
m2q7:
  text: 'الالتزامات المتداولة هي المستحقة خلال:'
  show: 4
  options:
    a: خمس سنوات
    b: ثلاث سنوات
    c: سنة واحدة
    d: ستة أشهر
    e: سنتين
    f: عشر سنوات
m2q8:
  text: 'الأرباح المحتجزة تمثل:'
  show: 4
  options:
    a: نقدية محفوظة في حسابات احتياطي
    b: توزيعات أُعلنت ولم تُدفع
    c: مجموع صافي الأرباح غير الموزعة على المساهمين
    d: إجمالي الإيرادات منذ التأسيس
    e: الديون طويلة الأجل التي سددتها الشركة
    f: مساهمات المالك في المنشأة
m2q9:
  text: أي بند غير نقدي يُضاف عادة إلى صافي الربح في الطريقة غير المباشرة؟
  show: 4
  options:
    a: زيادة الذمم الدائنة
    b: مصروف الإهلاك
    c: دفع التوزيعات
    d: إيرادات المبيعات
    e: مصروف الضرائب
    f: الفوائد المحصلة
m2q10:
  text: إجمالي أصول شركة $200,000، والتزامات طويلة الأجل $50,000، ومتداولة $30,000. كم حقوق الملكية؟
  show: 4
  options:
    a: $80,000
    b: $120,000
    c: $150,000
    d: $170,000
    e: $200,000
    f: $250,000
m3q1:
  text: 'حوكمة الشركات تعني أساسًا:'
  show: 4
  options:
    a: استراتيجيات التخطيط الضريبي للشركات
    b: نظام القواعد والممارسات الذي تُدار به الشركة وتُراقَب
    c: الاستراتيجية التسويقية للشركة
    d: عملية طرح الأسهم للاكتتاب العام
    e: سياسات الموارد البشرية
    f: إجراءات المراجعة السنوية
m3q2:
  text: أي جهة مسؤولة عادة عن مراقبة الإدارة وحماية مصالح المساهمين؟
  show: 4
  options:
    a: المراجعون الخارجيون
    b: مجلس الإدارة
    c: الإدارة المالية
    d: المساهمون مباشرة
    e: مصلحة الضرائب
    f: فريق العمليات
m3q3:
  text: 'مثال على رقابة داخلية وقائية:'
  show: 4
  options:
    a: التسوية البنكية
    b: الجرد الفعلي للمخزون
    c: اشتراط موافقتين على المدفوعات الكبيرة
    d: التقارير المالية الشهرية
    e: المراجعة السنوية
    f: تحليل الانحرافات
m3q4:
  text: 'الفصل بين المهام يعني:'
  show: 4
  options:
    a: فصل العمليات المحلية عن الدولية
    b: ألا يتحكم موظف واحد في كل مراحل العملية
    c: تدوير الموظفين بين الأقسام سنويًا
    d: فصل بيانات الرواتب عن سجلات الموارد البشرية
    e: تعهيد المحاسبة لشركات خارجية
    f: فصل وظيفة الضرائب عن التقارير المالية
m3q5:
  text: أي استراتيجية لإدارة المخاطر تعني مشاركة الخطر مع طرف آخر؟
  show: 4
  options:
    a: التجنب
    b: القبول
    c: النقل
    d: التخفيف
    e: التجاهل
    f: الإزالة
m3q6:
  text: 'المسؤولية الأساسية للمراجع الخارجي هي:'
  show: 4
  options:
    a: اكتشاف كل احتيال في المنظمة
    b: إعداد القوائم المالية للشركة
    c: إبداء رأي في عدالة عرض القوائم المالية
    d: رفع تقارير تشغيلية للإدارة مباشرة
    e: تصميم نظام الرقابة الداخلية
    f: الموافقة على النفقات الرأسمالية
m3q7:
  text: أي مما يلي رقابة كاشفة؟
  show: 4
  options:
    a: اشتراط كلمة مرور لنظام المحاسبة
    b: الفواتير المرقمة مسبقًا
    c: التسوية البنكية الشهرية
    d: حدود الصلاحيات للمشتريات
    e: فحص خلفية الموظفين الجدد
    f: الأقفال على المخازن
m3q8:
  text: أي وصف ينطبق على المخاطر الكامنة (Inherent risk)؟
  show: 4
  options:
    a: الخطر المتبقي بعد تطبيق الرقابة
    b: خطر فشل المراجع في اكتشاف الخطأ
    c: قابلية البند للخطأ بطبيعته قبل أي رقابة
    d: خطر فشل الرقابة نفسها
    e: خطر القرارات الإدارية السيئة
    f: خطر تغير ظروف السوق
m3q9:
  text: 'اكتشفت شركة أن موظفًا واحدًا يعتمد مدفوعات الموردين وينفذها. هذا فشل في:'
  show: 4
  options:
    a: الكفاءة
    b: الفصل بين المهام
    c: الحماية المادية
    d: رقابة المستندات
    e: رقابة تقنية المعلومات
    f: تقييم المخاطر
m3q10:
  text: أي مما يلي ليس من مكونات إطار COSO للرقابة الداخلية؟
  show: 4
  options:
    a: بيئة الرقابة
    b: تقييم المخاطر
    c: أنشطة الرقابة
    d: التنبؤ المالي
    e: المعلومات والتواصل
    f: المتابعة
m4q1:
  text: أي طريقة لتقييم المخزون تعطي أعلى تكلفة بضاعة مباعة عند ارتفاع الأسعار؟
  show: 4
  options:
    a: FIFO
    b: LIFO
    c: المتوسط المرجح
    d: التحديد المحدد
    e: التكلفة أو صافي القيمة البيعية أيهما أقل
    f: طريقة التجزئة
m4q2:
  text: 'طريقة المخصص للديون المعدومة مفضلة على الشطب المباشر لأنها:'
  show: 4
  options:
    a: أبسط في التطبيق
    b: تقابل مصروف الديون المعدومة بفترة تحقق الإيراد
    c: مطلوبة في قانون الضرائب
    d: تلغي الحاجة لجدول أعمار الديون
    e: تسجل الديون المعدومة فقط عند التأكد منها
    f: تزيد صافي الربح
m4q3:
  text: لدى شركة 40 وحدة بسعر $10 ثم 60 وحدة بسعر $12. بطريقة FIFO، إذا بيعت 50 وحدة فكم تكلفة البضاعة المباعة؟
  show: 4
  options:
    a: $500
    b: $550
    c: $600
    d: $520
    e: $480
    f: $610
m4q4:
  text: أي طريقة إهلاك تعطي مصروفًا أعلى في السنوات الأولى؟
  show: 4
  options:
    a: القسط الثابت
    b: وحدات الإنتاج
    c: القسط المتناقص (المعجّل)
    d: FIFO
    e: المتوسط المرجح
    f: مجموع أرقام السنوات فقط
m4q5:
  text: 'آلة بتكلفة $50,000، وقيمة متبقية $5,000، وعمر 5 سنوات. الإهلاك السنوي بالقسط الثابت:'
  show: 4
  options:
    a: $10,000
    b: $9,000
    c: $11,000
    d: $5,000
    e: $50,000
    f: $45,000
m4q6:
  text: 'الأصل غير الملموس ذو العمر غير المحدد:'
  show: 4
  options:
    a: يُستهلك على 40 سنة
    b: لا يُعترف به في الميزانية أبدًا
    c: يُختبر للهبوط سنويًا بدلًا من استهلاكه
    d: يُحمَّل مصروفًا فورًا
    e: يُستهلك على 20 سنة
    f: لا يُعرض كأصل
m4q7:
  text: أي مما يلي يدخل في تكلفة آلة تصنيع؟
  show: 4
  options:
    a: تكاليف الإصلاح بعد بدء الاستخدام
    b: عقد الصيانة السنوي
    c: تكاليف التركيب اللازمة لتشغيل الآلة
    d: فوائد قرض بعد بدء الاستخدام
    e: تكاليف تدريب الموظفين
    f: أقساط التأمين بعد بدء الاستخدام
m4q8:
  text: 'تنشأ الشهرة عند الاستحواذ على منشأة عندما:'
  show: 4
  options:
    a: يقل سعر الشراء عن القيمة العادلة لصافي الأصول
    b: يزيد سعر الشراء عن القيمة العادلة لصافي الأصول القابلة للتحديد
    c: يكون للشركة سمعة قوية
    d: تحقق الشركة أرباحًا فوق المتوسط داخليًا
    e: يكون للشركة عملاء أوفياء
    f: يزيد سعر السوق عن القيمة الدفترية
m4q9:
  text: أي مما يلي مثال على خسارة هبوط في قيمة أصل طويل الأجل؟
  show: 4
  options:
    a: تسجيل الإهلاك السنوي
    b: بيع الأصل بأقل من قيمته الدفترية
    c: تخفيض الأصل لأن قيمته الدفترية تزيد عن قيمته القابلة للاسترداد
    d: إعادة تقييم الأصل بالزيادة
    e: تسجيل استهلاك أصل غير ملموس
    f: تحميل تكلفة إصلاح كمصروف
m4q10:
  text: 'بطريقة FIFO وعند ارتفاع الأسعار، يكون مخزون آخر المدة:'
  show: 4
  options:
    a: أقل منه في LIFO
    b: مساويًا للمتوسط المرجح
    c: أعلى منه في LIFO
    d: مساويًا لـ LIFO
    e: أقل من المتوسط المرجح
    f: صفرًا
m5q1:
  text: أي مما يلي التزام متداول؟
  show: 4
  options:
    a: سندات لمدة 10 سنوات
    b: رهن عقاري مستحق بعد 15 سنة
    c: ذمم دائنة مستحقة خلال 30 يومًا
    d: التزام ضريبي مؤجل طويل الأجل
    e: التزام معاشات طويل الأجل
    f: التزام إيجار طويل الأجل
m5q2:
  text: 'وفق نموذج الخطوات الخمس، يُعترف بالإيراد عندما:'
  show: 4
  options:
    a: تُستلم النقدية من العميل
    b: يُوقَّع العقد
    c: يُوفى بالتزام الأداء
    d: تُرسل الفاتورة للعميل
    e: يطلب العميل البضاعة
    f: تُصنَّع البضاعة
m5q3:
  text: 'أصدرت شركة سندات بعلاوة (Premium). يعني ذلك أنها بيعت:'
  show: 4
  options:
    a: بقيمتها الاسمية
    b: بأقل من قيمتها الاسمية
    c: بأعلى من قيمتها الاسمية
    d: بسعر الكوبون
    e: بسعر الفائدة السوقي
    f: بأقل من القيمة الاسمية
m5q4:
  text: 'يُسجَّل مخصص الضمان لأن:'
  show: 4
  options:
    a: الشركة دفعت مطالبات الضمان بالفعل
    b: ذلك يقابل تكلفة الضمان المتوقعة بفترة البيع
    c: قانون الضرائب يتطلبه
    d: فترة الضمان انتهت
    e: العملاء طلبوا إصلاحات
    f: الإدارة لا تتوقع أي تكاليف ضمان
m5q5:
  text: أي مما يلي ليس من خطوات نموذج الاعتراف بالإيراد الخمس؟
  show: 4
  options:
    a: تحديد العقد مع العميل
    b: تحديد التزامات الأداء
    c: تحديد سعر المعاملة
    d: تحصيل النقدية من العميل
    e: توزيع السعر على التزامات الأداء
    f: الاعتراف بالإيراد عند الوفاء بكل التزام
m5q6:
  text: 'استلمت شركة نقدية مقدمًا عن اشتراك خدمة لمدة 12 شهرًا. تسجل في البداية:'
  show: 4
  options:
    a: إيرادًا فورًا
    b: أصلًا (إيراد مدفوع مقدمًا)
    c: التزامًا (إيراد مؤجل)
    d: مصروفًا
    e: حقوق ملكية
    f: لا شيء حتى تُقدَّم الخدمة
m5q7:
  text: 'إصدار الأسهم بعلاوة يعني:'
  show: 4
  options:
    a: بيعها بأقل من قيمتها الاسمية
    b: بيعها بأعلى من قيمتها الاسمية
    c: إصدارها مجانًا
    d: أن حقوق الملكية سالبة
    e: إعادة شراء الأسهم
