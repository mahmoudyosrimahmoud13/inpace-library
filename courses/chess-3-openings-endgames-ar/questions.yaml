q1:
  text: 'في الافتتاح الإيطالي، يستهدف فيل الأبيض على c4:'
  show: 4
  options:
    a: e5
    b: a8
    c: f7
    d: h7
q2:
  text: 'بعد 4. Ng5 d5 5. exd5 في دفاع الحصانين، أفضل نقلة للأسود:'
  show: 4
  options:
    a: 5... Na5
    b: 5... Nxd5
    c: 5... Ke7
    d: 5... Qxd5
q3:
  text: لماذا يلعب الأبيض h3 كثيرًا في الإيطالي؟
  show: 4
  options:
    a: لمهاجمة الوزير
    b: للتبييت الطويل
    c: لفتح العمود h للقلعة
    d: لمنع ...Bg4 من تثبيت الحصان
q4:
  text: 'بعد 1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Bxc6 dxc6 5. Nxe5، يلعب الأسود:'
  show: 4
  options:
    a: 5... Qe7
    b: 5... Qd4
    c: 5... f6
    d: 5... Bd6
q5:
  text: 'في فخ الفيل، تخسر 6. Nxd5? لأن:'
  show: 4
  options:
    a: كان جمودًا
    b: التثبيت على حصان f6 كان نسبيًا فقط
    c: الحصان كان مثبّتًا أمام الملك
    d: ملك الأبيض كان في كش
q6:
  text: 'جندي ليس على الأعمدة المجاورة له جنود من لونه:'
  show: 4
  options:
    a: متخلّف
    b: حر
    c: مزدوج
    d: معزول
q7:
  text: 'جندي ليس أمامه ولا على الأعمدة المجاورة جنود للخصم:'
  show: 4
  options:
    a: معلّق
    b: حر
    c: مزدوج
    d: معزول
q8:
  text: 'القلاع مكانها:'
  show: 4
  options:
    a: أمام جنودها
    b: خلف الجنود المغلقة
    c: الأعمدة المفتوحة
    d: الأركان
q9:
  text: 'جنودك على مربعات داكنة. فيلك للمربعات الداكنة:'
  show: 4
  options:
    a: قوي دائمًا
    b: لا يتأثر
    c: جيد
    d: سيئ
q10:
  text: 'أول سؤال في روتين وسط اللعبة:'
  show: 4
  options:
    a: إلى أين تشير جنودي؟
    b: هل هناك تكتيك؟
    c: أين أسوأ قطعة عندي؟
    d: كم الساعة؟
q11:
  text: 'المربعات المفتاحية لجندي أبيض على e4:'
  show: 4
  options:
    a: e5 وe6
    b: d8 وe8 وf8
    c: d6 وe6 وf6
    d: d5 وe5 وf5
q12:
  text: 'الأبيض: Ke5 وPe4. الأسود: Ke7. الدور على الأبيض. النتيجة باللعب الصحيح:'
  show: 4
  options:
    a: الأسود يفوز
    b: الأبيض يفوز
    c: تعتمد على الوقت
    d: تعادل
q13:
  text: 'ملك على f5 والدور على الأسود، وجندي أبيض على a4 وملك الأبيض بعيد. النقلة ...Ke5:'
  show: 4
  options:
    a: تعطي جمودًا
    b: غير قانونية
    c: بطيئة جدًا
    d: تلحق بالجندي
q14:
  text: 'في وضع لوسينا، اسم طريقة الفوز:'
  show: 4
  options:
    a: التسوغتسوانغ
    b: بناء الجسر
    c: قاعدة المربع
    d: دفاع فيليدور
q15:
  text: 'في نهايات القلاع، مكان القلعة:'
  show: 4
  options:
    a: أمام الجنود الحرة
    b: على الصف الأول دائمًا
    c: خلف الجنود الحرة
    d: بجوار ملكها
q16:
  text: 'عند تحويل التفوق في القطع، يجب أن تبادل:'
  show: 4
  options:
    a: القطع، لا الجنود
    b: الجنود، لا القطع
    c: لا شيء
    d: الوزراء بالقلاع فقط
q17:
  text: 'ملك وفيل للمربعات الفاتحة وجندي h ضد ملك في ركن h8 غالبًا:'
  show: 4
  options:
    a: خسارة
    b: فوز
    c: مات في نقلتين
    d: تعادل
q18:
  text: 'الأفيال تفضّل غالبًا:'
  show: 4
  options:
    a: الأوضاع المفتوحة والجنود على الجناحين
    b: النهاية فقط
    c: الوقوف أمام جنودها
    d: الأوضاع المغلقة المسدودة
q19:
  text: 'أسرع طريقة للتحسّن:'
  show: 4
  options:
    a: لعب البُلِت فقط
    b: حفظ خطوط افتتاح طويلة
    c: مشاهدة فيديوهات عشوائية
    d: تحليل مبارياتك
q20:
  text: 'عند تحليل مباراة، أولًا:'
  show: 4
  options:
    a: انظر للوضع الأخير فقط
    b: شغّل المحرك من النقلة 1
    c: تخطَّ المباريات الخاسرة
    d: راجعها وحدك بدون محرك
