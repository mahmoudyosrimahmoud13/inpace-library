id: data-engineering-advanced
title: 'Data engineering: building production pipelines'
version: 1
language: en
description: 'Build pipelines the way production teams do: Docker and Terraform, orchestration with Kestra, idempotent
  loads and backfills, data lake to BigQuery with partitioning and clustering, analytics engineering with dbt (staging,
  star schemas, tests, CI), Spark internals (shuffles, joins, skew) and streaming with Kafka. Built around DataTalksClub''s
  Data Engineering Zoomcamp, the most recommended free data engineering course on YouTube. For people who already
  know SQL and Python. About 3 weeks, 30 to 40 minutes a day.'
image: cover.jpg
