q1:
  text: 'حصان أسود على d4 يهاجمه جندي أبيض وحصان أبيض، ويحميه جندي أسود واحد. أفضل أكل للأبيض غالبًا:'
  show: 4
  options:
    a: بالوزير
    b: عدم الأكل
    c: بالجندي أولًا
    d: بالحصان أولًا
q2:
  text: '''LPDO'' تعني:'
  show: 4
  options:
    a: القطع الطويلة تسيطر على الافتتاح
    b: القطع السائبة تسقط
    c: آخر قطعة تحسم النتيجة
    d: اخسر الجنود ودافع عن الباقي
q3:
  text: 'الأبيض: Nd5. الأسود: Ke8 وRa8، وc7 فاضٍ. أي نقلة شوكة للملك والقلعة؟'
  show: 4
  options:
    a: Nb6
    b: Nf6+
    c: Nc7+
    d: Ne7
q4:
  text: 'جندي أبيض على e4 يتقدم إلى e5 فيهاجم حصانين أسودين على d6 وf6. هذه:'
  show: 4
  options:
    a: تثبيت
    b: هجوم مكشوف
    c: سيخ
    d: شوكة جندي
q5:
  text: 'عندما تكون متقدمًا في القطع، تبادل القطع غالبًا:'
  show: 4
  options:
    a: تعادل دائمًا
    b: ممنوع
    c: جيد
    d: سيئ
q6:
  text: 'القطعة المثبّتة أمام ملكها:'
  show: 4
  options:
    a: لا يجوز قانونيًا أن تخرج عن الخط
    b: تُؤكل فورًا
    c: تتحرك للخلف فقط
    d: تتحرك بحرية
q7:
  text: 'فيل أبيض على g5 يهاجم حصانًا أسود على f6، وخلفه الوزير الأسود على d8. هذا:'
  show: 4
  options:
    a: شوكة
    b: تثبيت مطلق
    c: سيخ
    d: تثبيت نسبي
q8:
  text: 'الأبيض: Ra1 وKg1. الأسود: Ke4 وQe8. الأبيض يلعب Re1+. هذا:'
  show: 4
  options:
    a: مات خانق
    b: شوكة
    c: سيخ
    d: تثبيت
q9:
  text: 'في الكش المزدوج، يجب على المدافع أن:'
  show: 4
  options:
    a: يحرّك الملك
    b: يسد أحد الكشّين
    c: يستسلم
    d: يأكل إحدى القطعتين
q10:
  text: 'فيلك يقف بين قلعتك ووزير الخصم على نفس العمود. تحريك الفيل مع كش:'
  show: 4
  options:
    a: تثبيت
    b: استدراج
    c: هجوم مكشوف
    d: إبعاد
q11:
  text: 'الجندي على d5 لا يحميه إلا حصان على f6 يستطيع فيلك أكله. هذه الفكرة اسمها:'
  show: 4
  options:
    a: التبييت
    b: إزالة المدافع
    c: السيخ
    d: الجمود
q12:
  text: 'الأبيض: Qd4 وRd1 وKg1. الأسود: Kg8 وRc8 وQb2 وجنود f7 g7 h7. الأبيض يلعب Qd8+. بعد Rxd8، يلعب الأبيض:'
  show: 4
  options:
    a: Qxd8
    b: h3
    c: Rxd8#
    d: Rd7
q13:
  text: 'حصان يعمل مات لملك محاصَر بقطعه هو. هذا:'
  show: 4
  options:
    a: مات العالِم
    b: مات الصف الخلفي
    c: المات العربي
    d: المات الخانق
q14:
  text: 'المات العربي يستخدم:'
  show: 4
  options:
    a: وزيرًا وملكًا
    b: قلعة وحصانًا
    c: فيلين
    d: حصانين
q15:
  text: 'نقلة هادئة مثل h3 تعطي ملكك مربع هروب اسمها:'
  show: 4
  options:
    a: التبييت
    b: التسوغتسوانغ
    c: فتح نَفَس للملك (luft)
    d: الفيانكيتو
q16:
  text: أي النقلات تنظر إليها أولًا؟
  show: 4
  options:
    a: نقلات الملك
    b: النقلات التي تبدو طبيعية
    c: نقلات جنود الحافة
    d: الكش والأكل والتهديد
q17:
  text: 'احسب الخط حتى:'
  show: 4
  options:
    a: تصل للنقلة 40
    b: يهدأ الوضع (لا كش ولا أكل)
    c: ينتهي وقتك
    d: ترى نقلة جيدة واحدة
q18:
  text: 'الأبيض: Kg1 وQd1 وجنود. الأسود: Ke8 وBb4 (غير محمي) وجنود، والقطر a4–e8 فاضٍ. أي نقلة تكسب الفيل؟'
  show: 4
  options:
    a: Qd8+
    b: Qb3
    c: Qa4+
    d: Qe2+
q19:
  text: 'الأبيض: Kg1 وجندي b7. الأسود: Kg7 وRa8. أفضل نقلة للأبيض:'
  show: 4
  options:
    a: b8=Q
    b: Kf2
    c: bxa8=Q
    d: Kg2
q20:
  text: 'روتين تكتيكات صحي:'
  show: 4
  options:
    a: 15 إلى 20 لغزًا يوميًا مع مراجعة الأخطاء
    b: 300 لغز مرة في الشهر
    c: بدون ألغاز، افتتاحات فقط
    d: مباريات بُلِت فقط
