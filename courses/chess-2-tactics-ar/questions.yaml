q1:
  text: 'حصان أسود على d4 يهاجمه جندي أبيض وحصان أبيض، ويحميه جندي أسود واحد. أفضل أكل للأبيض غالبًا:'
  show: 4
  options:
    a: بالوزير
    b: عدم الأكل
    c: بالجندي أولًا
    d: بالحصان أولًا
q2:
  text: '''LPDO'' تعني:'
  show: 4
  options:
    a: القطع الطويلة تسيطر على الافتتاح
    b: القطع السائبة تسقط
    c: آخر قطعة تحسم النتيجة
    d: اخسر الجنود ودافع عن الباقي
q3:
  text: 'الأبيض: الحصان على d5. الأسود: الملك على e8 والقلعة على a8، وc7 فاضٍ. أي نقلة شوكة للملك والقلعة؟'
  show: 4
  options:
    a: Nb6 (الحصان إلى b6)
    b: Nf6+ (الحصان إلى f6، كش)
    c: Nc7+ (الحصان إلى c7، كش)
    d: Ne7 (الحصان إلى e7)
q4:
  text: 'جندي أبيض على e4 يتقدم إلى e5 فيهاجم حصانين أسودين على d6 وf6. هذه:'
  show: 4
  options:
    a: تثبيت
    b: هجوم مكشوف
    c: سيخ
    d: شوكة جندي
q5:
  text: 'عندما تكون متقدمًا في القطع، تبادل القطع غالبًا:'
  show: 4
  options:
    a: تعادل دائمًا
    b: ممنوع
    c: جيد
    d: سيئ
q6:
  text: 'القطعة المثبّتة أمام ملكها:'
  show: 4
  options:
    a: لا يجوز قانونيًا أن تخرج عن الخط
    b: تُؤكل فورًا
    c: تتحرك للخلف فقط
    d: تتحرك بحرية
q7:
  text: 'فيل أبيض على g5 يهاجم حصانًا أسود على f6، وخلفه الوزير الأسود على d8. هذا:'
  show: 4
  options:
    a: شوكة
    b: تثبيت مطلق
    c: سيخ
    d: تثبيت نسبي
q8:
  text: 'الأبيض: القلعة على a1 والملك على g1. الأسود: الملك على e4 والوزير على e8. الأبيض يلعب Re1+ (القلعة إلى e1، كش). هذا:'
  show: 4
  options:
    a: مات خانق
    b: شوكة
    c: سيخ
    d: تثبيت
q9:
  text: 'في الكش المزدوج، يجب على المدافع أن:'
  show: 4
  options:
    a: يحرّك الملك
    b: يسد أحد الكشّين
    c: يستسلم
    d: يأكل إحدى القطعتين
q10:
  text: 'فيلك يقف بين قلعتك ووزير الخصم على نفس العمود. تحريك الفيل مع كش:'
  show: 4
  options:
    a: تثبيت
    b: استدراج
    c: هجوم مكشوف
    d: إبعاد
q11:
  text: 'الجندي على d5 لا يحميه إلا حصان على f6 يستطيع فيلك أكله. هذه الفكرة اسمها:'
  show: 4
  options:
    a: التبييت
    b: إزالة المدافع
    c: السيخ
    d: الجمود
q12:
  text: 'الأبيض: الوزير على d4 والقلعة على d1 والملك على g1. الأسود: الملك على g8 والقلعة على c8 والوزير على b2 وجنود f7 g7
    h7. الأبيض يلعب Qd8+ (الوزير إلى d8، كش). بعد Rxd8 (القلعة تأكل على d8)، يلعب الأبيض:'
  show: 4
  options:
    a: Qxd8 (الوزير يأكل على d8)
    b: h3
    c: Rxd8# (القلعة تأكل على d8، كش مات)
    d: Rd7 (القلعة إلى d7)
q13:
  text: 'حصان يعمل مات لملك محاصَر بقطعه هو. هذا:'
  show: 4
  options:
    a: مات العالِم
    b: مات الصف الخلفي
    c: المات العربي
    d: المات الخانق
q14:
  text: 'المات العربي يستخدم:'
  show: 4
  options:
    a: وزيرًا وملكًا
    b: قلعة وحصانًا
    c: فيلين
    d: حصانين
q15:
  text: 'نقلة هادئة مثل h3 تعطي ملكك مربع هروب اسمها:'
  show: 4
  options:
    a: التبييت
    b: التسوغتسوانغ
    c: فتح نَفَس للملك (luft)
    d: الفيانكيتو
q16:
  text: أي النقلات تنظر إليها أولًا؟
  show: 4
  options:
    a: نقلات الملك
    b: النقلات التي تبدو طبيعية
    c: نقلات جنود الحافة
    d: الكش والأكل والتهديد
q17:
  text: 'احسب الخط حتى:'
  show: 4
  options:
    a: تصل للنقلة 40
    b: يهدأ الوضع (لا كش ولا أكل)
    c: ينتهي وقتك
    d: ترى نقلة جيدة واحدة
q18:
  text: 'الأبيض: الملك على g1 والوزير على d1 وجنود. الأسود: الملك على e8 والفيل على b4 (غير محمي) وجنود، والقطر a4–e8 فاضٍ.
    أي نقلة تكسب الفيل؟'
  show: 4
  options:
    a: Qd8+ (الوزير إلى d8، كش)
    b: Qb3 (الوزير إلى b3)
    c: Qa4+ (الوزير إلى a4، كش)
    d: Qe2+ (الوزير إلى e2، كش)
q19:
  text: 'الأبيض: الملك على g1 وجندي b7. الأسود: الملك على g7 والقلعة على a8. أفضل نقلة للأبيض:'
  show: 4
  options:
    a: b8=Q (الجندي إلى b8 ويترقّى إلى الوزير)
    b: Kf2 (الملك إلى f2)
    c: bxa8=Q (الجندي يأكل على a8 ويترقّى إلى الوزير)
    d: Kg2 (الملك إلى g2)
q20:
  text: 'روتين تكتيكات صحي:'
  show: 4
  options:
    a: 15 إلى 20 لغزًا يوميًا مع مراجعة الأخطاء
    b: 300 لغز مرة في الشهر
    c: بدون ألغاز، افتتاحات فقط
    d: مباريات بُلِت فقط
