q39:
  text: The single most repeated advice across this series?
  show: 4
  options:
    a: 'Measure: evals, numbers, trade-offs'
    b: Show evidence, not adjectives
    c: Use the newest framework
    d: Memorise answers
    e: Apply everywhere with one CV
