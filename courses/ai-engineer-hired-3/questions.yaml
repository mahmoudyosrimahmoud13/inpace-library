q40:
  text: A resources lesson marked "optional" in inPace means...
  show: 4
  options:
    a: The module can finish without it
    b: Read it if it helps you
    c: It's not part of the course
    d: It will be removed
    e: It's a quiz
    f: It's locked
q41:
  text: Strong answers to theory questions also...
  show: 4
  options:
    a: Mention a trade-off or failure mode
    b: Tie the idea to something you built or measured
    c: Avoid examples
    d: Name as many frameworks as possible
    e: Stay under one sentence
    f: Repeat the question
q42:
  text: Time to first token is mostly set by...
  show: 4
  options:
    a: The prefill phase, which reads the whole prompt
    b: Prompt length, so long prompts make it slower
    c: The number of output tokens
    d: The temperature
    e: The tokenizer's vocabulary only
    f: Top-p
q43:
  text: To get the most from prompt caching...
  show: 4
  options:
    a: Put stable content like the system prompt and tools first
    b: Keep changing details like the time out of the prompt start
    c: Put the user's message first
    d: Randomise the order of tools
    e: Add a request id at the top
    f: Repeat the system prompt at the end only
q44:
  text: A reranker helps most when...
  show: 4
  options:
    a: The right chunk is retrieved but ranked too low
    b: You can afford a little extra latency for better top results
    c: The answer is in no document
    d: Text extraction is broken
    e: The index is empty
    f: You want to skip evaluation
q45:
  text: Long-term agent memory should be...
  show: 4
  options:
    a: Written deliberately and retrievable like RAG
    b: Visible and deletable by the user, within privacy rules
    c: Everything the user ever said, in every prompt
    d: Stored in the system prompt forever
    e: Hidden from the user
    f: Never used
q46:
