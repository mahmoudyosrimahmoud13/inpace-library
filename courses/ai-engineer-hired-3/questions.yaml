q56:
  text: Test-time compute means...
  show: 4
  options:
    a: Letting a model spend more tokens thinking at answer time
    b: Trading latency and cost for accuracy on hard questions
    c: Training for longer
    d: Testing on a smaller GPU
    e: Caching answers
