  text: Which CV bullet is strongest?
  show: 4
  options:
    a: Escalation recall 100% on 50 labelled tickets incl. 10 attacks
    b: Cut tokens per ticket 61% with no accuracy drop
    c: Built an AI agent with LangGraph
    d: Passionate about agents
    e: Used GPT for tickets
