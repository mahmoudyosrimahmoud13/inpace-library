  requires:
  - id: m4-practical
    type: practical
    prompt: 'تسجيل صوتي (45 ثانية): احكِ يومك من الاستيقاظ إلى النوم بالساعات، ثم قل 3 أشياء تستطيعها وشيئين يجب
      أن تفعلهما هذا الأسبوع.'
  - id: m4-explain
    type: explain
