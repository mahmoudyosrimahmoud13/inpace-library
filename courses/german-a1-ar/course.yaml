id: german-a1-ar
title: 'الألماني من الصفر: مستوى A1'
version: 2
language: ar
description: 'ألماني للمبتدئين تمامًا، بالشرح العربي وبطريقة مبنية على الأبحاث: استمع لمحادثة حقيقية أولًا، واحفظ العبارات
  التي يستخدمها الناس فعلًا، وقاعدة واحدة في كل وحدة، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة. التحية والعائلة ويومك والمدينة
  والأكل والتسوق والمواعيد، مع sein وhaben وترتيب الكلمات والأفعال المنفصلة وحالة المفعول وmöchten والأفعال المساعدة. وينتهي
  باختبار مستوى A1. حوالي أسبوعين، 45 دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'DW تعلّم الألمانية: دورات مجانية من A1 إلى B1، ومنها مسلسل Nicos Weg (وفيها واجهة عربية)'
  url: https://learngerman.dw.com/
- title: 'Easy German: مقابلات في الشارع مع ترجمة (YouTube)'
  url: https://www.youtube.com/@EasyGerman
- title: 'dict.cc: قاموس ألماني مع نطق صوتي'
  url: https://www.dict.cc/
modules:
- id: m1
  title: 'الوحدة 1: مرحبًا، أنا...'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: التعرّف على شخص جديد
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: sein وheißen، وdu وSie
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (30 ثانية): حيِّ المستمع، وقدّم نفسك (الاسم، البلد، المدينة، المهنة)، واسأل عن اسمه، وودّعه. ارفعه.'
  - id: m1-explain
    type: explain
    prompt: اكتب من 4 إلى 6 جمل بالألمانية تقدّم فيها نفسك.
    min_words: 20
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
