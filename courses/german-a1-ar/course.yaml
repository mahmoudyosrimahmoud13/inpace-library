    file: lessons/m4-l2.md
    minutes: 35
    media: https://www.youtube.com/watch?v=4-eDoThe6qo&t=3120&end=4140
  - id: m4-l3
    title: können، müssen، wollen، möchten
    file: lessons/m4-l3.md
