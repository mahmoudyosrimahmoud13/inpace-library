id: english-a2-ar
title: 'الإنجليزي A2: احكِ عن الماضي وتدبّر أمورك'
version: 2
language: ar
description: 'الإنجليزي مستوى A2 لمتحدثي العربية، بنفس طريقة A1 المبنية على الأبحاث: محادثة حقيقية أولًا، والعبارات التي يستخدمها
  الناس، وقاعدة واحدة في كل وحدة مع شرح الفروق عن العربية، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة. احكِ ما فعلته (الماضي
  البسيط المنتظم والشاذ)، واحكِ قصة بالماضي المستمر، وقارن واشترِ، وتكلّم مع الطبيب، وتكلّم عن تجاربك والمستقبل. وينتهي باختبار
  مستوى A2. حوالي أسبوعين، 45 دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'BBC Learning English: دروس وفيديوهات وبودكاست مجانية حسب المستوى'
  url: https://www.bbc.co.uk/learningenglish/
- title: 'VOA Learning English: أخبار وقصص بإنجليزية بطيئة وواضحة مع النص'
  url: https://learningenglish.voanews.com/
- title: 'Cambridge Dictionary: قاموس مع نطق بريطاني وأمريكي وترجمة عربية'
  url: https://dictionary.cambridge.org/
modules:
- id: m1
  title: 'الوحدة 1: عطلة نهاية الأسبوع الماضية'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: ماذا فعلت؟
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: 'الماضي البسيط: الأفعال المنتظمة وdid'
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): عطلة نهاية الأسبوع الماضية بستة أفعال ماضية على الأقل. ارفعه.'
  - id: m1-explain
    type: explain
    prompt: اكتب 5 جمل بالإنجليزية عمّا فعلته أمس.
    min_words: 30
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'الوحدة 2: رحلة'
  lessons:
  - id: m2-l1
    title: حكاية رحلة
    file: lessons/m2-l1.md
    minutes: 35
  - id: m2-l2
    title: 'الماضي البسيط: الأفعال الشاذة'
    file: lessons/m2-l2.md
    minutes: 40
  requires:
  - id: m2-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): حكاية رحلة. ارفعه.'
  - id: m2-explain
    type: explain
    prompt: اكتب 6 جمل بالإنجليزية عن رحلة، باستخدام أربعة أفعال شاذة على الأقل.
    min_words: 35
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'الوحدة 3: قصة'
  lessons:
  - id: m3-l1
    title: ماذا كنت تفعل عندما...؟
    file: lessons/m3-l1.md
    minutes: 35
  - id: m3-l2
    title: الماضي المستمر والماضي البسيط
    file: lessons/m3-l2.md
    minutes: 40
  requires:
  - id: m3-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): قصة بالمشهد والحدث والنهاية. ارفعه.'
  - id: m3-explain
    type: explain
    prompt: 'اكتب 6 جمل بالإنجليزية عن يوم أمس: ماذا كنت تفعل في أوقات مختلفة (at 8 o''clock I was...) وحدث واحد.'
    min_words: 35
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'الوحدة 4: التسوق'
  lessons:
  - id: m4-l1
    title: في محل ملابس
    file: lessons/m4-l1.md
    minutes: 35
  - id: m4-l2
    title: المقارنة والتفضيل
    file: lessons/m4-l2.md
    minutes: 40
  requires:
  - id: m4-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): محادثة في محل ومقارنة بين مدينتين. ارفعه.'
  - id: m4-explain
    type: explain
    prompt: اكتب 5 جمل بالإنجليزية تقارن فيها بين شيئين، مع -er وmore وthe best.
    min_words: 30
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m5
  title: 'الوحدة 5: عند الطبيب'
  lessons:
  - id: m5-l1
    title: لست بخير
    file: lessons/m5-l1.md
    minutes: 35
  - id: m5-l2
    title: should، وmust، وhave to
    file: lessons/m5-l2.md
    minutes: 40
  requires:
  - id: m5-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): الأعراض عند الطبيب، ثم نصائح صحية لصديق. ارفعه.'
  - id: m5-explain
    type: explain
    prompt: اكتب 5 قواعد بالإنجليزية لمكان عملك أو مدرستك، مع must وmustn't وhave to وdon't have to.
    min_words: 30
  - id: m5-quiz
    type: quiz
    questions:
    - q21
    - q22
    - q23
    - q24
    - q25
    pass: 70
- id: m6
  title: 'الوحدة 6: التجارب والمستقبل'
  lessons:
  - id: m6-l1
    title: هل سبق لك أن...؟
    file: lessons/m6-l1.md
    minutes: 35
  - id: m6-l2
    title: المضارع التام للتجارب، وwill
    file: lessons/m6-l2.md
    minutes: 40
  - id: m6-l3
    title: 'اختبار المستوى: هل أتقنت A2؟'
    file: lessons/m6-l3.md
    minutes: 40
  requires:
  - id: m6-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): حجز فندق، وتجاربك، وتوقع للمستقبل. ارفعه.'
  - id: m6-explain
    type: explain
    prompt: اكتب 6 جمل بالإنجليزية عن تجاربك (I've... / I've never...) وتوقعين بـ will.
    min_words: 35
  - id: m6-quiz
    type: quiz
    questions:
    - q26
    - q27
    - q28
    - q29
    - q30
    pass: 70
