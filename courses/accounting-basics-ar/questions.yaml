q1:
  text: 'المعادلة المحاسبية هي:'
  show: 4
  options:
    a: الأصول = الخصوم + حقوق الملكية
    b: الأصول + الخصوم = حقوق الملكية
    c: حقوق الملكية = الأصول + الخصوم
    d: الأصول = الخصوم − حقوق الملكية
q2:
  text: أيّ هذه التزام؟
  show: 4
  options:
    a: إيجار مدفوع مقدمًا
    b: فلوس لمورّد الدقيق
    c: النقدية في البنك
    d: فرن يملكه المشروع
q3:
  text: مشروع أصوله 50,000 وخصومه 18,000. كم حقوق الملكية؟
  show: 4
  options:
    a: 50,000
    b: 18,000
    c: 32,000
    d: 68,000
q4:
  text: المالكة تدفع فاتورة موبايلها الشخصي من جيبها. كيف تُسجَّل في المشروع؟
  show: 4
  options:
    a: كالتزام على المشروع
    b: كإيراد
    c: كمصروف على المشروع
    d: 'لا تُسجَّل: المشروع منفصل عن صاحبه'
q5:
  text: أيّ هذه يقلّل حقوق الملكية؟
  show: 4
  options:
    a: المالكة تضيف نقدية
    b: تحقيق إيراد
    c: المالكة تسحب نقدية لاستخدامها الشخصي
    d: الاقتراض من البنك
q6:
  text: كافيه يدفع 700 من الـ 1,200 التي عليه للمخبز. ماذا يحدث؟
  show: 4
  options:
    a: الموردون يقلّون 700
    b: النقدية تزيد 700 والإيرادات تزيد 700
    c: النقدية تزيد 700 والعملاء يقلّون 700
    d: الإيرادات تزيد 700
q7:
  text: 'المشروع يشتري فرنًا بـ 8,000 نقدًا. إجمالي الأصول:'
  show: 4
  options:
    a: يزيد 16,000
    b: يزيد 8,000
    c: لا يتغيّر
    d: يقل 8,000
q8:
  text: أيّ هذه ليس إيرادًا؟
  show: 4
  options:
    a: طلبية حفلة سُلِّمت بالآجل
    b: رسوم كورس طبخ
    c: قرض بنكي 5,000
    d: كيك مباع نقدًا
q9:
  text: 'إيجار 3 شهور دُفع مقدمًا. يوم الدفع يُسجَّل:'
  show: 4
  options:
    a: التزامًا
    b: أصلًا (إيجار مدفوع مقدمًا)
    c: مصروفًا بالمبلغ كله
    d: مسحوبات
q10:
  text: إيرادات 3,600، مصروفات 1,200، مسحوبات 500. كم الربح؟
  show: 4
  options:
    a: 2,400
    b: 1,900
    c: 4,300
    d: 3,100
q11:
  text: أيّ الحسابات تزيد بالمدين؟
  show: 4
  options:
    a: النقدية فقط
    b: الأصول والإيرادات
    c: الأصول والمصروفات والمسحوبات
    d: الخصوم والإيرادات ورأس المال
q12:
  text: 'المشروع يدفع لمورّد 1,000. القيد:'
  show: 4
  options:
    a: من حـ/ الموردين إلى حـ/ الإيرادات
    b: من حـ/ المصروفات إلى حـ/ النقدية
    c: من حـ/ الموردين إلى حـ/ النقدية
    d: من حـ/ النقدية إلى حـ/ الموردين
q13:
  text: ما الرصيد الطبيعي لإيراد المبيعات؟
  show: 4
  options:
    a: بلا رصيد
    b: مدين
    c: دائن
    d: يعتمد على الشهر
q14:
  text: 'عميل يدفع 400 مقدمًا لتورتة تُسلَّم الشهر القادم. الطرف الدائن:'
  show: 4
  options:
    a: إيرادات مقدمة
    b: إيراد المبيعات
    c: رأس المال
    d: العملاء
q15:
  text: 'في دليل الحسابات، حساب رقمه 5040 غالبًا:'
  show: 4
  options:
    a: التزام
    b: مصروف
    c: أصل
    d: إيراد
q16:
  text: في قيد اليومية، ماذا يُكتب أولًا؟
  show: 4
  options:
    a: الطرف المدين
    b: الطرف الدائن
    c: المبلغ الأكبر
    d: حساب النقدية
q17:
  text: 'نور تشتري عجّانة بـ 1,200، تدفع 400 الآن والباقي لاحقًا. القيد:'
  show: 4
  options:
    a: 'من حـ/ المعدات 1,200 إلى مذكورين: النقدية 400 والموردين 800'
    b: من حـ/ النقدية 1,200 إلى حـ/ المعدات 1,200
    c: من حـ/ المعدات 400 إلى حـ/ النقدية 400
    d: من حـ/ المعدات 1,200 إلى حـ/ النقدية 1,200
q18:
  text: 'نقل مبالغ اليومية إلى صفحات الحسابات اسمه:'
  show: 4
  options:
    a: الترحيل
    b: الإقفال
    c: التسوية
    d: المطابقة
q19:
  text: 'النقدية تبدأ بـ 9,400. بيع نقدي 800، دفع لمورّد 500، أجور 900. الرصيد:'
  show: 4
  options:
    a: 9,400
    b: 11,600
    c: 8,800
    d: 10,200
q20:
  text: 'سداد 1,000 من قرض ومعها 50 فائدة: أي جزء مصروف؟'
  show: 4
  options:
    a: الـ 1,050 كلها
    b: الـ 1,000 فقط
    c: الـ 50 فائدة فقط
    d: لا شيء
q21:
  text: 'ميزان المراجعة المتوازن يثبت أن:'
  show: 4
  options:
    a: المشروع حقق ربحًا
    b: إجمالي المدين يساوي إجمالي الدائن
    c: لا يوجد أي خطأ
    d: النقدية تطابق البنك
q22:
  text: أي خطأ لا يُخلّ بتوازن الميزان؟
  show: 4
  options:
    a: مبلغ مدين رُحِّل دائنًا
    b: مدين 540 رُحِّل 450 في طرف واحد
    c: إيجار سُجِّل كمصروف كهرباء
    d: رصيد سقط من القائمة
q23:
  text: 'الفرق بين الإجماليين 270، و270 ÷ 9 = 30. اشتبه في:'
  show: 4
  options:
    a: مبلغ في الجانب الخطأ
    b: 'لا شيء: سليم'
    c: تبديل رقمين أو انزلاق الفاصلة
    d: حساب ناقص
q24:
  text: 'قيد مرحَّل فيه خطأ. الصحيح أن:'
  show: 4
  options:
    a: تعمل قيد تصحيح
    b: تحذفه من البرنامج
    c: تمسحه وتعيد كتابته
    d: تتجاهله لو الميزان متوازن
q25:
  text: 'بيع نقدي 420 سُجِّل 240. قيد التصحيح:'
  show: 4
  options:
    a: من حـ/ النقدية 180 إلى حـ/ إيراد المبيعات 180
    b: من حـ/ النقدية 240 إلى حـ/ المبيعات 240
    c: من حـ/ إيراد المبيعات 180 إلى حـ/ النقدية 180
    d: من حـ/ النقدية 420 إلى حـ/ المبيعات 420
q26:
  text: 'بأساس الاستحقاق، يُسجَّل الإيراد عند:'
  show: 4
  options:
    a: قبض النقدية
    b: نهاية السنة
    c: تسليم البضاعة أو أداء الخدمة
    d: توقيع العقد
q27:
  text: 'مستلزمات مشتراة 1,500. الجرد آخر الشهر 600. قيد التسوية:'
  show: 4
  options:
    a: من حـ/ مصروف المستلزمات 1,500 إلى حـ/ النقدية 1,500
    b: من حـ/ مصروف المستلزمات 600 إلى حـ/ المستلزمات 600
    c: من حـ/ مصروف المستلزمات 900 إلى حـ/ المستلزمات 900
    d: من حـ/ المستلزمات 900 إلى حـ/ مصروف المستلزمات 900
q28:
  text: 'فرن تكلفته 8,000، عمره 60 شهرًا، قيمته التخريدية 800. الإهلاك الشهري بالقسط الثابت:'
  show: 4
  options:
    a: '133'
    b: '120'
    c: '160'
    d: '800'
q29:
  text: 'العمال استحقوا 150 آخر أيام الشهر، تُدفع الشهر القادم. القيد:'
  show: 4
  options:
    a: من حـ/ أجور مستحقة إلى حـ/ النقدية
    b: من حـ/ النقدية إلى حـ/ مصروف الأجور
    c: من حـ/ مصروف الأجور إلى حـ/ أجور مستحقة
    d: لا قيد حتى الدفع
q30:
  text: 'قيود التسوية لا تمسّ أبدًا:'
  show: 4
  options:
    a: النقدية
    b: المصروفات
    c: الإيرادات
    d: الخصوم
q31:
  text: أي قائمة تُعدّ أولًا؟
  show: 4
  options:
    a: ميزان المراجعة بعد الإقفال
    b: قائمة التغيّر في حقوق الملكية
    c: الميزانية
    d: قائمة الدخل
q32:
  text: 'الميزانية تؤرَّخ:'
  show: 4
  options:
    a: عن عمر المشروع
    b: عن شهر
    c: عن سنة
    d: في يوم واحد
q33:
  text: أي الحسابات تُقفل في نهاية الفترة؟
  show: 4
  options:
    a: النقدية ورأس المال
    b: الأصول والخصوم
    c: الإيرادات والمصروفات والمسحوبات
    d: كل الحسابات
q34:
  text: 'بعد الإقفال، ملخص الدخل رصيده دائن 430. هذا يعني:'
  show: 4
  options:
    a: ربحًا 430 يُقفل في رأس المال
    b: نقدية 430
    c: مسحوبات 430
    d: خسارة 430
q35:
  text: 'رأس المال 20,000، الربح 430، المسحوبات 500. رأس المال آخر المدة:'
  show: 4
  options:
    a: 20,430
    b: 19,500
    c: 19,930
    d: 20,930
q36:
  text: 'كريم يقبض 400 مقدمًا لعمل يتم الشهر القادم. في يوليو هي:'
  show: 4
  options:
    a: إيرادات مقدمة، أي التزام
    b: رأس مال
    c: عملاء
    d: إيراد يوليو
q37:
  text: 'عدّة بـ 3,600 تعيش 3 سنوات بلا قيمة تخريدية. إهلاك يوليو:'
  show: 4
  options:
    a: 3,600
    b: 1,200
    c: '100'
    d: '300'
q38:
  text: 'قطع غيار مشتراة 800، والباقي على الرف آخر الشهر 350. مصروف قطع الغيار:'
  show: 4
  options:
    a: 1,150
    b: '450'
    c: '350'
    d: '800'
q39:
  text: 'صافي ربح كريم في يوليو 780. لو اعتُبرت المسحوبات مصروفًا بالخطأ، سيظهر:'
  show: 4
  options:
    a: '480'
    b: 1,080
    c: '780'
    d: '300'
q40:
  text: 'ميزانية كريم إجماليها 11,330 والخصوم 850. حقوق ملكيته:'
  show: 4
  options:
    a: 11,330
    b: 10,480
    c: 10,000
    d: 12,180
