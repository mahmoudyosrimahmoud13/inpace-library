- id: m11
  title: ML coding from scratch
  lessons:
  - id: m11-l1
    title: NumPy you must be fluent in
    file: lessons/m11-l1.md
    minutes: 25
  - id: m11-l2
    title: Five implementations to know cold
    file: lessons/m11-l2.md
    minutes: 45
  - id: m11-l3
    title: AI-assisted coding rounds
    file: lessons/m11-l3.md
    minutes: 15
  requires:
  - id: m11-practical
    type: practical
    prompt: 'In one notebook or `.py` file, implement all five from memory (no notes, no AI), with a test for each:
      compare softmax and cross-entropy to a slow loop version, cosine top-k to a sorted brute force, logistic regression
      accuracy on a toy dataset (`sklearn.datasets.make_classification` is fine), k-means on 3 obvious blobs, and
      causal attention''s first row equal to V[0]. Upload it with the time each one took you.'
  - id: m11-explain
    type: explain
    prompt: 'Explain scaled dot-product attention to an interviewer: the shapes of Q, K and V, what each step computes,
      why the √d scaling, and what the causal mask does.'
    min_words: 100
  - id: m11-quiz
    type: quiz
    questions:
    - q41
    - q42
    - q43
    - q44
    pass: 70
