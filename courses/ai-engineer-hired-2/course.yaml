id: ai-engineer-hired-2
title: 'Get hired as an AI engineer 2: the coding interview intensive'
version: 1
language: en
description: 'Twelve weeks of deliberate practice for the coding rounds AI engineers face: the method interviewers
  score, Big-O and Python tools, every major LeetCode pattern with templates and about 130 graded problems, ML coding
  from scratch in NumPy, AI-assisted rounds, implementation rounds built in layers (project TinyKV), and mock interviews.
  Built on the Tech Interview Handbook, NeetCode and the AI Engineering Field Guide.'
image: cover.jpg
modules:
- id: m1
  title: How coding interviews work
  lessons:
  - id: m1-l1
    title: 'Start here: the intensive'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: How you're scored
    file: lessons/m1-l2.md
    minutes: 15
  - id: m1-l3
    title: 'The method: six steps, out loud'
    file: lessons/m1-l3.md
    minutes: 20
  - id: m1-l4
    title: Python toolkit and Big-O
    file: lessons/m1-l4.md
    minutes: 25
  requires:
  - id: m1-practical
    type: practical
    prompt: Set up your tracker spreadsheet with the columns from "Start here", then do 3 Easy problems with the
      six steps, out loud, recording your voice or screen (Two Sum, Valid Anagram, Contains Duplicate). Upload the
      tracker and one recording.
  - id: m1-explain
    type: explain
    prompt: Listen to your recording. Using the four rubric areas, grade yourself honestly and write what you'll
      do differently in the next problem.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    pass: 70
- id: m2
  title: Arrays, hashing and two pointers
  lessons:
  - id: m2-l1
    title: The patterns
    file: lessons/m2-l1.md
    minutes: 30
  - id: m2-l2
    title: 'Problem set: arrays, hashing, two pointers'
    file: lessons/m2-l2.md
    minutes: 150
  requires:
  - id: m2-practical
    type: practical
    prompt: 'Solve at least 8 problems from this module''s set, including at least one Medium you solved without
      help. Upload screenshots of the accepted submissions and your notes file: for each problem, the pattern, the
      key idea in one line, and the time and space complexity.'
  - id: m2-explain
    type: explain
    prompt: 'Interview answer, in writing: how would you solve *Longest Consecutive Sequence* in O(n)? Give the
      brute force first, then explain why your optimal solution is O(n) even though it has a loop inside a loop.'
    min_words: 80
  - id: m2-quiz
    type: quiz
    questions:
    - q5
    - q6
    - q7
    - q8
    pass: 70
- id: m3
