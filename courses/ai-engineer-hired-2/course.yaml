    title: 'Problem set: sliding window and stack'
    file: lessons/m3-l2.md
    minutes: 150
  requires:
  - id: m3-practical
    type: practical
    prompt: 'Solve at least 7 problems from this module''s set, including at least one Medium you solved without
      help. Upload screenshots of the accepted submissions and your notes file: for each problem, the pattern, the
      key idea in one line, and the time and space complexity.'
  - id: m3-explain
    type: explain
    prompt: 'Explain *Minimum Window Substring* as you would in an interview: the brute force, why a sliding window
      works, when you grow and when you shrink, and the final complexity.'
    min_words: 80
  - id: m3-quiz
    type: quiz
    questions:
