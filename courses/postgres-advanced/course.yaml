id: postgres-advanced
title: 'Advanced PostgreSQL: how Postgres really works'
version: 1
language: en
description: 'Go past basic SQL and learn how Postgres works inside: processes and memory, MVCC, the WAL, isolation
  levels, locks, vacuum and bloat, B-tree and other indexes, reading EXPLAIN plans, query patterns that scale, partitioning,
  replication and sharding. Built around Hussein Nasser''s Database Engineering videos, the go-to advanced database
  series on YouTube. For developers who already write SQL. About 2 weeks, 30 to 40 minutes a day.'
image: cover.jpg
