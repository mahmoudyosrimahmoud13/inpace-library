q1:
  text: أي الخطوات من خطوات العمل في الـ data science؟
  show: 4
  options:
    a: تنظيف البيانات
    b: حذف البيانات الأصلية
    c: إخفاء النتائج غير الواضحة
    d: القفز مباشرة إلى الـ model
    e: الاستكشاف بالجداول والرسوم
q2:
  text: في Colab، كيف تشغّل cell؟
  show: 4
  options:
    a: Ctrl+S
    b: Shift+Enter
    c: النقر مرتين على العنوان
    d: زر التشغيل بجوار الـ cell
    e: إغلاق التبويب
q3:
  text: لماذا نستخدم pandas؟
  show: 4
  options:
    a: لتشغيل المواقع
    b: لجداول البيانات
    c: للرسم فقط
    d: لتحميل البيانات وتنظيفها وتجميعها
    e: لإرسال البريد
q4:
  text: ماذا يعطي `[t for t in temps if t >= 30]`؟
  show: 4
  options:
    a: True أو False
    b: خطأ
    c: list بدرجات الحرارة من 30 فأعلى
    d: الأيام الحارة من temps
    e: عدد الأيام الحارة
q5:
  text: 'من عادات الـ notebook الجيدة:'
  show: 4
  options:
    a: عدم كتابة ملاحظات أبدًا
    b: تشغيل كل شيء من أعلى لأسفل قبل المشاركة
    c: أسماء variables من حرف واحد
    d: ترك البيانات الأصلية كما هي
    e: تعديل الملف الخام باليد
q6:
  text: ماذا يعرض `df.shape`؟
  show: 4
  options:
    a: أنواع الأعمدة
    b: (الصفوف، الأعمدة)
    c: حجم الجدول
    d: أول الصفوف
    e: متوسط كل عمود
q7:
  text: أيها يحتفظ فقط بالصفوف التي فيها quantity تساوي 3 أو أكثر؟
  show: 4
  options:
    a: df.head(3)
    b: df['quantity'] >= 3 وحدها
    c: df[df['quantity'] >= 3]
    d: df.quantity(3)
    e: df.loc[df['quantity'] >= 3]
q8:
  text: كيف تجد الصفوف المكررة تمامًا؟
  show: 4
  options:
    a: df.isna()
    b: قارن len(df) قبل drop_duplicates() وبعدها
    c: df.describe()
    d: df.duplicated().sum()
    e: df.unique()
q9:
  text: ما الذي يجعل 'MAADI' و'Maadi ' قيمة واحدة؟
  show: 4
  options:
    a: ترتيب العمود
    b: df['branch'].str.strip().str.title()
    c: حذف المسافات واستخدام نفس الحروف الكبيرة
    d: df.dropna()
    e: حذف العمود
q10:
  text: لماذا نستخدم describe() مبكرًا؟
  show: 4
  options:
    a: تبيّن القيم الناقصة من خلال الأعداد
    b: ترسم الرسوم
    c: تكشف القيم المستحيلة مثل أسعار الأخطاء الكتابية
    d: تنظّف البيانات
    e: تدرّب model
q11:
  text: أيها يعطي إجمالي الإيراد لكل فرع؟
  show: 4
  options:
    a: df.sort_values('branch')
    b: pd.pivot_table(df, index='branch', values='revenue', aggfunc='sum')
    c: df['branch'].sum()
    d: df.merge('branch')
    e: df.groupby('branch')['revenue'].sum()
q12:
  text: ماذا تفعل merge(other, on='branch')؟
  show: 4
  options:
    a: ترتب بالفرع
    b: تطابق صفوف جدولين بالفرع
    c: ترسم رسمًا
    d: تحذف الفروع
    e: تعمل مثل VLOOKUP أو JOIN في SQL
q13:
  text: أي رسم يبيّن التغير مع الوقت؟
  show: 4
  options:
    a: histogram للفروع
    b: خط بعلامات لكل شهر
    c: box plot للأصناف
    d: رسم دائري للشهور
    e: رسم خطي (line)
q14:
  text: أي الرسوم تقارن الفئات أو الانتشار جيدًا؟
  show: 4
  options:
    a: scatter لتسميات نصية
    b: رسم أعمدة مرتب للفئات
    c: رسم خطي لأسماء الأصناف
    d: رسم دائري ثلاثي الأبعاد
    e: box plot لمقارنة انتشار المجموعات
q15:
  text: 'من قواعد الرسوم الصادقة:'
  show: 4
  options:
    a: ألوان زاهية كثيرة
    b: الأعمدة تبدأ من الصفر
    c: المحاور لها أسماء ووحدات
    d: بدون عنوان
    e: قطع المحور للمبالغة
q16:
  text: متى يكون الوسيط قيمة 'نموذجية' أفضل من المتوسط؟
  show: 4
  options:
    a: عندما تسحب قيم متطرفة قليلة المتوسط
    b: دائمًا لكل البيانات
    c: عندما يكون للبيانات ذيل طويل مثل الدخول
    d: أبدًا
    e: للبيانات النصية فقط
q17:
  text: في البيانات الطبيعية، كم يقع تقريبًا في حدود 2 standard deviations من المتوسط؟
  show: 4
  options:
    a: حوالي 50%
    b: تقريبًا 19 قيمة من كل 20
    c: 100% بالضبط
    d: حوالي 68%
    e: حوالي 95%
q18:
  text: '‏correlation قيمته -0.6 معناه:'
  show: 4
  options:
    a: لا علاقة
    b: علاقة موجبة مثالية
    c: عندما يرتفع أحدهما يميل الآخر للانخفاض
    d: أحدهما يسبب الآخر
    e: علاقة سالبة قوية نسبيًا
q19:
  text: ماذا يبيّن الـ bootstrap؟
  show: 4
  options:
    a: القيمة الحقيقية بالضبط
    b: مدى مثل confidence interval بنسبة 95%
    c: كم قد تتغير النتيجة مع عينة مختلفة
    d: هل البيانات نظيفة
    e: أفضل رسم
q20:
  text: لماذا يستطيع اختبار A/B إثبات السبب؟
  show: 4
  options:
    a: لأنه يستخدم بيانات أكثر
    b: لأنه يستخدم الـ correlation
    c: لأن p-value صغيرة
    d: الفرق المنهجي الوحيد هو التغيير المختبر
    e: العملاء يُوزّعون على المجموعات عشوائيًا
q21:
  text: لماذا نقسم البيانات إلى training set وtest set؟
  show: 4
  options:
    a: لتسريع التدريب
    b: للحكم على الـ model ببيانات لم يتعلم منها
    c: لأن scikit-learn يتطلب ملفين
    d: لحذف الصفوف السيئة
    e: للتأكد أنه يعمل على أمثلة جديدة
q22:
  text: ما هو الـ baseline؟
  show: 4
  options:
    a: مثل التنبؤ بالمتوسط دائمًا
    b: رسم بياني
    c: تخمين بسيط يجب أن يتفوق عليه الـ model
    d: الـ test set
    e: أفضل model
q23:
  text: ماذا يقيس MAE؟
  show: 4
  options:
    a: متوسط حجم أخطاء التنبؤ
    b: نسبة التباين المفسَّر
    c: الخطأ بوحدات الهدف نفسها
    d: عدد الـ features
    e: زمن التدريب
q24:
  text: مع 18% طلبات مثلجة، لماذا accuracy قيمتها 82% غير مبهرة؟
  show: 4
  options:
    a: الـ accuracy لا تتجاوز 50%
    b: لأنها مقاسة على بيانات التدريب
    c: 82% مثالية
    d: قول 'ليس مثلجًا' دائمًا يحقق تقريبًا نفس النتيجة
    e: الـ accuracy تخفي أنه لم يلتقط أي طلب مثلج
q25:
  text: 'خفض الـ threshold في الـ classification عادة:'
  show: 4
  options:
    a: يخفض الـ precision
    b: يرفع الاثنين
    c: لا يغيّر شيئًا
    d: يحذف الـ model
    e: يرفع الـ recall
q26:
  text: ماذا يضمن الـ Pipeline؟
  show: 4
  options:
    a: نفس الخطوات تعمل على البيانات الجديدة
    b: التجهيز يُتعلم من بيانات التدريب فقط
    c: إنترنت أسرع
    d: لا حاجة لبيانات اختبار
    e: الـ model دقيق دائمًا
q27:
  text: لماذا نستخدم cross-validation؟
  show: 4
  options:
    a: يعطي متوسط النتيجة وانتشارها
    b: يسرّع التدريب
    c: يلغي الحاجة لـ baseline
    d: ينظّف البيانات
    e: تقسيم واحد قد يكون محظوظًا أو سيئ الحظ
q28:
  text: أيها علامات على الـ leakage؟
  show: 4
  options:
    a: نتيجة جيدة بشكل مريب
    b: feature لا تُعرف إلا بعد النتيجة
    c: test set صغيرة فقط
    d: استخدام الحرارة
    e: استخدام baseline
q29:
  text: للتنبؤ، كيف تقسم البيانات الزمنية؟
  show: 4
  options:
    a: تختبر على أيام التدريب
    b: تخلط كل الأيام عشوائيًا
    c: تستخدم عطلات نهاية الأسبوع فقط
    d: تختبر على المستقبل كما سيُستخدم الـ model
    e: تدرّب على تواريخ أقدم وتختبر على أحدث
q30:
  text: 'التقرير النهائي الجيد:'
  show: 4
  options:
    a: يستخدم أكبر قدر من المصطلحات
    b: يخفي عدم اليقين
    c: يعرض كل سطر كود
    d: يستخدم جملًا بسيطة وأرقامًا مقرّبة
    e: ينتهي بأفعال يستطيع المالك تنفيذها
