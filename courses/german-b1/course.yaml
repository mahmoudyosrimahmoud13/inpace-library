id: german-b1
title: 'German B1: opinions, Konjunktiv II and working life'
version: 1
language: en
description: 'German level B1, taught in English with the same research-based method: real conversations first, the phrases
  people use, one grammar point per unit, a voice note every unit, and review from memory. Give and defend opinions with connectors,
  talk about wishes and hypotheticals with the Konjunktiv II, describe people and things with relative clauses, explain processes
  with the passive, apply for a job and tell stories in the Präteritum, and state goals with um... zu and damit. Ends with
  a B1 level check. About 2 to 3 weeks at 45 minutes a day.'
image: cover.jpg
downloads:
- title: 'DW Learn German: free courses from A1 to B1, including the video series Nicos Weg'
  url: https://learngerman.dw.com/
- title: 'Easy German: street interviews with subtitles (YouTube)'
  url: https://www.youtube.com/@EasyGerman
- title: 'dict.cc: German dictionary with audio pronunciation'
  url: https://www.dict.cc/
modules:
- id: m1
  title: 'Unit 1: In my opinion'
  lessons:
  - id: m1-l1
    title: 'Start here: how this course works'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: Giving and defending an opinion
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: Connectors and word order
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'Voice note (2 minutes): an opinion with reasons, a counter-argument and a conclusion. Upload it.'
  - id: m1-explain
    type: explain
    prompt: Write about 80 words in German giving your opinion on a topic of your choice, with deshalb, trotzdem and obwohl.
    min_words: 70
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'Unit 2: If I could...'
  lessons:
  - id: m2-l1
    title: Dreams and polite requests
    file: lessons/m2-l1.md
    minutes: 35
  - id: m2-l2
    title: 'Konjunktiv II: wishes, hypotheses, politeness'
    file: lessons/m2-l2.md
    minutes: 40
  requires:
  - id: m2-practical
    type: practical
    prompt: 'Voice note (2 minutes): hypothetical questions and polite requests. Upload it.'
  - id: m2-explain
    type: explain
    prompt: Write about 70 words in German about your dream life, using würde, hätte, wäre and könnte.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'Unit 3: The person who...'
  lessons:
  - id: m3-l1
    title: Describing people and things
    file: lessons/m3-l1.md
    minutes: 35
  - id: m3-l2
    title: Relative clauses
    file: lessons/m3-l2.md
    minutes: 40
  requires:
  - id: m3-practical
    type: practical
    prompt: 'Voice note (90 seconds): people and things that matter to you, with relative clauses. Upload it.'
  - id: m3-explain
    type: explain
    prompt: Write 6 sentences in German, each with a relative clause, using at least one den, one dem and one preposition
      + relative pronoun.
    min_words: 40
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'Unit 4: How is it made?'
  lessons:
  - id: m4-l1
    title: Explaining a process
    file: lessons/m4-l1.md
    minutes: 35
  - id: m4-l2
    title: The passive
    file: lessons/m4-l2.md
    minutes: 40
  requires:
  - id: m4-practical
    type: practical
    prompt: 'Voice note (90 seconds): a process explained step by step in the passive. Upload it.'
  - id: m4-explain
    type: explain
    prompt: Write 6 sentences in German about how something is produced or done, in the passive (present and past).
    min_words: 40
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m5
  title: 'Unit 5: Work and applications'
  lessons:
  - id: m5-l1
    title: A job interview
    file: lessons/m5-l1.md
    minutes: 35
  - id: m5-l2
    title: The Präteritum, als and wenn, and formal letters
    file: lessons/m5-l2.md
    minutes: 40
  requires:
  - id: m5-practical
    type: practical
    prompt: 'Voice note (2 minutes): a job interview answer in formal German. Upload it.'
  - id: m5-explain
    type: explain
    prompt: Write about 100 words in German telling your life story in the Präteritum, with als at least twice.
    min_words: 80
  - id: m5-quiz
    type: quiz
    questions:
    - q21
    - q22
    - q23
    - q24
    - q25
    pass: 70
- id: m6
  title: 'Unit 6: Goals and plans'
  lessons:
  - id: m6-l1
    title: Why are you learning German?
    file: lessons/m6-l1.md
    minutes: 35
  - id: m6-l2
    title: um... zu, damit, and indirect questions
    file: lessons/m6-l2.md
    minutes: 40
  - id: m6-l3
    title: 'Level check: can you do B1?'
    file: lessons/m6-l3.md
    minutes: 40
  requires:
  - id: m6-practical
    type: practical
    prompt: 'Voice note (2 minutes): your goals with um... zu and damit, plus three indirect questions. Upload it.'
  - id: m6-explain
    type: explain
    prompt: Write about 80 words in German about your plans for the next two years, with um... zu, damit and Mein Ziel ist
      es, ... zu....
    min_words: 70
  - id: m6-quiz
    type: quiz
    questions:
    - q26
    - q27
    - q28
    - q29
    - q30
    pass: 70
