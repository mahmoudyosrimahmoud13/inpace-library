  show: 4
  options:
    a: ob
    b: um
    c: weil
    d: damit
q28:
  text: 'Indirect: «Wo ist der Bahnhof?» →'
  show: 4
  options:
    a: Wissen Sie, wo der Bahnhof ist?
    b: Wissen Sie, wo ist Bahnhof der?
    c: Wissen Sie, ob der Bahnhof ist wo?
    d: Wissen Sie, wo ist der Bahnhof?
q29:
  text: 'For an indirect yes/no question use:'
  show: 4
  options:
    a: ob
    b: dass
    c: wenn
    d: als
q30:
  text: 'Infinitive with zu of «anrufen»:'
  show: 4
  options:
    a: anzurufen
    b: angerufen
    c: anrufenzu
    d: zu anrufen
