  show: 4
  options:
    a: gegangen
    b: gehte
    c: ging
    d: gang
q22:
  text: 'Präteritum of «machen», ich:'
  show: 4
  options:
    a: gemacht
    b: machtete
    c: mach
    d: machte
q23:
  text: ___ ich 2020 nach Deutschland kam, ...
  show: 4
  options:
    a: Wenn
    b: Als
    c: Wann
    d: Ob
q24:
  text: Immer ___ ich Zeit hatte, las ich.
  show: 4
  options:
    a: ob
    b: als
    c: wann
    d: wenn
q25:
