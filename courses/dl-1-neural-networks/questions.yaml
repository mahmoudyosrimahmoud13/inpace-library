q11:
  text: What does PyTorch's autograd do?
  show: 4
  options:
    o4445d6: Records the operations as the code runs.
    o963115: Only works for one layer.
    o05940b: Computes gradients by walking the graph backwards.
    ob17de5: Writes the model for you.
    o2e2e97: Picks the learning rate.
    o656b86: Avoids the chain rule.
q12:
  text: Why average gradients over m examples before a step?
  show: 4
  options:
    o19e92c: Because PyTorch can't sum.
    o744cf2: To shuffle the data.
    ob6b3de: One step then follows the whole training set.
    of17482: The cost is the average loss, so its gradient is the average gradient.
    o04035d: To skip the backward pass.
    o233f92: To make the learning rate smaller.
