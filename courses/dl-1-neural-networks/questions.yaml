  options:
    o935602: Step functions, for clean outputs.
    oe7bd2b: No activation, to save time.
    oa369ee: A linear activation in all layers.
    o5a9045: Sigmoid in every hidden layer of a deep network.
    oa30584: ReLU (or GELU) in hidden layers.
    o210b4c: Sigmoid only at the output of a binary classifier.
