q7:
  text: Why use cross-entropy instead of squared error for logistic regression?
  show: 4
  options:
    oee0f69: It makes the cost convex.
    o5c45a6: It works without labels.
    o03ae24: It punishes confident mistakes strongly.
    oecd74c: It's faster to type.
    oe39fb7: It forces ŷ to be exactly 0 or 1.
    ob32438: It removes the need for a learning rate.
q8:
  text: Which are modern, numerically stable ways to compute this loss?
  show: 4
  options:
    o37a49d: Squared error on rounded predictions
    ob0bfb4: Accuracy as the loss
    o3e364e: Taking np.log of a sigmoid output that may be exactly 0
    o58b81e: keras.losses.BinaryCrossentropy(from_logits=True)
    of1fabc: Mean of the labels
    o5d5c16: torch.nn.BCEWithLogitsLoss on raw scores
q9:
