    od8fb79: Linear layers can't be differentiated.
    o95522f: Otherwise the network can only make linear boundaries.
    oe9a302: Non-linear layers train without data.
    o3d4ad4: It reduces memory.
    o1083db: Otherwise stacked layers equal one linear layer.
