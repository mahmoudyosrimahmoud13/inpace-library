  text: What is row explosion?
  show: 4
  options:
    a: Many-to-many matches in a join multiply rows
    b: It can happen with repeated join keys
    c: The database raises an error
    d: A table runs out of disk space
    e: A query returns zero rows
    f: Partitions are too small
