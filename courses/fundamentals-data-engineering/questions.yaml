  text: What is reverse ETL?
  show: 4
  options:
    a: Serving data by loading it from an OLAP system back into a source system
    b: Putting results where people work, such as a CRM
    c: Undoing an ETL job
    d: Extracting data from a warehouse to delete it
    e: Running ETL backwards in time
    f: Loading raw data into a lake
