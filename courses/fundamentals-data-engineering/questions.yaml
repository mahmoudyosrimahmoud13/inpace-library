  text: What is a watermark in stream processing?
  show: 4
  options:
    a: A threshold a window uses to decide whether data is in time or late
    b: A way to close a window while allowing for some late data
    c: A copyright mark on data
    d: The newest file in a lake
    e: A database index
    f: A backup
