q1:
  text: How do the authors define data engineering?
  show: 4
  options:
    a: Building and running systems that take in raw data and produce high-quality, consistent information for downstream
      uses
    b: Training machine learning models on large datasets
    c: Designing dashboards for business users
    d: Administering a single relational database
    e: Any work that involves writing SQL
    f: Collecting data from websites by scraping
q2:
  text: What are the three stages of the book's data maturity model?
  show: 4
  options:
    a: Starting with data
    b: Scaling with data
    c: Leading with data
    d: Mining data
    e: Monetizing data
    f: Archiving data
q3:
  text: Which describe a Type A data engineer?
  show: 4
  options:
    a: A stands for abstraction
    b: Prefers off-the-shelf products and managed services
    c: Avoids undifferentiated heavy lifting
    d: A stands for analytics
    e: Builds custom data tools as their main job
    f: Works only at companies leading with data
q4:
  text: Which does the book name as the primary languages of data engineering?
  show: 4
  options:
    a: SQL
    b: Python
    c: bash
    d: A JVM language such as Java or Scala
    e: PHP
    f: Visual Basic
    g: COBOL
    h: Assembly
q5:
  text: A company is 'starting with data'. Which are good first moves for its data engineer?
  show: 4
  options:
    a: Find quick wins that show the value of data
    b: Talk to people across the business
    c: Build a custom distributed platform before any use case exists
    d: Prefer simple, managed tools
    e: Copy the architecture of a giant tech company
    f: Wait until the company is bigger before delivering anything
