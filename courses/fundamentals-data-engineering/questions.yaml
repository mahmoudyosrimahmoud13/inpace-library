  text: Which are the five stages of the data engineering lifecycle?
  show: 4
  options:
    a: Generation
    b: Storage
    c: Ingestion
    d: Transformation
    e: Serving
    f: Monetization
    g: Archiving
    h: Deletion
q7:
  text: Which are undercurrents of the lifecycle?
  show: 4
  options:
    a: Security
    b: DataOps
    c: Orchestration
    d: Data management
    e: Marketing
    f: Hardware procurement
    g: Accounting
    h: Hiring
q8:
  text: What are the three pillars of DataOps in the book?
  show: 4
  options:
    a: Automation
    b: Monitoring and observability
    c: Incident response
    d: Encryption
    e: Data modeling
    f: Vendor management
q9:
  text: What is the book's advice on batch versus streaming ingestion?
  show: 4
  options:
    a: Adopt real-time streaming only after finding a business use case that justifies its costs
    b: Batch is fine for many common uses, such as model training and weekly reporting
    c: Always stream, because batch is obsolete
    d: Never use streaming
    e: Streaming is always cheaper than batch
    f: Choose whichever tool is newest
q10:
  text: In project 2, why does running the pipeline twice not double the revenue?
  show: 4
  options:
    a: Ingestion copies each file under the same name, so a second copy replaces the first
    b: The step is idempotent
    c: DuckDB automatically removes duplicate rows
    d: The second run is skipped by the operating system
    e: Revenue is rounded
    f: The quality check deletes the second copy
q11:
  text: Which words are central to the book's definition of data architecture?
  show: 4
  options:
    a: Evolving data needs
    b: Flexible and reversible decisions
    c: Careful evaluation of trade-offs
    d: A fixed five-year plan
    e: One vendor for everything
    f: Maximum normalization
q12:
  text: What does recovery point objective (RPO) mean?
  show: 4
  options:
    a: The maximum acceptable amount of data loss after an outage
    b: The longest acceptable outage
    c: The share of time a system is up
    d: The chance a system works correctly
    e: The cost of recovering a system
    f: The number of backups kept
q13:
  text: What is a 'two-way door' decision?
  show: 4
  options:
    a: A decision you can reverse if you don't like the result
    b: A decision to prefer when possible
    c: A decision that can never be undone
    d: A decision that needs two approvals
    e: A decision about network ports
    f: A decision to use two vendors
q14:
  text: Which are among Zhamak Dehghani's four key components of the data mesh?
  show: 4
  options:
    a: Domain-oriented decentralized data ownership
    b: Data as a product
    c: Self-serve data infrastructure as a platform
    d: Federated computational governance
    e: One central data team owns all data
    f: A single monolithic warehouse
    g: A single central warehouse team approving every change
    h: Banning data products
q15:
  text: In project 3, what does the loosely coupled design need that the tight one didn't?
  show: 4
  options:
    a: A queue between the shop and the email service
    b: A consumer that skips events it already handled
    c: Retries when the email service fails
    d: Orders that wait for the email to be sent
    e: A faster email server
    f: Fewer orders
q16:
  text: What is total opportunity cost of ownership (TOCO)?
  show: 4
  options:
    a: The cost of the opportunities you give up by choosing a technology, architecture or process
    b: The cloud bill for one month
    c: The price of the hardware
    d: The cost of training staff only
    e: The tax on software licences
    f: The cost of data egress
q17:
  text: Which are examples of immutable technologies in the book's sense?
  show: 4
  options:
    a: Object storage
    b: SQL
    c: bash
    d: Networking
    e: This year's most hyped orchestration tool
    f: A brand-new startup's proprietary query engine
    g: A dashboard tool released last month
    h: A vendor's beta feature
q18:
  text: How often do the authors suggest re-evaluating your technology choices?
  show: 4
  options:
    a: About every two years
    b: Every month
    c: Never, once chosen
    d: Every ten years
    e: Only when a tool fails
    f: Whenever a vendor offers a discount
q19:
  text: In project 4, why did the own server stop looking cheapest once people were counted?
  show: 4
  options:
    a: It needed far more engineer hours to keep running
    b: Indirect costs were most of its total
    c: Its electricity was free
    d: It had no egress costs, which made it more expensive
    e: Servers always cost more than the cloud
    f: Its upfront cost was zero
q20:
  text: What does Appendix B say about cloud data egress?
  show: 4
  options:
    a: Clouds charge for data leaving them
    b: Egress charges can apply between zones and regions too
    c: Getting data into the cloud is usually cheap or free
    d: Egress is always free
    e: Only on-premises systems have egress fees
    f: Egress fees only apply to databases
q21:
  text: Which are the types of time the book describes for events?
  show: 4
  options:
    a: Event time
    b: Ingestion time
    c: Process time
    d: Processing time
    e: Billing time
    f: Compile time
    g: Retention time
    h: Response time
q22:
  text: What is the difference between a message queue and a stream, as the book describes them?
  show: 4
  options:
    a: A message is removed from the queue once it's delivered
    b: A stream is an append-only log of events
    c: Streams keep records for a long time and can be replayed
    d: Queues keep every message forever
    e: Streams can only hold one event
    f: There is no difference
q23:
  text: What are the costs of the insert-only pattern?
  show: 4
  options:
    a: Tables can grow large
    b: Finding the current state of a record takes extra work
    c: History is lost on every update
    d: Records can't be read at all
    e: It needs streaming
    f: It can't store timestamps
q24:
  text: Inkwell's orders table is CRUD. What can it NOT tell you on its own?
  show: 4
  options:
    a: When an order moved from placed to shipped
    b: How long orders take to ship
    c: Each order's current status
    d: How many orders exist
    e: Which customer placed an order
    f: The order's creation time
q25:
  text: What is a data contract, according to the definition the book quotes?
  show: 4
  options:
    a: A written agreement between a source system's owner and the team ingesting its data
    b: It covers what data is extracted, how, how often, and who to contact
    c: A software licence
    d: A law about personal data
    e: A cloud provider's price list
    f: An agreement between two analysts
q26:
  text: Why do columnar formats like Parquet suit analytics?
  show: 4
  options:
    a: A query can read only the columns it needs
    b: Similar values sit together, so they compress well
    c: They store the schema with types
    d: They are plain text you can edit by hand
    e: They make single-row updates cheapest
    f: They repeat column names on every row
q27:
  text: What does BASE stand for?
  show: 4
  options:
    a: Basically available
    b: Soft-state
    c: Eventual consistency
    d: Atomic
    e: Strongly isolated
    f: Durable
q28:
  text: Which describe object storage?
  show: 4
  options:
    a: Examples include Amazon S3 and Google Cloud Storage
    b: Objects can't be changed in place
    c: It's the usual home of data lakes
    d: It's the fastest storage for a database's random writes
    e: You can edit one byte of an object directly
    f: It's only available on premises
q29:
  text: In project 6, what did the measurements show?
  show: 4
  options:
    a: JSON lines was the largest format
    b: Parquet was several times smaller than CSV
    c: Querying Parquet was much faster than CSV
    d: gzip wrote noticeably slower than snappy
    e: CSV was the smallest
    f: All formats took the same time
    g: Single-threaded
    h: Append-never
q30:
  text: What does 'separation of compute from storage' allow?
  show: 4
  options:
    a: Paying for compute only while it runs
    b: Scaling storage and compute independently
    c: Several engines reading the same data
    d: Storing data inside the query engine's memory only
    e: Never paying for storage
    f: Removing the need for any file format
q31:
  text: What does the authors' mantra 'all data is unbounded until it's bounded' mean?
  show: 4
  options:
    a: Data happens continuously in reality
    b: Batches are boundaries we choose, such as a day
    c: All data must be streamed
    d: Data can never be stored
    e: Bounded data is always wrong
    f: Batches are a convenience for processing
q32:
  text: Why should an ingestion job save its watermark only after the data is written?
  show: 4
  options:
    a: A crash in between means re-reading data, not skipping it
    b: Duplicates are easier to fix than gaps
    c: It makes the job faster
    d: The database requires it
    e: So the watermark can move backwards
    f: It isn't important when it's saved
q33:
  text: What does the book call querying a table for rows whose updated_at is after the last run?
  show: 4
  options:
    a: Batch-oriented CDC
    b: Continuous CDC
    c: A full snapshot
    d: Reverse ETL
    e: A dead-letter queue
    f: Query federation
q34:
  text: What should happen to an event that can't be parsed?
  show: 4
  options:
    a: It goes to a dead-letter queue or file
    b: Someone can inspect and fix it later
    c: The whole pipeline stops forever
    d: It's silently dropped
    e: It's loaded into the lake as is
    f: It's corrected by guessing
q35:
  text: Which are true of ETL and ELT?
  show: 4
  options:
    a: ELT loads raw data first and transforms it inside the warehouse or lake
    b: ETL transforms data before loading it
    c: Inkwell's pipeline is ELT
    d: ELT can't keep raw data
    e: ETL means 'extract, transfer, log'
    f: They are the same thing
q36:
  text: Which are tips from the book for improving query performance?
  show: 4
  options:
    a: Use the explain plan
    b: Avoid full table scans
    c: Leverage cached query results
    d: Vacuum dead records
    e: Always use SELECT *
    f: Add more joins to every query
    g: Delete every index
    h: Run each query twice
