id: fundamentals-data-engineering
title: 'Fundamentals of Data Engineering: build a data platform, chapter by chapter'
version: 1
language: en
description: 'The whole data engineering lifecycle, following Fundamentals of Data Engineering by Joe Reis and Matt Housley
  chapter by chapter, and built as one project: the data platform of a small online bookshop. Source systems and change data
  capture, storage formats and a partitioned data lake, re-runnable ingestion with watermarks and dead letters, query plans,
  a Kimball star schema with type 2 history, a tested SQL pipeline with write-audit-publish, a metrics layer, a dashboard,
  ML features and reverse ETL, privacy controls, tested backups and an orchestrated nightly run, then a capstone you publish
  on GitHub. Each Read lesson opens the right pages of your own copy of the book; every project runs on a laptop with Python
  and DuckDB, and every output shown was produced by the real code. For people who know basic SQL and Python. Plan: 13 days,
  about 2 hours a day.'
image: cover.jpg
book: fode.pdf
book_info:
  title: Fundamentals of Data Engineering
  url: https://www.oreilly.com/library/view/fundamentals-of-data/9781098108298/
  pages: 446
downloads:
- title: Fundamentals of Data Engineering (O'Reilly, the publisher's page)
  url: https://www.oreilly.com/library/view/fundamentals-of-data/9781098108298/
- title: DuckDB documentation
  url: https://duckdb.org/docs/
