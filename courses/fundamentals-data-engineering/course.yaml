    type: practical
    prompt: 'Do project 1: set up your `inkwell` folder, run `p01_setup_check.py`, and start the git repository with a `.gitignore`
      for `inkwell_data/`. Then write half a page on a company you know: its data maturity stage, one thing a data engineer
      there should do first, and one to avoid. Hand in a screenshot of the check and your half page.'
  - id: m1-explain
    type: explain
    prompt: Explain the difference between a Type A and a Type B data engineer, and which one a small company starting with
