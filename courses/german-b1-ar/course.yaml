id: german-b1-ar
title: 'الألماني B1: الرأي وKonjunktiv II وحياة العمل'
version: 2
language: ar
description: 'الألماني مستوى B1، بالشرح العربي وبنفس الطريقة المبنية على الأبحاث: محادثات حقيقية أولًا، والعبارات التي يستخدمها
  الناس، وقاعدة واحدة في كل وحدة، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة. عبّر عن رأيك ودافع عنه بأدوات الربط، وتكلّم
  عن الأمنيات والافتراضات بـ Konjunktiv II، وصِف الناس والأشياء بالجمل الموصولة، واشرح العمليات بالمبني للمجهول، وتقدّم لوظيفة
  واحكِ القصص بالـ Präteritum، وعبّر عن الأهداف بـ um... zu وdamit. وينتهي باختبار مستوى B1. حوالي أسبوعين إلى 3 أسابيع، 45
  دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'DW تعلّم الألمانية: دورات مجانية من A1 إلى B1، ومنها مسلسل Nicos Weg (وفيها واجهة عربية)'
  url: https://learngerman.dw.com/
- title: 'Easy German: مقابلات في الشارع مع ترجمة (YouTube)'
  url: https://www.youtube.com/@EasyGerman
- title: 'dict.cc: قاموس ألماني مع نطق صوتي'
  url: https://www.dict.cc/
modules:
- id: m1
  title: 'الوحدة 1: في رأيي'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: إبداء الرأي والدفاع عنه
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: أدوات الربط وترتيب الكلمات
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (دقيقتان): رأي مع أسباب، وحجة مضادة، وخلاصة. ارفعه.'
  - id: m1-explain
    type: explain
    prompt: اكتب حوالي 80 كلمة بالألمانية تعبّر فيها عن رأيك في موضوع تختاره، باستخدام deshalb وtrotzdem وobwohl.
    min_words: 70
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
