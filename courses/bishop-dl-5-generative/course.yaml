id: bishop-dl-5-generative
title: 'Deep Learning (Bishop) 5: GANs, normalizing flows, VAEs and diffusion models'
version: 1
language: en
description: 'Part 5 of 5, following Deep Learning: Foundations and Concepts by Christopher M. Bishop and Hugh Bishop (Springer,
  2024), chapters 17 to 20: the four families of deep generative models. Generative adversarial networks and mode collapse,
  normalizing flows and coupling layers, autoencoders and variational autoencoders, diffusion models, score matching and classifier-free
  guidance. Each Read lesson opens the right pages of your own copy of the book (the Springer PDF, or read free online at
  bishopbook.com). Every module ends with a real PyTorch project for your CV, with a notebook: a GAN that draws clothes, real
  NVP from scratch, a VAE on digits, a diffusion model that draws digits, and guided generation. Plan: 7 days.'
image: cover.jpg
book: bishop.pdf
book_info:
  title: 'Deep Learning: Foundations and Concepts'
  url: https://www.bishopbook.com
  pages: 656
modules:
- id: m1
  title: 'Day 1: Generative adversarial networks'
  lessons:
  - id: m1-l1
    title: Start here
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: 'Read: generative adversarial networks (chapter 17)'
    file: lessons/m1-l2.md
    minutes: 55
    media: bishop.pdf#pages=546-558
  - id: m1-l3
    title: 'Build: a GAN in one dimension, and mode collapse'
    file: lessons/m1-l3.md
    minutes: 35
  - id: m1-l4
    title: 'Watch: Generative adversarial networks (Computerphile)'
    file: lessons/m1-l4.md
    minutes: 21
    media: https://www.youtube.com/watch?v=Sw9r8CL98N0
  - id: m1-l5
    title: 'Module project: build a GAN that draws clothes'
    file: lessons/m1-l5.md
    minutes: 120
    media: project-1-fashion-gan.ipynb
  requires:
  - id: m1-practical
    type: practical
    prompt: Build the module project yourself and push it to your own GitHub repository, with a README that has a results
      table. Then do at least one idea from Make it yours and add its result to the README. Hand in the link to your repository.
    optional: true
  - id: m1-explain
    type: explain
    prompt: Explain, in your own words, why a GAN can't be trained by maximum likelihood, and what the discriminator gives
      the generator instead.
    min_words: 60
    optional: true
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
