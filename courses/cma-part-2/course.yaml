  - id: m5-l1
    title: 'Section B: working capital management'
    file: lessons/m5-l1.md
    minutes: 60
  - id: m5-l2
    title: 'Section B: short-term financing, raising capital and dividends'
    file: lessons/m5-l2.md
    minutes: 60
  - id: m5-l3
    title: 'Section B: international finance'
    file: lessons/m5-l3.md
    minutes: 50
  requires:
  - id: m5-practical
    type: practical
    prompt: 'In Excel: an EOQ and reorder point calculator, a credit policy change analysis, the cost of skipping a trade
      discount, effective rates with compensating balances, and a forward hedge for a foreign currency payable. Use your own
      numbers and upload the file.'
  - id: m5-explain
    type: explain
    prompt: Explain the three kinds of exchange rate risk with one example each, and which one a forward contract hedges.
    min_words: 60
  - id: m5-quiz
    type: quiz
    questions:
    - q25
    - q26
    - q27
    - q28
    - q29
    - q30
    pass: 70
- id: m6
  title: 'Module 6: Section C, CVP and marginal analysis'
  lessons:
  - id: m6-l1
    title: 'Section C: CVP analysis at exam depth'
    file: lessons/m6-l1.md
    minutes: 60
  - id: m6-l2
    title: 'Section C: marginal analysis and short-term decisions'
    file: lessons/m6-l2.md
    minutes: 60
  requires:
  - id: m6-practical
    type: practical
    prompt: Build a multi-product CVP model in Excel with a sales mix input, then a decision sheet that handles a special
