id: cma-part-2
title: 'CMA Part 2: Strategic Financial Management, step by step'
version: 1
language: en
description: 'Complete preparation for CMA Part 2 (the 2026 exam with case-based questions), in plain words with worked examples
  and an exam-style quiz after every module: time value of money; Section A financial statement analysis (ratios, DuPont,
  EPS, earnings quality); Section B corporate finance (CAPM, bond and stock valuation, WACC, capital structure, working capital,
  financing, dividends, international finance); Section C decision analysis (CVP, marginal analysis, pricing, uncertainty);
  Section D risk management (ERM, hedging); Section E investment decisions (cash flows, NPV, IRR, payback, real options);
  Section F professional ethics (the IMA Statement, fraud, governance); and a formula sheet with exam strategy. Follows CMA
  Part 1 in the library. About 10 weeks, 12 to 15 hours a week.'
image: cover.jpg
downloads:
- title: 'IMA: the CMA exam and its content specification outlines'
  url: https://www.imanet.org/cma-certification
modules:
- id: m1
  title: 'Module 1: The exam and time value of money'
  lessons:
  - id: m1-l1
    title: 'Start here: CMA Part 2 and how to pass it'
    file: lessons/m1-l1.md
    minutes: 30
  - id: m1-l2
    title: 'Time value of money: the tool behind Part 2'
    file: lessons/m1-l2.md
    minutes: 60
  requires:
  - id: m1-practical
    type: practical
    prompt: Make a one-page study plan for your exam window, then build an Excel sheet that computes PV, FV, annuity payments,
      NPV and IRR for three examples of your own, checking each against the formulas by hand. Upload both.
  - id: m1-explain
    type: explain
    prompt: Explain, with numbers, why 10,000 received in three years is worth less than 10,000 today.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    - q6
    pass: 70
- id: m2
  title: 'Module 2: Section A, ratios'
  lessons:
  - id: m2-l1
    title: 'Section A: ratios for liquidity, leverage and activity'
    file: lessons/m2-l1.md
    minutes: 60
  - id: m2-l2
    title: 'Section A: profitability, DuPont and market ratios'
    file: lessons/m2-l2.md
    minutes: 60
  requires:
  - id: m2-practical
    type: practical
    prompt: Download the latest annual report of a listed company. In Excel, compute every ratio in these two lessons for
      two years, a five-step DuPont breakdown, and write five sentences interpreting the changes. Upload the file.
  - id: m2-explain
    type: explain
    prompt: Explain why paying a current liability with cash raises the current ratio when it is above 1.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q7
    - q8
    - q9
    - q10
    - q11
    - q12
    pass: 70
- id: m3
  title: 'Module 3: Section A, analytical issues'
  lessons:
  - id: m3-l1
    title: 'Section A: earnings quality and analytical issues'
    file: lessons/m3-l1.md
    minutes: 50
  requires:
  - id: m3-practical
    type: practical
    prompt: Using the same annual report, compute the accrual ratio for two years, list any off-balance-sheet obligations
      from the notes, and identify two accounting policy choices that affect comparisons with a competitor. Upload a short
      memo.
  - id: m3-explain
    type: explain
    prompt: Explain three warning signs of low earnings quality and why each matters.
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q13
    - q14
    - q15
    - q16
    - q17
    - q18
    pass: 70
- id: m4
  title: 'Module 4: Section B, risk, return, valuation and cost of capital'
  lessons:
  - id: m4-l1
    title: 'Section B: risk, return and CAPM'
    file: lessons/m4-l1.md
    minutes: 60
  - id: m4-l2
    title: 'Section B: cost of capital and capital structure'
    file: lessons/m4-l2.md
    minutes: 60
  requires:
  - id: m4-practical
    type: practical
    prompt: Build an Excel model that values a bond (price for any yield), a stock with the Gordon model, computes CAPM required
      return, and a company's WACC with a marginal cost of capital break point. Test it on the lesson examples. Upload it.
  - id: m4-explain
    type: explain
    prompt: Explain why investors are rewarded only for systematic risk, and what beta measures.
    min_words: 60
  - id: m4-quiz
    type: quiz
    questions:
    - q19
    - q20
    - q21
    - q22
    - q23
    - q24
    pass: 70
- id: m5
  title: 'Module 5: Section B, working capital, financing and international finance'
