    title: 'Section C: pricing'
    file: lessons/m7-l1.md
    minutes: 50
  - id: m7-l2
    title: 'Section C: decisions under uncertainty'
    file: lessons/m7-l2.md
    minutes: 50
  requires:
  - id: m7-practical
    type: practical
    prompt: Build a payoff table for a decision of your choice with at least two actions and two states, compute EV and EVPI,
