id: docker-kubernetes-ar
title: 'دورة Docker و Kubernetes بالعربي: من الحاوية إلى الـ Cluster'
version: 1
language: ar
description: 'كورس مبني على فيديو المهندس أحمد سامي (قناة Big Data بالعربي) عن Docker وKubernetes، مقسّم إلى دروس
  قصيرة يشغّل كل منها جزءه من الفيديو ويكمل من حيث توقفت. معه ملاحظات بالأوامر المهمة، ومهام عملية، واختبار في نهاية
  كل وحدة، ومراجعة لأسئلة المقابلات. الخطة: 3 أسابيع، حوالي ساعة إلى ساعة ونصف في اليوم.'
image: cover.jpg
modules:
- id: m1
  title: 'اليوم 1: الحاويات من الصفر'
  lessons:
  - id: m1-l1
    title: ابدأ من هنا
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: ما هي الحاويات؟
    file: lessons/m1-l2.md
    minutes: 19
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=30&end=1189
  - id: m1-l3
    title: معمارية الحاويات (الجزء 1 من 2)
    file: lessons/m1-l3.md
    minutes: 15
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=1189&end=2100
  - id: m1-l4
    title: معمارية الحاويات (الجزء 2 من 2)
    file: lessons/m1-l4.md
    minutes: 15
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=2100&end=3014
  requires:
  - id: m1-practical
    type: practical
    prompt: 'ارسم (على ورقة أو بأي برنامج) مقارنة بين VM وحاوية: الطبقات من الجهاز حتى التطبيق، وارفع الصورة. أضف
      تحت الرسم 3 أسطر: متى تختار VM ومتى تختار حاوية.'
  - id: m1-explain
    type: explain
    prompt: 'اشرح بكلماتك لصديق لا يعرف البرمجة: ما هي الحاوية، ولماذا هي أخف من الآلة الافتراضية؟'
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    pass: 70
- id: m2
  title: 'اليوم 2: Docker، التثبيت، وأول تطبيق'
  lessons:
  - id: m2-l1
    title: مقدمة عن Docker
    file: lessons/m2-l1.md
    minutes: 17
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=3014&end=4058
  - id: m2-l2
    title: تثبيت Docker
    file: lessons/m2-l2.md
    minutes: 20
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=4058&end=5237
  - id: m2-l3
    title: الحاوية = تطبيق
    file: lessons/m2-l3.md
    minutes: 16
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=5237&end=6201
  requires:
  - id: m2-practical
    type: practical
    prompt: ثبّت Docker، ثم شغّل docker version وdocker run hello-world وحاوية ubuntu تفاعلية، ودخل عليها مرة ثانية
      بـ docker exec. ارفع لقطة شاشة للأوامر ونتائجها.
  - id: m2-explain
    type: explain
    prompt: ما الفرق بين image وcontainer وregistry؟ استخدم تشبيهًا من عندك غير تشبيه الكلاس والأوبجكت.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q5
    - q6
    - q7
    - q8
    pass: 70
- id: m3
  title: 'اليومان 3-4: محرك Docker والـ Images بالتفصيل'
