    type: practical
    prompt: شغّل postgres مع volume، وأنشئ جدولًا وأضف صفًا، ثم احذف الحاوية وشغّل واحدة جديدة على نفس الـ volume
      وأثبت أن الصف موجود. ثم شغّل حاوية ثانية على شبكة خاصة تصل لقاعدة البيانات بالاسم. ارفع الأوامر والنتائج.
  - id: m4-explain
    type: explain
    prompt: لماذا تضيع بيانات الحاوية عند حذفها، وما الفرق بين volume وbind mount؟ متى تستخدم كلًا منهما؟
    min_words: 60
  - id: m4-quiz
    type: quiz
    questions:
