    minutes: 11
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=9437&end=10108
  requires:
  - id: m3-practical
    type: practical
    prompt: نزّل nginx:alpine وnginx:latest، وقارن بينهما بـ docker image ls وdocker history، وحدد الطبقات المشتركة
      إن وجدت. ارفع النتائج مع سطرين عن الفرق في الحجم وسببه.
  - id: m3-explain
    type: explain
    prompt: لماذا الاعتماد على tag مثل latest في السيرفرات خطر، وما البديل الآمن؟
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q9
    - q10
    - q11
    - q12
    pass: 70
