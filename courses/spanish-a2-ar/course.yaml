- id: m6
  title: 'الوحدة 6: التجارب والمستقبل'
  lessons:
  - id: m6-l1
    title: حجز غرفة والكلام عن التجارب
    file: lessons/m6-l1.md
    minutes: 35
  - id: m6-l2
    title: المضارع التام والمستقبل
    file: lessons/m6-l2.md
    minutes: 40
  - id: m6-l3
    title: 'اختبار المستوى: هل أتقنت A2؟'
    file: lessons/m6-l3.md
    minutes: 40
  requires:
  - id: m6-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): حجز فندق بالهاتف، ثم أماكن زرتها وستزورها. ارفعه.'
  - id: m6-explain
    type: explain
