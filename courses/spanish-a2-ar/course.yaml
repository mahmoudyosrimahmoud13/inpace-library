id: spanish-a2-ar
title: 'الإسباني A2: احكِ عن الماضي وتدبّر أمورك'
version: 2
language: ar
description: 'الإسباني مستوى A2، بالشرح العربي وبنفس طريقة A1 المبنية على الأبحاث: محادثة حقيقية أولًا، والعبارات التي يستخدمها
  الناس، وقاعدة واحدة في كل وحدة، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة. احكِ ما فعلته (الماضي المنتظم والشاذ)، وصِف
  كيف كانت الأمور (الماضي المستمر)، وقارن واشترِ، وتكلّم مع الطبيب، وتكلّم عن تجاربك والمستقبل. وينتهي باختبار مستوى A2. حوالي
  أسبوعين، 45 دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'Dreaming Spanish: فيديوهات مجانية مرتبة حسب المستوى، من الصفر (بالإسبانية)'
  url: https://www.dreaming.com/
- title: 'Easy Spanish: مقابلات في الشارع مع ترجمة (YouTube)'
  url: https://www.youtube.com/@EasySpanish
- title: 'SpanishDict: قاموس وجداول تصريف ونطق (بالإنجليزية)'
  url: https://www.spanishdict.com/
modules:
- id: m1
  title: 'الوحدة 1: عطلة نهاية الأسبوع الماضية'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: ماذا فعلت؟
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: 'الماضي البسيط: الأفعال المنتظمة'
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): عطلة نهاية الأسبوع الماضية، بستة أفعال على الأقل في الماضي البسيط. ارفعه.'
  - id: m1-explain
    type: explain
    prompt: اكتب 5 جمل بالإسبانية عمّا فعلته أمس.
    min_words: 30
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'الوحدة 2: رحلة'
  lessons:
  - id: m2-l1
    title: حكاية رحلة
    file: lessons/m2-l1.md
    minutes: 35
  - id: m2-l2
    title: 'الماضي البسيط: الأفعال الشاذة'
    file: lessons/m2-l2.md
    minutes: 40
  requires:
  - id: m2-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): حكاية رحلة. ارفعه.'
  - id: m2-explain
    type: explain
    prompt: اكتب 6 جمل بالإسبانية عن رحلة، باستخدام أربعة أفعال شاذة على الأقل (fui وhice وtuve وestuve...).
    min_words: 35
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'الوحدة 3: عندما كنت صغيرًا'
  lessons:
  - id: m3-l1
    title: ذكريات الطفولة
    file: lessons/m3-l1.md
    minutes: 35
  - id: m3-l2
    title: 'الماضي المستمر: كيف كانت الأمور'
    file: lessons/m3-l2.md
    minutes: 40
  requires:
  - id: m3-practical
    type: practical
    prompt: 'تسجيل صوتي (90 ثانية): طفولتك، بالعادات (الماضي المستمر) وحدث واحد (الماضي البسيط). ارفعه.'
  - id: m3-explain
    type: explain
    prompt: اكتب 6 جمل بالإسبانية عن طفولتك، مستخدمًا الماضي المستمر أربع مرات على الأقل.
    min_words: 35
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'الوحدة 4: التسوق'
  lessons:
  - id: m4-l1
    title: في محل ملابس
    file: lessons/m4-l1.md
    minutes: 35
  - id: m4-l2
    title: المقارنة، وlo / la / los / las
    file: lessons/m4-l2.md
    minutes: 40
  requires:
  - id: m4-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): محادثة في محل (الدوران)، ثم مقارنة بين محلين. ارفعه.'
  - id: m4-explain
    type: explain
    prompt: اكتب 5 جمل بالإسبانية تقارن فيها بين شيئين، باستخدام más... que وtan... como وmejor أو peor.
    min_words: 30
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m5
  title: 'الوحدة 5: عند الطبيب'
  lessons:
  - id: m5-l1
    title: لا أشعر أنني بخير
