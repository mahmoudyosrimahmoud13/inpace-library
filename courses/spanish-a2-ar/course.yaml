    minutes: 35
  - id: m5-l2
    title: doler، والإلزام والنصيحة، وصيغة الأمر
    file: lessons/m5-l2.md
    minutes: 40
  requires:
  - id: m5-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): صِف الأعراض لطبيب، ثم انصح صديقًا. ارفعه.'
  - id: m5-explain
    type: explain
    prompt: اكتب 5 نصائح بالإسبانية لشخص يريد أن ينام أفضل، باستخدام أمر tú وdebes وtienes que.
