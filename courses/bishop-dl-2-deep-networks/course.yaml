id: bishop-dl-2-deep-networks
title: 'Deep Learning (Bishop) 2: deep networks and how they learn'
version: 1
language: en
description: 'Part 2 of 5, following Deep Learning: Foundations and Concepts by Christopher M. Bishop and Hugh Bishop (Springer,
  2024), chapters 6 to 9. Deep neural networks and their error functions, mixture density networks, gradient descent with
  momentum and Adam, normalization, backpropagation, automatic differentiation and regularization. Each Read lesson opens
  the right pages of your own copy of the book (the Springer PDF, or read free online at bishopbook.com). Big project: write
  your own automatic-differentiation library in NumPy, then train a handwritten digit recognizer and a mixture density network
  with it. Plan: 7 days.'
image: cover.jpg
book: bishop.pdf
book_info:
  title: 'Deep Learning: Foundations and Concepts'
  url: https://www.bishopbook.com
  pages: 656
modules:
- id: m1
  title: 'Day 1: Why fixed basis functions aren''t enough'
  lessons:
  - id: m1-l1
    title: Start here
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: 'Read: limits of fixed basis functions, and multilayer networks (6.1–6.2)'
    file: lessons/m1-l2.md
    minutes: 50
    media: bishop.pdf#pages=189-204
  - id: m1-l3
    title: 'Watch: The essential main ideas of neural networks'
    file: lessons/m1-l3.md
    minutes: 19
    media: https://www.youtube.com/watch?v=CqOfi41LfDw
  - id: m1-l4
    title: 'Build: high dimensions, and a network by hand'
    file: lessons/m1-l4.md
    minutes: 30
  - id: m1-l5
    title: 'Module project: upgrade the clothes classifier to a neural network'
    file: lessons/m1-l5.md
    minutes: 120
    media: project-1-fashion-mlp.ipynb
  requires:
  - id: m1-practical
    type: practical
    prompt: Build the module project yourself and push it to your own GitHub repository, with a README that has a results
      table. Then do at least one idea from Make it yours and add its result to the README. Hand in the link to your repository.
    optional: true
  - id: m1-explain
    type: explain
    prompt: Why can't a single-layer model solve XOR, and what exactly does the hidden layer do that makes it possible? Use
      the words basis function and representation.
    min_words: 60
    optional: true
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
