q1:
  text: 'في الحل التكراري يجب ملء الجدول بحيث:'
  show: 4
  options:
    a: تكون كل حالة نعتمد عليها محسوبة قبلها
    b: نبدأ من آخر خانة دائمًا
    c: نملأ عشوائيًا
    d: نحسب الإجابة أولًا
q2:
  text: 'LIS بمصفوفة tails والبحث الثنائي تعقيده:'
  show: 4
  options:
    a: O(n log n)
    b: O(n²)
    c: O(n)
    d: O(2ⁿ)
q3:
  text: 'في عدّ طرق تكوين مبلغ حيث الترتيب لا يهم، تكون العملات في:'
  show: 4
  options:
    a: اللفة الخارجية
    b: اللفة الداخلية
    c: لا فرق
    d: لفة ثالثة
q4:
  text: 'إذا كان الصف i يعتمد على الصف i−1 فقط:'
  show: 4
  options:
    a: يكفي صفّان بدل الجدول كله
    b: نحتاج الجدول كاملًا دائمًا
    c: لا يمكن الحل تكراريًا
    d: نستخدم map
q5:
  text: 'قيمة البداية المناسبة لحالات ''مستحيلة'' في مسألة أكبر مجموع مع أرقام سالبة:'
  show: 4
  options:
    a: قيمة سالبة كبيرة جدًا (مثل LLONG_MIN/4)
    b: '0'
    c: '1'
    d: '-1'
q6:
  text: 'في Range DP نملأ الجدول حسب:'
  show: 4
  options:
    a: طول الجزء من الأقصر للأطول
    b: l تصاعديًا فقط
    c: r تنازليًا فقط
    d: عشوائيًا
q7:
  text: 'دمج الأكوام بثلاث لفات تعقيده:'
  show: 4
  options:
    a: O(n³)
    b: O(n²)
    c: O(n log n)
    d: O(2ⁿ)
q8:
  text: 'في دمج الأكوام، تكلفة آخر دمج للجزء [l, r] هي:'
  show: 4
  options:
    a: مجموع كل عناصر الجزء
    b: أكبر عنصر
    c: عدد العناصر
    d: صفر
q9:
  text: 'dp[l][r] في لعبة الطرفين يمثل:'
  show: 4
  options:
    a: أكبر فرق يحققه من عليه الدور على الجزء
    b: نقاط اللاعب الأول دائمًا
    c: عدد الحركات
    d: مجموع الجزء
q10:
  text: 'علامة على Range DP:'
  show: 4
  options:
    a: دمج عناصر متجاورة أو حذف من الطرفين
    b: جراف كبير
    c: n حتى 10⁹
    d: أعداد أولية
q11:
  text: 'DP بالبتات مناسب عندما يكون n حوالي:'
  show: 4
  options:
    a: 20 أو أقل
    b: 10⁵
    c: 10⁹
    d: أي حجم
q12:
  text: 'TSP بالبتات تعقيده:'
  show: 4
  options:
    a: O(2ⁿ × n²)
    b: O(n!)
    c: O(n²)
    d: O(n log n)
q13:
  text: لماذا يصح المرور على mask تصاعديًا في TSP؟
  show: 4
  options:
    a: لأن mask | (1<<u) أكبر دائمًا من mask
    b: لأن mask مرتبة
    c: لا يصح
    d: بسبب priority_queue
q14:
  text: 'في التوزيع، الشخص الذي عليه الدور هو:'
  show: 4
  options:
    a: عدد البتات في mask
    b: أكبر بت
    c: أصغر بت
    d: mask نفسه
q15:
  text: 'المرور على كل mask وكل مجموعة جزئية منه يكلف:'
  show: 4
  options:
    a: O(3ⁿ)
    b: O(4ⁿ)
    c: O(2ⁿ)
    d: O(n²)
q16:
  text: 'tight = true يعني:'
  show: 4
  options:
    a: كل ما وضعناه يساوي بداية N، فالخانة الحالية محدودة بخانة N
    b: الرقم أصبح أصغر من N
    c: انتهينا
    d: الرقم صفر
q17:
  text: 'الإجابة في المدى [A, B] تساوي:'
  show: 4
  options:
    a: countUpTo(B) − countUpTo(A − 1)
    b: countUpTo(B) − countUpTo(A)
    c: countUpTo(A) + countUpTo(B)
    d: countUpTo(B − A)
q18:
  text: 'نضيف حالة started عندما:'
  show: 4
  options:
    a: تتأثر الخاصية بالأصفار البادئة
    b: N سالب
    c: دائمًا
    d: لا نحتاجها أبدًا
q19:
  text: 'البحث الثنائي مع Digit DP يصح لأن countUpTo(X):'
  show: 4
  options:
    a: غير متناقصة كلما زاد X
    b: عشوائية
    c: متناقصة
    d: ثابتة
q20:
  text: 'عدد حالات Digit DP لمجموع الأرقام mod D مع N حتى 10¹⁸ تقريبًا:'
  show: 4
  options:
    a: 19 × 2 × D
    b: 10¹⁸
    c: D²
    d: 2¹⁹
q21:
  text: 'عدد طرق اختيار 2 من 5 (الترتيب لا يهم):'
  show: 4
  options:
    a: '10'
    b: '20'
    c: '25'
    d: '5'
q22:
  text: 'توزيع n كرة متطابقة على k صندوق (مسموح الفارغ):'
  show: 4
  options:
    a: C(n + k − 1, k − 1)
    b: kⁿ
    c: C(n, k)
    d: n!
q23:
  text: 'عدد المسارات من (0,0) إلى (n,m) بخطوات يمين وأعلى:'
  show: 4
  options:
    a: C(n + m, n)
    b: n × m
    c: 2^(n+m)
    d: (n+m)!
q24:
  text: 'كلمات طولها n من 26 حرفًا فيها ''a'' مرة على الأقل:'
  show: 4
  options:
    a: 26ⁿ − 25ⁿ
    b: 25ⁿ
    c: 26 × n
    d: n²
q25:
  text: 'في الشمول والاستبعاد، تقاطعات عدد فردي من المجموعات:'
  show: 4
  options:
    a: تُجمع، والزوجية تُطرح
    b: تُطرح كلها
    c: تُجمع كلها
    d: تُهمل
q26:
  text: 'Dijkstra يعمل بشكل صحيح عندما تكون الأوزان:'
  show: 4
  options:
    a: غير سالبة
    b: أي قيم
    c: سالبة فقط
    d: كلها متساوية فقط
q27:
  text: 'الطابور في Dijkstra يعطي أولًا:'
  show: 4
  options:
    a: العقدة ذات أصغر مسافة حالية
    b: أكبر مسافة
    c: آخر عقدة أُضيفت
    d: عقدة عشوائية
q28:
  text: 'تعقيد Dijkstra مع priority_queue:'
  show: 4
  options:
    a: O((n + m) log m)
    b: O(n³)
    c: O(n × m)
    d: O(n)
q29:
  text: 'إذا كانت الأوزان 0 أو 1 فقط، الأسرع:'
  show: 4
  options:
    a: 0-1 BFS باستخدام deque
    b: Floyd–Warshall
    c: DFS
    d: Kruskal
q30:
  text: 'Floyd–Warshall مناسب عندما:'
  show: 4
  options:
    a: نحتاج كل الأزواج و n صغير (حتى ~500)
    b: n حتى 10⁵
    c: الجراف شجرة
    d: لا توجد أوزان
q31:
  text: 'ضغط المسار في DSU يعني:'
  show: 4
  options:
    a: ربط العقد التي مررنا بها بالجذر مباشرة (أو قريبًا منه)
    b: حذف العقد
    c: ترتيب العقد
    d: تكرار البحث
q32:
  text: 'unite(a, b) يُرجع false عندما:'
  show: 4
  options:
    a: a و b في نفس المجموعة بالفعل
    b: a أكبر من b
    c: المجموعة فارغة
    d: دائمًا
q33:
  text: 'شجرة الامتداد لجراف فيه n عقدة تحتوي:'
  show: 4
  options:
    a: n − 1 حافة
    b: n حافة
    c: n² حافة
    d: m حافة
q34:
  text: 'Kruskal يرتب الحواف:'
  show: 4
  options:
    a: حسب الوزن تصاعديًا
    b: تنازليًا
    c: حسب أرقام العقد
    d: لا يرتبها
q35:
  text: 'إذا أخذ Kruskal أقل من n − 1 حافة:'
  show: 4
  options:
    a: الجراف غير متصل ولا توجد شجرة امتداد
    b: الإجابة صفر
    c: هناك خطأ في DSU دائمًا
    d: نعيد الترتيب
q36:
  text: 'شجرة المقاطع تجعل التعديل والسؤال عن جزء:'
  show: 4
  options:
    a: O(log n) لكل منهما
    b: O(1) و O(n)
    c: O(n) لكل منهما
    d: O(n log n)
q37:
  text: 'المحايد لعملية أصغر قيمة:'
  show: 4
  options:
    a: LLONG_MAX
    b: '0'
    c: LLONG_MIN
    d: '1'
q38:
  text: 'في Fenwick، الدالة add(i, v):'
  show: 4
  options:
    a: تضيف v للعنصر i ولا تستبدله
    b: تستبدل العنصر
    c: تحذف العنصر
    d: تضرب العنصر
q39:
  text: 'لإضافة x لكل عناصر جزء مع أسئلة على أجزاء نحتاج:'
  show: 4
  options:
    a: Lazy Propagation
    b: مجموعًا تراكميًا فقط
    c: DSU
    d: Dijkstra
q40:
  text: 'حجم مصفوفة الشجرة في الشكل التكراري:'
  show: 4
  options:
    a: 2n
    b: n
    c: n²
    d: log n
q41:
  text: 'الوضع الفائز هو الذي:'
  show: 4
  options:
    a: توجد منه حركة واحدة على الأقل لوضع خاسر للخصم
    b: كل حركاته فائزة
    c: لا حركات منه
    d: فيه أحجار كثيرة
q42:
  text: 'في Nim العادية يفوز الأول إذا:'
  show: 4
  options:
    a: XOR الأكوام لا يساوي صفرًا
    b: مجموع الأكوام فردي
    c: عدد الأكوام زوجي
    d: أكبر كومة فردية
q43:
  text: 'mex لمجموعة {0, 1, 3}:'
  show: 4
  options:
    a: '2'
    b: '4'
    c: '0'
    d: '3'
q44:
  text: 'لعبة مجمعة من ألعاب مستقلة يفوز فيها الأول إذا:'
  show: 4
  options:
    a: XOR أرقام Grundy لا يساوي صفرًا
    b: مجموعها فردي
    c: كلها فائزة
    d: أكبرها صفر
q45:
  text: 'طريقة عملية لمسألة ألعاب صعبة:'
  show: 4
  options:
    a: حل بطيء للقيم الصغيرة ثم البحث عن نمط
    b: تخمين الإجابة
    c: طباعة First دائمًا
    d: Dijkstra
q46:
  text: 'المرجع المجاني الأشهر لشرح الخوارزميات:'
  show: 4
  options:
    a: cp-algorithms.com
    b: ويكيبيديا فقط
    c: منتديات عامة
    d: لا يوجد
q47:
  text: 'بعد هذا الكورس، أول موضوع مقترح:'
  show: 4
  options:
    a: Lazy Propagation في شجرة المقاطع
    b: Flow
    c: الأساسيات من جديد
    d: لغة جديدة
q48:
  text: 'مسابقة فريقية افتراضية كاملة مقترحة كل:'
  show: 4
  options:
    a: أسبوعين
    b: سنة
    c: يوم
    d: شهرين
q49:
  text: 'نضيف كودًا لمكتبة الفريق:'
  show: 4
  options:
    a: بعد اختباره على مسألة حقيقية
    b: فور كتابته
    c: من الإنترنت دون اختبار
    d: أثناء المسابقة
