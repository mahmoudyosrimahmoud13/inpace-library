    - q21
    - q22
    - q23
    - q24
    - q25
    pass: 70
- id: m6
  title: 'الوحدة 6: الآن والخطط'
  lessons:
  - id: m6-l1
    title: ماذا تفعل الآن؟ وماذا ستفعل؟
    file: lessons/m6-l1.md
    minutes: 35
  - id: m6-l2
    title: المضارع المستمر وgoing to
    file: lessons/m6-l2.md
    minutes: 40
  - id: m6-l3
    title: 'اختبار المستوى: هل أتقنت A1؟'
    file: lessons/m6-l3.md
    minutes: 40
  requires:
  - id: m6-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): ماذا يحدث الآن، ثم دعوة لعطلة نهاية الأسبوع. ارفعه.'
