    file: lessons/m5-l1.md
    minutes: 35
  - id: m5-l2
    title: can، وsome / any، وhow much / how many
    file: lessons/m5-l2.md
    minutes: 40
  requires:
  - id: m5-practical
    type: practical
    prompt: 'تسجيل صوتي (60 ثانية): طلب في مقهى (الدوران)، ثم ما تحبه وما تستطيع طبخه. ارفعه.'
  - id: m5-explain
    type: explain
    prompt: اكتب 5 جمل بالإنجليزية عن الأكل الذي تحبه وما لا تحبه، مع some وany.
    min_words: 25
  - id: m5-quiz
    type: quiz
