id: english-a1-ar
title: 'الإنجليزي من الصفر: مستوى A1'
version: 2
language: ar
description: 'إنجليزي للمبتدئين تمامًا من متحدثي العربية، بطريقة مبنية على الأبحاث: استمع لمحادثة حقيقية أولًا، واحفظ العبارات
  التي يستخدمها الناس فعلًا، وقاعدة واحدة في كل وحدة مع شرح الفروق عن العربية، وتسجيل صوتي في كل وحدة، ومراجعة من الذاكرة.
  التعارف والعائلة ويومك والمدينة والأكل والتسوق والخطط، مع to be وhave got والمضارع البسيط وthere is وcan والمضارع المستمر.
  وينتهي باختبار مستوى A1. حوالي أسبوعين، 45 دقيقة يوميًا.'
image: cover.jpg
downloads:
- title: 'BBC Learning English: دروس وفيديوهات وبودكاست مجانية حسب المستوى'
  url: https://www.bbc.co.uk/learningenglish/
- title: 'VOA Learning English: أخبار وقصص بإنجليزية بطيئة وواضحة مع النص'
  url: https://learningenglish.voanews.com/
- title: 'Cambridge Dictionary: قاموس مع نطق بريطاني وأمريكي وترجمة عربية'
  url: https://dictionary.cambridge.org/
modules:
- id: m1
  title: 'الوحدة 1: مرحبًا، أنا...'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: كيف يعمل هذا الكورس'
    file: lessons/m1-l1.md
    minutes: 20
  - id: m1-l2
    title: التعرّف على شخص جديد
    file: lessons/m1-l2.md
    minutes: 35
  - id: m1-l3
    title: 'الفعل to be: am وis وare'
    file: lessons/m1-l3.md
    minutes: 40
  requires:
  - id: m1-practical
    type: practical
    prompt: 'تسجيل صوتي (30 ثانية): حيِّ المستمع، وقدّم نفسك (الاسم، البلد، المدينة، العمل)، واسأل عن اسمه، وودّعه. ارفعه.'
  - id: m1-explain
    type: explain
    prompt: اكتب من 4 إلى 6 جمل بالإنجليزية تقدّم فيها نفسك، باستخدام I'm وmy name is وI live in.
    min_words: 20
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'الوحدة 2: عائلتي'
  lessons:
  - id: m2-l1
    title: الكلام عن عائلتك
    file: lessons/m2-l1.md
    minutes: 35
  - id: m2-l2
    title: have got، والملكية، والجمع
    file: lessons/m2-l2.md
    minutes: 40
  requires:
  - id: m2-practical
    type: practical
    prompt: 'تسجيل صوتي (45 ثانية): صِف عائلتك. ارفعه.'
  - id: m2-explain
    type: explain
    prompt: اكتب 5 جمل بالإنجليزية عن شخص واحد في عائلتك.
    min_words: 25
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'الوحدة 3: يومي'
  lessons:
  - id: m3-l1
    title: يوم عادي
    file: lessons/m3-l1.md
    minutes: 35
  - id: m3-l2
    title: المضارع البسيط
    file: lessons/m3-l2.md
    minutes: 40
  requires:
  - id: m3-practical
    type: practical
    prompt: 'تسجيل صوتي (45 ثانية): يومك ويوم شخص آخر. ارفعه.'
  - id: m3-explain
    type: explain
    prompt: اكتب 5 جمل بالإنجليزية عمّا يفعله صديق كل يوم (مع -s).
    min_words: 25
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'الوحدة 4: في المدينة'
  lessons:
  - id: m4-l1
    title: السؤال عن الطريق
    file: lessons/m4-l1.md
    minutes: 35
  - id: m4-l2
    title: there is / there are، وحروف الجر، والأمر
    file: lessons/m4-l2.md
    minutes: 40
  requires:
  - id: m4-practical
    type: practical
    prompt: 'تسجيل صوتي (45 ثانية): الاتجاهات من بيتك إلى مكان قريب. ارفعه.'
  - id: m4-explain
    type: explain
    prompt: اكتب 5 جمل بالإنجليزية تصف حيّك باستخدام there is وthere are وحروف المكان.
    min_words: 25
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m5
  title: 'الوحدة 5: الأكل والتسوق'
  lessons:
  - id: m5-l1
