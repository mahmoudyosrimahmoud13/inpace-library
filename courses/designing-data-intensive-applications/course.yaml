id: designing-data-intensive-applications
title: 'Designing Data-Intensive Applications: build the ideas from scratch'
version: 1
language: en
description: 'Martin Kleppmann''s Designing Data-Intensive Applications, chapter by chapter, and every big idea built as a
  small working program you can read line by line: Twitter''s timeline and tail latency, three data models, a Bitcask-style
  store with crash recovery, an LSM-tree with Bloom filters, a column store, your own Protocol Buffers and Avro encodings,
  replication lag and quorums, partitioning and rebalancing, an MVCC store with three isolation levels, clock skew and fencing
  tokens, Lamport clocks and leader election, MapReduce with parallel processes and joins, a Kafka-like log with CDC, and
  an unbundled database with audits. Each Read lesson opens the right pages of your own copy of the book; every project uses
  only Python''s standard library, and every output shown is real. For developers who know Python and some SQL. Plan: 15 days,
  about 2 hours a day.'
image: cover.jpg
book: ddia.pdf
book_info:
  title: Designing Data-Intensive Applications
  url: https://dataintensive.net/
  pages: 613
downloads:
- title: The book's website (references, errata, author's notes)
  url: https://dataintensive.net/
- title: The book at O'Reilly
  url: https://www.oreilly.com/library/view/designing-data-intensive-applications/9781491903063/
modules:
- id: m1
  title: 'Day 1: Reliable, scalable and maintainable'
  lessons:
  - id: m1-l1
    title: 'Start here: the book, the lab and your plan'
    file: lessons/m1-l1.md
    minutes: 15
  - id: m1-l2
    title: 'Read: Preface and Chapter 1, Reliable, Scalable, and Maintainable Applications'
    file: lessons/m1-l2.md
    minutes: 60
    media: ddia.pdf#pages=15-48
  - id: m1-l3
    title: Percentiles, fan-out and tail latency, in plain words
    file: lessons/m1-l3.md
    minutes: 20
  - id: m1-l4
    title: 'Project 1: Chirp''s timeline and the shape of latency'
    file: lessons/m1-l4.md
    minutes: 40
    media: lab/
  requires:
  - id: m1-practical
    type: practical
    prompt: 'Do project 1 and its variations: find the read/write ratio where fan-out on read and on write cost the same,
      and how many backend calls per page you can afford before 10% of pages take over 200 ms. Start the git repository. Hand
      in your numbers and the commands you ran.'
  - id: m1-explain
    type: explain
    prompt: Explain why response times should be reported as percentiles rather than as an average, and what tail latency
      amplification is.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
