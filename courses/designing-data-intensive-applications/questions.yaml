q68:
  text: What is the difference between timeliness and integrity?
  show: 4
  options:
    a: 'Timeliness: users see an up-to-date state'
    b: 'Integrity: no corruption, loss or contradiction'
    c: Integrity violations are permanent until fixed; timeliness violations fix themselves
    d: They are the same
