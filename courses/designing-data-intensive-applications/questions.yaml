q69:
  text: What does 'trust, but verify' mean for data systems?
  show: 4
  options:
    a: Continually audit data integrity rather than assume guarantees are absolute
    b: Design systems to be auditable
    c: Never trust any database
    d: Disable checksums
    e: Only verify during development
    f: Ask users to report errors
q70:
  text: In project 14, what lets a new fraud view be added without a migration?
  show: 4
  options:
    a: Replaying the event log from the beginning
    b: Each view keeps its own offset
    c: Copying the balances table
    d: Deleting old events
    e: A distributed transaction
    f: Last write wins
q71:
  text: Which system is the 'system of record'?
  show: 4
  options:
    a: The one that holds the authoritative version of the data
    b: The source of truth from which derived data is built
    c: A cache
    d: A search index
    e: Any materialized view
    f: The fastest database
q72:
  text: Which workload suggests an LSM-tree storage engine?
  show: 4
  options:
    a: Write-heavy, with many inserts and updates
    b: Where compression and sequential writes matter
    c: Read-heavy with strict, predictable latency only
    d: No writes at all
    e: Single-row updates in place only
    f: Tiny data that fits in one page
q73:
  text: Which anomaly needs serializable isolation to prevent?
  show: 4
  options:
    a: Write skew
    b: Phantoms causing write skew
    c: Dirty reads
    d: Dirty writes
    e: Read skew
    f: Lost updates in PostgreSQL's repeatable read
q74:
  text: How do you make a retried request safe?
  show: 4
  options:
    a: Make the operation idempotent
    b: Attach a unique request ID and suppress duplicates
    c: Retry faster
    d: Use a longer timeout only
    e: Use wall-clock timestamps
    f: Never retry
q75:
  text: What makes a from-scratch lab convincing in an interview?
  show: 4
  options:
    a: Measured results from your own runs
    b: Your own extensions beyond the lessons
    c: Explaining trade-offs with what you built
    d: Copying outputs from the course
    e: Hiding the code
    f: Avoiding numbers
