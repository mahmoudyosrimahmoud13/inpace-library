id: english-irregular-verbs
title: English irregular verbs, the easy way
version: 2
language: en
description: The 100+ irregular verbs you use most, learned in groups that change the same way, so you remember patterns,
  not a long list. Each group has a table with examples, a tip to remember it, practice and a quiz. Then the mistakes everyone
  makes (I have went, did you saw), British and American forms, and the full list to review. About 2 weeks, 15 minutes a day.
image: cover.jpg
modules:
- id: m1
  title: 'Start here: what makes a verb irregular'
  lessons:
  - id: m1-l1
    title: Three forms of every verb
    file: lessons/m1-l1.md
    minutes: 12
  requires:
  - id: m1-practical
    type: practical
    prompt: 'Write 6 sentences about your life: 2 with the base (now), 2 with the past simple (yesterday, last year), and
      2 with have + participle. Use go, see and do. Example: I went to the market yesterday. Also record a voice note of yourself
      saying the verb forms from this module aloud, and upload it with your writing.'
  - id: m1-explain
    type: explain
    prompt: 'In your own words: when do you use the past simple, and when do you use the past participle?'
    min_words: 25
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'Families A and B: the easy ones'
  lessons:
  - id: m2-l1
    title: 'Family A: verbs that never change'
    file: lessons/m2-l1.md
    minutes: 12
  - id: m2-l2
    title: 'Family B: come, become, run'
    file: lessons/m2-l2.md
    minutes: 8
  requires:
  - id: m2-practical
    type: practical
    prompt: 'Choose 8 verbs from families A and B. For each, write one true sentence in the past about your week. Then say
      all of them out loud, with all three forms first: cut, cut, cut. Also record a voice note of yourself saying the verb
      forms from this module aloud, and upload it with your writing.'
  - id: m2-explain
    type: explain
    prompt: How can you tell if “I put my bag here” is about now or the past? Give one example of each.
    min_words: 20
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    - q11
    pass: 70
- id: m3
  title: 'Family C: past and participle the same'
  lessons:
  - id: m3-l1
    title: -ought, -t and -ept
    file: lessons/m3-l1.md
    minutes: 15
  - id: m3-l2
    title: -aid, and the everyday ones
    file: lessons/m3-l2.md
    minutes: 15
  requires:
  - id: m3-practical
    type: practical
    prompt: Write a short story (8 to 10 sentences) about the last time you went shopping or travelled. Use at least 10 verbs
      from family C, in the past simple. Underline them. Also record a voice note of yourself saying the verb forms from this
      module aloud, and upload it with your writing.
  - id: m3-explain
    type: explain
    prompt: Pick two patterns from family C (like -ought or -ept). Explain each one and give three verbs for it.
    min_words: 25
  - id: m3-quiz
    type: quiz
    questions:
    - q12
    - q13
    - q14
    - q15
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m4
  title: 'Family D: three different forms'
  lessons:
  - id: m4-l1
    title: i-a-u and the -en participles
    file: lessons/m4-l1.md
    minutes: 15
  - id: m4-l2
    title: -ew/-own, -ook/-aken, -ore/-orn and the odd ones
    file: lessons/m4-l2.md
    minutes: 15
  requires:
  - id: m4-practical
    type: practical
    prompt: 'Make your own “I have / I haven''t” list: 10 sentences with family D participles about things you have or haven''t
      done (I have ridden a horse. I haven''t flown in a plane). Then ask someone the same questions: Have you ever ridden
      a horse? Also record a voice note of yourself saying the verb forms from this module aloud, and upload it with your
      writing.'
  - id: m4-explain
    type: explain
    prompt: Explain the difference between “She has gone to Alexandria” and “She has been to Alexandria”.
    min_words: 20
  - id: m4-quiz
    type: quiz
    questions:
    - q21
    - q22
    - q23
    - q24
    - q25
    - q26
    - q27
    - q28
    - q29
    - q30
    - q31
    pass: 70
- id: m5
  title: Using them right
  lessons:
  - id: m5-l1
    title: The mistakes everyone makes
    file: lessons/m5-l1.md
    minutes: 15
  - id: m5-l2
    title: British and American English
    file: lessons/m5-l2.md
    minutes: 8
  requires:
  - id: m5-practical
    type: practical
    prompt: 'Find and fix the mistakes in these 6 sentences, then write 4 of your own with the right forms: 1) I have saw
      this film. 2) Did you went out? 3) She buyed a dress. 4) The letter was wrote by hand. 5) I didn''t knew that. 6) He
      has broke his phone yesterday. Also record a voice note of yourself saying the verb forms from this module aloud, and
      upload it with your writing.'
  - id: m5-explain
    type: explain
    prompt: Why is “I have seen him yesterday” wrong? How do you fix it, and when would “I have seen him” be right?
    min_words: 25
  - id: m5-quiz
    type: quiz
    questions:
    - q32
    - q33
    - q34
    - q35
    - q36
    - q37
    pass: 70
- id: m6
  title: 'Review: the full list'
  lessons:
  - id: m6-l1
    title: All the verbs in one table
    file: lessons/m6-l1.md
    minutes: 15
  requires:
  - id: m6-practical
    type: practical
    prompt: Write a short text (about 120 words) about the best trip or day of your life. Use at least 15 different irregular
      verbs, both past simple and have + participle. Read it out loud once. Also record a voice note of yourself saying the
      verb forms from this module aloud, and upload it with your writing.
  - id: m6-explain
    type: explain
    prompt: Which family of irregular verbs was the hardest for you, and what will you do to remember it?
    min_words: 20
  - id: m6-quiz
    type: quiz
    questions:
    - q38
    - q39
    - q40
    - q41
    - q42
    - q43
    - q44
    - q45
    - q46
    - q47
    - q48
    - q49
    pass: 70
