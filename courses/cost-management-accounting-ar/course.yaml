id: cost-management-accounting-ar
title: 'محاسبة التكاليف والمحاسبة الإدارية: أرقام للقرارات'
version: 1
language: ar
description: المحاسبة من الداخل، لمن يديرون المشروع. سلوك التكاليف وطريقة الحد الأعلى والأدنى، وهامش المساهمة ونقطة التعادل،
  والربح المستهدف والرافعة التشغيلية، وتكاليف الأوامر والمراحل والتكاليف على أساس الأنشطة، والتكاليف الكلية مقابل المتغيّرة،
  والتكاليف الملائمة للطلبيات الخاصة والتصنيع أو الشراء والموارد النادرة، والموازنات والموازنة النقدية، والموازنة المرنة والانحرافات،
  والعائد على الاستثمار والدخل المتبقّي وبطاقة الأداء المتوازن. تتابع مخبز نور وهو يكبر وتنتهي بأربعة قرارات حقيقية. الكورس
  الثالث في مسار المحاسبة. حوالي 6 أيام، ساعة يوميًا.
image: cover.jpg
downloads:
- title: 'Principles of Accounting, Volume 2: Managerial Accounting (OpenStax، كتاب مجاني بالإنجليزية)'
  url: https://openstax.org/details/books/principles-managerial-accounting
modules:
- id: m1
  title: 'اليوم 1: التكاليف وسلوكها'
  lessons:
  - id: m1-l1
    title: 'ابدأ من هنا: التكاليف من الداخل'
    file: lessons/m1-l1.md
    minutes: 25
  - id: m1-l2
    title: 'سلوك التكاليف: فصل التكاليف المختلطة'
    file: lessons/m1-l2.md
    minutes: 30
  requires:
  - id: m1-practical
    type: practical
    prompt: اجمع ستة أشهر لتكلفة مختلطة تعرفها (كهرباء بيتك، باقة الموبايل، بنزين سيارة) مع مقياس للنشاط. استخدم طريقة الحد
      الأعلى والأدنى لفصلها إلى ثابت ومتغيّر، ثم اختبر المعادلة على باقي الأشهر. ارفع الشيت.
  - id: m1-explain
    type: explain
    prompt: اشرح لماذا تتغيّر تكلفة الوحدة مع الحجم، بمثال كيكة نور عند 300 و500 كيكة شهريًا.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'اليوم 2: التكلفة والحجم والربح'
  lessons:
  - id: m2-l1
    title: هامش المساهمة ونقطة التعادل
    file: lessons/m2-l1.md
    minutes: 30
  - id: m2-l2
    title: الربح المستهدف وهامش الأمان والرافعة التشغيلية
    file: lessons/m2-l2.md
    minutes: 30
  requires:
  - id: m2-practical
    type: practical
    prompt: 'ابنِ نموذج تعادل في شيت لمشروع صغير تختاره: السعر والمتغيّر والثابت كمدخلات؛ وهامش المساهمة ونقطة التعادل ووحدات
      الربح المستهدف وهامش الأمان والرافعة التشغيلية كمخرجات. غيّر السعر 10% واكتب ما يحدث. ارفعه.'
  - id: m2-explain
    type: explain
    prompt: اشرح الرافعة التشغيلية، ولماذا يكسب المشروع ذو التكاليف الثابتة العالية أكثر في السنوات الجيدة ويعاني أكثر في
      السيئة.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'اليوم 3: تكلفة المنتج'
  lessons:
  - id: m3-l1
    title: 'تكاليف الأوامر: تكلفة طلبية واحدة'
    file: lessons/m3-l1.md
    minutes: 30
  - id: m3-l2
    title: تكاليف المراحل والتكاليف على أساس الأنشطة
    file: lessons/m3-l2.md
    minutes: 35
  requires:
  - id: m3-practical
    type: practical
    prompt: 'احسب تكلفة طلبية حسب الطلب تختارها (موقع، تورتة فرح، أثاث) ببطاقة تكلفة أمر: خامات وعمالة وأعباء محمّلة بمعدل
      تبرّره. ثم ضع سعرًا. ارفع البطاقة.'
  - id: m3-explain
    type: explain
    prompt: اشرح لماذا تُحسب تكلفة المنتجات حسب الطلب غالبًا بأقل من حقيقتها عندما توزّع الأعباء بساعات العمل، وكيف تصلح ABC
      ذلك.
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'اليوم 4: الربح والقرارات'
  lessons:
  - id: m4-l1
    title: التكاليف الكلية والتكاليف المتغيّرة
    file: lessons/m4-l1.md
    minutes: 30
  - id: m4-l2
    title: 'التكاليف الملائمة: اتخاذ القرارات'
    file: lessons/m4-l2.md
    minutes: 35
  requires:
  - id: m4-practical
    type: practical
    prompt: 'حلّل قرارًا حقيقيًا أو مُتخيّلًا في عملك أو حياتك (قبول شغل جانبي، الشراء أو الإيجار، إلغاء منتج) بجدول تكاليف
      ملائمة: اكتب كل البدائل، وأبقِ فقط التكاليف المستقبلية التي تختلف، وأضف تكاليف الفرصة البديلة ونقطتين غير ماليتين. ارفعه.'
  - id: m4-explain
    type: explain
    prompt: اشرح لماذا قد يستحق خط إنتاج يُظهر 'خسارة' بعد التكاليف الموزّعة أن يبقى.
    min_words: 60
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m5
  title: 'اليوم 5: الموازنات والانحرافات'
  lessons:
  - id: m5-l1
    title: 'الموازنات: التخطيط للأشهر القادمة'
    file: lessons/m5-l1.md
    minutes: 35
  - id: m5-l2
    title: الموازنة المرنة والانحرافات
    file: lessons/m5-l2.md
    minutes: 35
  requires:
  - id: m5-practical
    type: practical
    prompt: 'اعمل موازنة نقدية لثلاثة أشهر لمشروع صغير أو لبيتك: النقدية أول المدة، والمتحصلات أو الدخل بمواعيدها، وكل المدفوعات،
      وحد أدنى. أظهر الشهر الذي ستحتاج فيه للاقتراض أو التقليل، إن وُجد. ارفعها.'
  - id: m5-explain
    type: explain
    prompt: اشرح لماذا يجب مقارنة النتائج الفعلية بالموازنة المرنة وليس بالموازنة الأصلية.
    min_words: 60
  - id: m5-quiz
    type: quiz
    questions:
    - q21
    - q22
    - q23
    - q24
    - q25
    pass: 70
- id: m6
  title: 'اليوم 6: الأداء وقراراتك'
  lessons:
  - id: m6-l1
    title: قياس الأداء
    file: lessons/m6-l1.md
    minutes: 30
  - id: m6-l2
    title: 'المشروع الختامي: قرارات نور الكبيرة'
    file: lessons/m6-l2.md
    minutes: 60
  requires:
  - id: m6-practical
    type: practical
    prompt: حلّ القرارات الأربعة في شيت، ثم اكتب نصيحتك لنور في نصف صفحة مع خمسة مؤشرات تتابعها شهريًا. ارفع الاثنين.
  - id: m6-explain
    type: explain
    prompt: اشرح كيف يدفع الدخل المتبقّي المدير لقبول مشروع جيد كان ROI سيجعله يرفضه.
    min_words: 60
  - id: m6-quiz
    type: quiz
    questions:
    - q26
    - q27
    - q28
    - q29
    - q30
    pass: 70
