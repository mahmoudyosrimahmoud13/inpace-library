q1:
  text: 'إيجار 6,000 شهريًا، والمبيعات ترتفع من 300 إلى 500 كيكة. هو:'
  show: 4
  options:
    a: نصيب الكيكة يزيد
    b: متغيّر إجمالًا
    c: تكلفة مباشرة
    d: ثابت إجمالًا، ونصيب الكيكة يقل
q2:
  text: أيّ هذه تكلفة غارقة؟
  show: 4
  options:
    a: أجور الأسبوع القادم
    b: دقيق الشهر القادم
    c: فرن اشتُري العام الماضي
    d: فرن جديد مخطط
q3:
  text: 'الأعلى: 500 ساعة، 4,800. الأقل: 200 ساعة، 3,000. المتغيّر للساعة:'
  show: 4
  options:
    a: '9.6'
    b: '15'
    c: 1,800
    d: '6'
q4:
  text: 'بهذا المعدل، الجزء الثابت:'
  show: 4
  options:
    a: 1,200
    b: 3,000
    c: 1,800
    d: '600'
q5:
  text: 'تكاليف جزء من صنع البضاعة وتنتظر في المخزون حتى البيع هي:'
  show: 4
  options:
    a: تكاليف الفرصة البديلة
    b: تكاليف غارقة
    c: تكاليف المنتج
    d: تكاليف الفترة
q6:
  text: 'السعر 120، المتغيّر 50، الثابت 21,000. التعادل بالوحدات:'
  show: 4
  options:
    a: '420'
    b: '246'
    c: '175'
    d: '300'
q7:
  text: 'لربح مستهدف 7,000، الوحدات المطلوبة:'
  show: 4
  options:
    a: '100'
    b: '300'
    c: '400'
    d: '540'
q8:
  text: 'المبيعات 450 وحدة، التعادل 300. هامش الأمان:'
  show: 4
  options:
    a: 50%
    b: 67%
    c: 33%
    d: 150%
q9:
  text: 'هامش المساهمة 31,500، ربح التشغيل 10,500. الرافعة التشغيلية:'
  show: 4
  options:
    a: '3.0'
    b: 42,000
    c: '0.33'
    d: '2.0'
q10:
  text: 'لو ارتفعت التكلفة المتغيّرة للوحدة، نقطة التعادل:'
  show: 4
  options:
    a: تنخفض
    b: ترتفع
    c: تصبح صفرًا
    d: تبقى كما هي
q11:
  text: 'أعباء مقدّرة 18,000 و1,200 ساعة عمل. معدل التحميل:'
  show: 4
  options:
    a: 1.5 لساعة العمل
    b: 6.67 لساعة العمل
    c: 21,600
    d: 15 لساعة العمل
q12:
  text: 'أمر: خامات 900، عمالة 400، 10 ساعات بمعدل تحميل 15. تكلفته:'
  show: 4
  options:
    a: 1,600
    b: 1,450
    c: 1,300
    d: 1,315
q13:
  text: 'الأعباء المحمّلة أكبر من الفعلية. الأعباء:'
  show: 4
  options:
    a: محمّلة بالنقص
    b: محمّلة بالزيادة
    c: مضبوطة تمامًا
    d: تكلفة غارقة
q14:
  text: 'الخامات تُضاف في البداية؛ 2,000 وحدة تحت التشغيل مكتملة 50% للتحويل. وحداتها المعادلة للتحويل:'
  show: 4
  options:
    a: 2,000
    b: 1,000
    c: 4,000
    d: '500'
q15:
  text: 'ABC تحمّل الأعباء باستخدام:'
  show: 4
  options:
    a: الأنشطة التي تسبّب كل تكلفة
    b: حصص متساوية لكل منتج
    c: ساعات العمل فقط
    d: قيمة المبيعات
q16:
  text: 'الإنتاج 500، المبيعات 450، نصيب الوحدة من الأعباء الثابتة 20. ربح التكاليف الكلية مقارنة بالمتغيّرة:'
  show: 4
  options:
    a: أعلى بـ 9,000
    b: أقل بـ 1,000
    c: نفسه
    d: أعلى بـ 1,000
q17:
  text: 'طلبية خاصة مع طاقة فائضة تُقبل لو:'
  show: 4
  options:
    a: سعرها أعلى من التكلفة الإضافية (المتغيّرة)
    b: بالسعر العادي
    c: انخفض الثابت
    d: سعرها يغطي التكلفة الكاملة بالثابت
q18:
  text: 'التصنيع: متغيّر 8 للوحدة + 500 ثابت يمكن تجنّبه لـ 200 وحدة. الشراء بـ 9. أيهما أرخص؟'
  show: 4
  options:
    a: التصنيع، بـ 300
    b: التصنيع، بـ 100
    c: متساويان
    d: الشراء، بـ 300
q19:
  text: 'مع فرن محدود، المنتجات تُرتَّب حسب:'
  show: 4
  options:
    a: المساهمة للوحدة
    b: المساهمة لكل ساعة فرن
    c: سعر البيع
    d: حجم المبيعات
q20:
  text: 'خط إنتاج مساهمته 2,000 وثابته الممكن تجنّبه 1,000. إلغاؤه يغيّر الربح بـ:'
  show: 4
  options:
    a: +2,000
    b: −1,000
    c: '0'
    d: +1,000
q21:
  text: 'الموازنة الشاملة تبدأ بـ:'
  show: 4
  options:
    a: الموازنة النقدية
    b: موازنة المبيعات
    c: الموازنة الرأسمالية
    d: موازنة الإنتاج
q22:
  text: 'مبيعات هذا الشهر 60,000 والشهر الماضي 54,000؛ 60% تُحصَّل في الشهر و40% الشهر التالي. متحصلات هذا الشهر:'
  show: 4
  options:
    a: 54,000
    b: 60,000
    c: 57,600
    d: 36,000
q23:
  text: 'الفعلي 4,900 كجم بـ 3.20؛ السعر المعياري 3.00. انحراف السعر:'
  show: 4
  options:
    a: 300 غير صالح
    b: 1,280 غير صالح
    c: 980 صالح
    d: 980 غير صالح
q24:
  text: 'المعيار يسمح بـ 4,800 كجم بـ 3.00؛ استُخدم 4,900. انحراف الكمية:'
  show: 4
  options:
    a: 320 غير صالح
    b: 980 غير صالح
    c: 300 غير صالح
    d: 300 صالح
q25:
  text: 'تضخيم الموازنة لتسهيل التفوّق عليها يُسمّى:'
  show: 4
  options:
    a: انحرافًا
    b: الاحتياطي المخفي في الموازنة
    c: الموازنة الصفرية
    d: الموازنة المستمرة
q26:
  text: 'ربح 60,000 على أصول 400,000. ROI:'
  show: 4
  options:
    a: 6.7%
    b: 25%
    c: 15%
    d: 12%
q27:
  text: 'ربح 60,000، أصول 400,000، عائد مطلوب 12%. الدخل المتبقّي:'
  show: 4
  options:
    a: 12,000
    b: 7,200
    c: 48,000
    d: 60,000
q28:
  text: 'مديرة فرع تتحكّم في التكاليف والمبيعات وليس الاستثمار. هو:'
  show: 4
  options:
    a: مركز إيراد
    b: مركز ربحية
    c: مركز تكلفة
    d: مركز استثمار
q29:
  text: أي محور في بطاقة الأداء المتوازن يشمل ساعات تدريب العاملين؟
  show: 4
  options:
    a: التعلّم والنمو
    b: العمليات الداخلية
    c: العملاء
    d: المالي
q30:
  text: 'خفض السعر من 120 إلى 110 مع متغيّر 50 وثابت 21,000 ينقل التعادل إلى:'
  show: 4
  options:
    a: 191 كيكة
    b: 350 كيكة
    c: 420 كيكة
    d: 300 كيكة
