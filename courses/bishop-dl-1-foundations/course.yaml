id: bishop-dl-1-foundations
title: 'Deep Learning (Bishop) 1: probability and single-layer networks'
version: 1
language: en
description: 'Part 1 of 5, following Deep Learning: Foundations and Concepts by Christopher M. Bishop and Hugh Bishop (Springer,
  2024), chapters 1 to 5. Over-fitting and regularization, the rules of probability, the Gaussian, information theory and
  Bayesian thinking, the standard distributions, and single-layer networks for regression and classification. Each Read lesson
  opens the right pages of your own copy of the book (the Springer PDF, or read free online at bishopbook.com), with notes,
  videos, NumPy code you run yourself, and a big project: a tumour classifier built two ways, with a doctor''s decision rule.
  Plan: 7 days.'
image: cover.jpg
book: bishop.pdf
book_info:
  title: 'Deep Learning: Foundations and Concepts'
  url: https://www.bishopbook.com
  pages: 656
modules:
- id: m1
  title: 'Day 1: What deep learning is, and a first model'
  lessons:
  - id: m1-l1
    title: Start here
    file: lessons/m1-l1.md
    minutes: 15
  - id: m1-l2
    title: 'Read: the deep learning revolution (chapter 1)'
    file: lessons/m1-l2.md
    minutes: 50
    media: bishop.pdf#pages=21-42
  - id: m1-l3
    title: 'Watch: But what is a neural network?'
    file: lessons/m1-l3.md
    minutes: 19
    media: https://www.youtube.com/watch?v=aircAruvnKk
  - id: m1-l4
    title: 'Build: the curve-fitting example in NumPy'
    file: lessons/m1-l4.md
    minutes: 40
  - id: m1-l5
    title: 'Module project: build a fuel-use predictor'
    file: lessons/m1-l5.md
    minutes: 90
    media: project-1-mpg-predictor.ipynb
  requires:
  - id: m1-practical
    type: practical
    prompt: Build the module project yourself and push it to your own GitHub repository, with a README that has a results
      table. Then do at least one idea from Make it yours and add its result to the README. Hand in the link to your repository.
    optional: true
  - id: m1-explain
    type: explain
    prompt: 'In your own words: why does the M = 9 polynomial have zero training error but a large test error? Name the two
      cures from section 1.2 and say why each one works.'
    min_words: 60
    optional: true
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
