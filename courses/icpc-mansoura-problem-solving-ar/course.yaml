  title: 'اليوم 16: مسابقة ICPC الفريقية، والخطوة التالية'
  lessons:
  - id: c3-l1
    title: 'مسابقة ICPC: الفريق والمكتبة والخطوة التالية'
    file: lessons/c3-l1.md
    minutes: 20
  requires:
  - id: c3-practical
    type: practical
    prompt: 'المشروع الأخير: (1) ابدأ مكتبة فريقك (team notebook) على GitHub فيها كل الأكواد المختبرة من هذا الكورس، مرتبة
