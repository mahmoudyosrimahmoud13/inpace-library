    type: practical
    prompt: حل 6 مسائل من شيت Ad-Hocs في المستوى 0. ثم اكتب برنامجًا يقرأ array و q سؤالًا (l, r) ويجيب كل سؤال في O(1) بـ
      Prefix Sum، وجرّبه على n = q = 10⁵. ارفع الأكواد وصور Accepted.
  - id: m4-explain
    type: explain
    prompt: اشرح فكرة Prefix Sum ولماذا يجعل كل سؤال عن مجموع مدى في O(1).
