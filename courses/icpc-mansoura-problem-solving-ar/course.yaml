id: icpc-mansoura-problem-solving-ar
title: 'حل المشكلات والبرمجة التنافسية: على خطى ICPC Mansoura'
version: 2
language: ar
description: 'كورس حل مشكلات وبرمجة تنافسية بلغة C++، يسير بنفس ترتيب تدريب ICPC Mansoura للمستويين 0 و 1: مقدمة في حل المشكلات
  والحَكَم، المصفوفات والنصوص، الدوال وتعقيد الوقت، مسائل Ad-hoc والمجموع التراكمي، مكتبة STL، المؤشران، البحث الثنائي، الخوارزميات
  الجشعة، نظرية الأعداد (الأوليات، GCD، الأس السريع، المعكوس الضربي، nCr)، أساسيات الهندسة الحسابية، البتات والبحث الكامل،
  الاستدعاء الذاتي والتراجع، الجراف مع DFS و BFS، والبرمجة الديناميكية، مع ثلاث محطات مسابقات (كيف تخوض مسابقة، الحل اللاحق
  والتقييم، ومسابقة ICPC الفريقية). كل درس كامل ويعمل بدون إنترنت، وجلسات ICPC Mansoura Community الأصلية على يوتيوب فيديوهات
  اختيارية، مع تدريب على شيتات Codeforces و vjudge. حوالي 16 يومًا، ساعة إلى ساعتين يوميًا، ثم تدريب مستمر. بعده: كورس المستوى
  2.'
image: cover.jpg
downloads:
- title: مسائل المستوى 0 (مجموعة ICPC Mansoura على Codeforces)
  url: https://codeforces.com/group/5pUldkahAU/contests
- title: شيتات المستوى 1 (مجموعة vjudge)
  url: https://vjudge.net/group/mansoura-level1-roadmap
- title: صفحة تدريب ICPC Mansoura (كل المستويات والروابط)
  url: https://msc.acm.org/training
- title: قناة ICPC Mansoura Community على يوتيوب
  url: https://www.youtube.com/@icpcmansouracommunity
- title: 'Codeforces EDU: دروس وتمارين مجانية'
  url: https://codeforces.com/edu/courses
- title: AtCoder Educational DP Contest
  url: https://atcoder.jp/contests/dp
- title: CSES Problem Set
  url: https://cses.fi/problemset/
modules:
- id: m1
  title: 'اليوم 1: ما هو حل المشكلات؟ وأول برنامج'
  lessons:
  - id: m1-l1
    title: ما هو حل المشكلات؟ وأول برنامج بـ C++
    file: lessons/m1-l1.md
    minutes: 30
  requires:
  - id: m1-practical
    type: practical
    prompt: 'أنشئ حسابًا على Codeforces وانضم لمجموعة المستوى 0 (الرابط في التحميلات). حل 5 مسائل على الأقل من أول شيت (أو:
      Watermelon 4A، Way Too Long Words 71A، Team 231A، Domino piling 50A، Bit++ 282A). ارفع صور Accepted ورابط حسابك.'
  - id: m1-explain
    type: explain
    prompt: اشرح لماذا تخبرك القيود (Constraints) في المسألة بنوع الحل المطلوب، مع مثال.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'اليوم 2: المصفوفات والنصوص'
  lessons:
  - id: m2-l1
    title: المصفوفات والنصوص
    file: lessons/m2-l1.md
    minutes: 30
  requires:
  - id: m2-practical
    type: practical
    prompt: 'حل 6 مسائل من شيت المصفوفات والنصوص في المستوى 0، أو: Petya and Strings 112A، Word 59A، Boy or Girl 236A، Stones
      on the Table 266A. ارفع الأكواد وصور Accepted.'
  - id: m2-explain
    type: explain
    prompt: اشرح كيف تستخدم s[i] - 'a' لعد تكرار كل حرف، ولماذا تعمل.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'اليوم 3: الدوال، الـ struct، وتعقيد الوقت'
  lessons:
  - id: m3-l1
    title: الدوال، الـ struct، وتعقيد الوقت
    file: lessons/m3-l1.md
    minutes: 30
  requires:
  - id: m3-practical
    type: practical
    prompt: اكتب دالة isPrime في O(√n) ودالة تجمع vector بالمرجع الثابت. رتّب طلابًا (struct فيه اسم ودرجة) بالدرجة تنازليًا
      ثم بالاسم. وحل 4 مسائل من شيت المستوى 0 لهذا الجزء، واكتب تعقيد كل حل في تعليق أعلى الكود. ارفع الأكواد.
  - id: m3-explain
    type: explain
    prompt: اشرح لماذا يكفي في اختبار الأولية أن نجرّب القسمة حتى √n فقط.
    min_words: 60
  - id: m3-quiz
    type: quiz
    questions:
    - q11
    - q12
    - q13
    - q14
    - q15
    pass: 70
- id: m4
  title: 'اليوم 4: مسائل Ad-hoc والمجموع التراكمي'
  lessons:
  - id: m4-l1
    title: 'مسائل Ad-hoc: التكرار والمجموع التراكمي'
    file: lessons/m4-l1.md
    minutes: 30
  requires:
  - id: m4-practical
    type: practical
    prompt: حل 6 مسائل من شيت Ad-Hocs في المستوى 0. ثم اكتب برنامجًا يقرأ مصفوفة و q سؤالًا (l, r) ويجيب كل سؤال في O(1) بالمجموع
      التراكمي، وجرّبه على n = q = 10⁵. ارفع الأكواد وصور Accepted.
  - id: m4-explain
    type: explain
    prompt: اشرح فكرة المجموع التراكمي ولماذا يجعل كل سؤال عن مجموع مدى في O(1).
    min_words: 60
  - id: m4-quiz
    type: quiz
    questions:
    - q16
    - q17
    - q18
    - q19
    - q20
    pass: 70
- id: m5
  title: 'اليوم 5: STL 1'
  lessons:
