  - id: m9-practical
    type: practical
    prompt: 'اكتب: غربال إراتوستينس حتى 10⁶، دالة تحليل لعوامل أولية، gcd و lcm بدون overflow، power(a, n, mod)، و nCr مع
      mod بعد تجهيز المضروب. ثم حل 5 مسائل من شيتي Number Theory 1 و 2 في المستوى 1، و3 مسائل هندسة من CSES (Point Location
