id: icpc-mansoura-problem-solving-ar
title: 'Problem Solving و Competitive Programming: على خطى ICPC Mansoura'
version: 2
language: ar
description: 'كورس حل مشكلات وبرمجة تنافسية بلغة C++، يسير بنفس ترتيب تدريب ICPC Mansoura للمستويين 0 و 1: مقدمة في حل المشكلات
  والـ judge، الـ arrays والـ strings، الـ functions و Time Complexity، مسائل Ad-hoc و Prefix Sum، مكتبة STL، Two Pointers،
  البحث الثنائي، Greedy Algorithms، Number Theory (الأوليات، GCD، Fast Power، Modular Inverse، nCr)، أساسيات Computational
  Geometry، Bitmasks و Complete Search، Recursion و Backtracking، الـ graph مع DFS و BFS، و Dynamic Programming، مع ثلاث محطات
  مسابقات (كيف تخوض مسابقة، Upsolving والتقييم، ومسابقة ICPC الفريقية). كل درس كامل ويعمل بدون إنترنت، وجلسات ICPC Mansoura
  Community الأصلية على يوتيوب فيديوهات اختيارية، مع تدريب على شيتات Codeforces و vjudge. حوالي 16 يومًا، ساعة إلى ساعتين
  يوميًا، ثم تدريب مستمر. بعده: كورس المستوى 2.'
image: cover.jpg
downloads:
- title: مسائل المستوى 0 (مجموعة ICPC Mansoura على Codeforces)
  url: https://codeforces.com/group/5pUldkahAU/contests
- title: شيتات المستوى 1 (مجموعة vjudge)
  url: https://vjudge.net/group/mansoura-level1-roadmap
- title: صفحة تدريب ICPC Mansoura (كل المستويات والروابط)
  url: https://msc.acm.org/training
- title: قناة ICPC Mansoura Community على يوتيوب
  url: https://www.youtube.com/@icpcmansouracommunity
- title: 'Codeforces EDU: دروس وتمارين مجانية'
  url: https://codeforces.com/edu/courses
- title: AtCoder Educational DP Contest
  url: https://atcoder.jp/contests/dp
- title: CSES Problem Set
  url: https://cses.fi/problemset/
modules:
- id: m1
  title: 'اليوم 1: ما هو Problem Solving؟ وأول برنامج'
  lessons:
  - id: m1-l1
    title: ما هو Problem Solving؟ وأول برنامج بـ C++
    file: lessons/m1-l1.md
    minutes: 30
  requires:
  - id: m1-practical
    type: practical
    prompt: 'أنشئ حسابًا على Codeforces وانضم لمجموعة المستوى 0 (الرابط في التحميلات). حل 5 مسائل على الأقل من أول شيت (أو:
      Watermelon 4A، Way Too Long Words 71A، Team 231A، Domino piling 50A، Bit++ 282A). ارفع صور Accepted ورابط حسابك.'
  - id: m1-explain
    type: explain
    prompt: اشرح لماذا تخبرك الـ constraints في المسألة بنوع الحل المطلوب، مع مثال.
    min_words: 60
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
- id: m2
  title: 'اليوم 2: الـ arrays والـ strings'
  lessons:
  - id: m2-l1
    title: الـ arrays والـ strings
    file: lessons/m2-l1.md
    minutes: 30
  requires:
  - id: m2-practical
    type: practical
    prompt: 'حل 6 مسائل من شيت الـ arrays والـ strings في المستوى 0، أو: Petya and Strings 112A، Word 59A، Boy or Girl 236A،
      Stones on the Table 266A. ارفع الأكواد وصور Accepted.'
  - id: m2-explain
    type: explain
    prompt: اشرح كيف تستخدم s[i] - 'a' لعد تكرار كل حرف، ولماذا تعمل.
    min_words: 60
  - id: m2-quiz
    type: quiz
    questions:
    - q6
    - q7
    - q8
    - q9
    - q10
    pass: 70
- id: m3
  title: 'اليوم 3: الـ functions، الـ struct، و Time Complexity'
  lessons:
  - id: m3-l1
    title: الـ functions، الـ struct، و Time Complexity
    file: lessons/m3-l1.md
    minutes: 30
  requires:
