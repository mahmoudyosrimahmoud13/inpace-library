- id: m12
  title: 'اليوم 15: البرمجة الديناميكية'
  lessons:
  - id: m12-l1
    title: البرمجة الديناميكية (Dynamic Programming)
    file: lessons/m12-l1.md
    minutes: 35
  requires:
  - id: m12-practical
    type: practical
    prompt: حل أول 6 مسائل من AtCoder Educational DP Contest (Frog 1، Frog 2، Vacation، Knapsack 1، Knapsack 2 اختيارية، LCS)،
