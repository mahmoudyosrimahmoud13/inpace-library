      n = 8 (الإجابة 92) مع التقليم. ارفع الأكواد وصور Accepted.
  - id: m10-explain
    type: explain
    prompt: اشرح كيف يمثل رقم واحد (mask) مجموعة جزئية، وكيف نمر على كل المجموعات الجزئية.
    min_words: 70
  - id: m10-quiz
    type: quiz
    questions:
    - q56
    - q57
    - q58
    - q59
    - q60
    pass: 70
- id: c2
  title: 'محطة: مسابقة منتصف المستوى 1، والحل اللاحق'
  lessons:
  - id: c2-l1
    title: 'بعد المسابقة: الحل اللاحق والتقييم'
    file: lessons/c2-l1.md
    minutes: 20
  requires:
