  - id: m12-explain
    type: explain
    prompt: اختر مسألة DP حللتها واشرح الحالة والانتقال وحالات الأساس، والفرق بين حلها بـ memoization و tabulation.
    min_words: 100
  - id: m12-quiz
    type: quiz
    questions:
    - q70
    - q71
    - q72
