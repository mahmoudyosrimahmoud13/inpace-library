    - q54
    - q55
    pass: 70
- id: m10
  title: 'اليوم 13: البتات، البحث الكامل، والتراجع'
  lessons:
  - id: m10-l1
    title: البتات (Bitmasks) والبحث الكامل
    file: lessons/m10-l1.md
    minutes: 30
  - id: m10-l2
