  - id: m5-explain
    type: explain
    prompt: اشرح ما الذي يجب أن تُرجعه دالة المقارنة في sort، ولماذا لا نستخدم <= فيها.
    min_words: 60
  - id: m5-quiz
    type: quiz
    questions:
    - q21
    - q22
    - q23
    - q24
    - q25
    pass: 70
- id: m6
  title: 'اليوم 6: STL 2'
  lessons:
  - id: m6-l1
    title: 'STL 2: set و map و stack و queue و priority_queue'
    file: lessons/m6-l1.md
    minutes: 30
  requires:
  - id: m6-practical
    type: practical
    prompt: حل 6 مسائل من شيت STLs 2 في المستوى 0 مستخدمًا set و map و stack و queue و priority_queue. ثم شارك في أول مسابقة
      لك (Div. 4 أو Div. 3 أو مسابقة المستوى 0 الافتراضية). ارفع الأكواد ورابط المسابقة.
  - id: m6-explain
    type: explain
    prompt: اشرح متى تختار map بدل مصفوفة تكرار، ومتى تختار set بدل vector.
    min_words: 60
  - id: m6-quiz
    type: quiz
    questions:
    - q26
    - q27
    - q28
    - q29
    - q30
    pass: 70
- id: c1
  title: 'محطة: أول مسابقة (نهاية المستوى 0)'
  lessons:
  - id: c1-l1
    title: كيف تخوض مسابقة
    file: lessons/c1-l1.md
    minutes: 20
  requires:
  - id: c1-practical
    type: practical
    prompt: 'خُض مسابقة كاملة بوقتها: إحدى مسابقات المستوى 0 في مجموعة ICPC Mansoura على Codeforces كمشاركة افتراضية، أو مسابقة
      Div. 4 حية. ارفع رابط المسابقة، وعدد المسائل التي حللتها، وصورة لوحة النتائج.'
  - id: c1-explain
    type: explain
    prompt: 'اكتب ما حدث في مسابقتك: بأي مسألة بدأت ولماذا، أين علقت، وما الذي ستفعله بشكل مختلف في المرة القادمة.'
    min_words: 80
  - id: c1-quiz
    type: quiz
    questions:
    - q31
    - q32
    - q33
    - q34
    pass: 70
- id: m7
  title: 'اليوم 7: المؤشران (Two Pointers)'
  lessons:
  - id: m7-l1
