    file: lessons/m7-l1.md
    minutes: 30
  requires:
  - id: m7-practical
    type: practical
    prompt: حل 6 مسائل من شيت Adhocs & Two Pointers في المستوى 1 (vjudge في التحميلات)، منها مسألة نافذة منزلقة على الأقل.
      اكتب الحل المباشر O(n²) وتعقيده في تعليق، ثم حلك بالمؤشرين. ارفع الأكواد.
  - id: m7-explain
    type: explain
    prompt: اشرح لماذا تعقيد حل المؤشرين O(n) رغم وجود while داخل for.
    min_words: 60
  - id: m7-quiz
    type: quiz
    questions:
    - q35
    - q36
    - q37
    - q38
    - q39
    pass: 70
- id: m8
  title: 'اليوم 8 و 9: البحث الثنائي والخوارزميات الجشعة'
  lessons:
  - id: m8-l1
    title: البحث الثنائي (Binary Search)
    file: lessons/m8-l1.md
    minutes: 30
  - id: m8-l2
    title: الخوارزميات الجشعة (Greedy)
    file: lessons/m8-l2.md
    minutes: 30
  requires:
  - id: m8-practical
    type: practical
    prompt: 'حل 5 مسائل من شيت Binary Search في المستوى 1، منها مسألتان على الأقل من نوع البحث على الإجابة، مع دالة التحقق
      ok() ولماذا هي رتيبة. ثم حل 3 مسائل جشعة (منها من CSES: Movie Festival و Ferris Wheel)، واكتب لكل واحدة القاعدة الجشعة
      ولماذا هي صحيحة. ارفع الأكواد.'
  - id: m8-explain
    type: explain
    prompt: اشرح فكرة البحث الثنائي على الإجابة بمثال المصانع، ثم اشرح لماذا يفشل الحل الجشع في الفكة بالعملات {1, 3, 4} والمبلغ
      6.
    min_words: 80
  - id: m8-quiz
    type: quiz
    questions:
    - q40
    - q41
    - q42
    - q43
    - q44
    - q45
    - q46
    - q47
    pass: 70
- id: m9
  title: 'اليوم 10 إلى 12: نظرية الأعداد والهندسة'
  lessons:
  - id: m9-l1
    title: 'نظرية الأعداد 1: القسمة، الأعداد الأولية، و GCD'
