id: bishop-dl-4-latent-variables
title: 'Deep Learning (Bishop) 4: graphical models, sampling and latent variables'
version: 1
language: en
description: 'Part 4 of 5, following Deep Learning: Foundations and Concepts by Christopher M. Bishop and Hugh Bishop (Springer,
  2024), chapters 11, 14, 15 and 16. Directed graphical models and conditional independence, rejection and importance sampling,
  Markov chain Monte Carlo and Langevin dynamics, K-means, Gaussian mixtures, the EM algorithm and the evidence lower bound,
  PCA and probabilistic PCA. Each Read lesson opens the right pages of your own copy of the book (the Springer PDF, or read
  free online at bishopbook.com). Big projects in NumPy: four samplers including annealed Langevin, EM from scratch, PCA denoising,
  and a model that generates new handwritten digits. Plan: 7 days.'
image: cover.jpg
book: bishop.pdf
book_info:
  title: 'Deep Learning: Foundations and Concepts'
  url: https://www.bishopbook.com
  pages: 656
modules:
- id: m1
  title: 'Day 1: Graphical models'
  lessons:
  - id: m1-l1
    title: Start here
    file: lessons/m1-l1.md
    minutes: 10
  - id: m1-l2
    title: 'Read: graphical models (11.1)'
    file: lessons/m1-l2.md
    minutes: 50
    media: bishop.pdf#pages=341-353
  - id: m1-l3
    title: 'Build: a graphical model you can sample and query'
    file: lessons/m1-l3.md
    minutes: 30
  - id: m1-l4
    title: 'Module project: a Bayesian network for the Titanic'
    file: lessons/m1-l4.md
    minutes: 90
    media: project-1-titanic-bayesnet.ipynb
  requires:
  - id: m1-practical
    type: practical
    prompt: Build the module project yourself and push it to your own GitHub repository, with a README that has a results
      table. Then do at least one idea from Make it yours and add its result to the README. Hand in the link to your repository.
    optional: true
  - id: m1-explain
    type: explain
    prompt: Explain how a directed graph defines a factorization of a joint distribution, and why removing links can save
      so many parameters.
    min_words: 60
    optional: true
  - id: m1-quiz
    type: quiz
    questions:
    - q1
    - q2
    - q3
    - q4
    - q5
    pass: 70
