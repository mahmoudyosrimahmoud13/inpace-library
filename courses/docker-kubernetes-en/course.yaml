    min_words: 60
  - id: m8-quiz
    type: quiz
    questions:
    - q29
    - q30
    - q31
    - q32
    pass: 70
- id: m9
  title: 'Day 15: Review and interview questions'
  lessons:
  - id: m9-l1
    title: 20 interview questions
    file: lessons/m9-l1.md
    minutes: 45
  requires:
  - id: m9-practical
    type: practical
    prompt: Record yourself (or write) answering 10 of the 20 questions, each in under a minute, then answer the
      design question with a diagram. Upload the recording or file.
  - id: m9-explain
    type: explain
    prompt: 'Interview: ''Your app on Kubernetes is in CrashLoopBackOff. What do you do, step by step?'''
    min_words: 80
  - id: m9-quiz
    type: quiz
    questions:
    - q33
    - q34
    - q35
    - q36
    pass: 70
