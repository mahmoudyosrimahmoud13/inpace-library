  - id: m8-l4
    title: Deploying on Kubernetes (part 1 of 2)
    file: lessons/m8-l4.md
    minutes: 19
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=33806&end=34940
  - id: m8-l5
    title: Deploying on Kubernetes (part 2 of 2)
    file: lessons/m8-l5.md
    minutes: 19
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=34940&end=36081
  - id: m8-l6
    title: Kubernetes in VS Code
    file: lessons/m8-l6.md
    minutes: 5
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=36081&end=36352
  - id: m8-l7
    title: Jupyter in a container
    file: lessons/m8-l7.md
    minutes: 15
    media: https://www.youtube.com/watch?v=PrusdhS2lmo&t=36352
  requires:
  - id: m8-practical
    type: practical
    prompt: 'On Minikube: deploy a 3-replica Deployment and a NodePort Service, open the app, delete a Pod and watch
