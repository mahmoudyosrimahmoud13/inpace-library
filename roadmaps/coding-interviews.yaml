id: coding-interviews
title: Problem solving and coding interviews
description: From your first programming steps to the algorithm patterns behind coding interviews and competitive programming, with system design for the senior questions.
language: en
author: inPace
official: true
order: 21
tags: [algorithms, data structures, interview, problem solving, career]
steps:
  - course: python-basics
    note: The language used for the interview course. Skip it if you already code comfortably in Python.
  - course: python-full
    note: Functions, data structures and clean code, so you can focus on the algorithm in an interview.
    optional: true
  - course: dsa-interviews
    note: The heart of the path. Fourteen patterns, from two pointers to dynamic programming, with LeetCode practice. Do it before the hiring course so its chapters feel like revision.
  - course: ctci-hiring
    note: The whole hiring process with Cracking the Coding Interview, from your CV and stories to the offer, with LeetCode practice for every chapter.
  - course: system-design-beginners
    note: How large systems are designed, the second kind of interview at most tech companies.
