id: spanish-a1-to-b1
title: الإسباني من الصفر إلى B1
description: ثلاث دورات بالترتيب، والشرح بالعربي، من أول «Hola» إلى الكلام بطلاقة والدفاع عن رأيك. كل مستوى يبدأ بالكلام.
language: ar
author: inPace
official: true
order: 19
tags: [spanish, arabic, grammar, speaking]
steps:
  - course: spanish-a1-ar
    note: "من الصفر: استمع ثم تكلّم، التحية والعائلة ويومك والمدينة والأكل والخطط، مع ser وestar وtener وgustar."
  - course: spanish-a2-ar
    note: "احكِ عن الماضي، والقصص، والتسوق، والطبيب، والتجارب والمستقبل."
  - course: spanish-b1-ar
    note: "الرأي، والـ subjuntivo، والافتراض، ومقابلة العمل، والكلام المنقول."
