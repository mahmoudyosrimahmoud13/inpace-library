id: english-a1-to-b1
title: الإنجليزي من الصفر إلى B1
description: ثلاث دورات بالترتيب، من أول كلمة إلى الكلام اليومي بثقة. كل مستوى يبني على الذي قبله.
language: ar
author: inPace
official: true
order: 18
tags: [english, arabic, grammar]
steps:
  - course: english-a1-ar
    note: "من الصفر: استمع ثم تكلّم، مع شرح الفروق عن العربية: to be والمضارع والمدينة والأكل والخطط."
  - course: english-a2-ar
    note: "الماضي، والقصص، والمقارنة، والطبيب، والتجارب والمستقبل."
  - course: english-irregular-verbs-ar
    note: "اختياري لكنه مفيد جدًا: الأفعال الشاذة في أنماط سهلة، قبل B1 أو معه."
    optional: true
  - course: english-b1-ar
    note: "الرأي، وfor وsince، والشرط، والمجهول، ومقابلة العمل، والكلام المنقول."
