id: python-backend-ar
title: مطوّر باك إند بايثون
description: تعلّم بايثون، ثم ابنِ واجهات برمجية بـ FastAPI، وشغّلها في حاويات، وتعلّم تصميم الأنظمة.
language: ar
author: inPace
official: true
order: 9
tags: [python, backend, web, devops, arabic]
steps:
  - course: python-basics-ar
    note: بداية قصيرة إن لم تبرمج من قبل. وتخطَّها إن أردت أن تبدأ الدورة الكاملة مباشرة.
    optional: true
  - course: python-full-ar
    note: اللغة كاملة أولًا، الدوال والأخطاء والاختبارات والملفات والأصناف، والأدوات التي يستخدمها مطوّر الباك إند كل يوم.
  - course: fastapi
    note: هذه الدورة بالإنجليزية، لكن الكود هو نفسه بأي لغة.
  - course: docker-kubernetes-ar
    note: ضع الـ API في حاوية وشغّله على Cluster.
  - course: system-design-beginners
    note: بالإنجليزية. صمّم خدمة كاملة، وهي أسئلة المقابلات المعتادة.
    optional: true
