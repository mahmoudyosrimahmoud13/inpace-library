id: linux-cloud-devops
title: Linux, Cloud and DevOps
description: From what an operating system really does to running, securing and automating Linux servers, then containers and delivery pipelines. Built for people who want to be genuinely strong at servers, cloud and troubleshooting. Ends with a final project you can show in interviews.
language: en
author: inPace
official: true
order: 19
tags: [linux, operating systems, sysadmin, networking, security, devops, cloud]
steps:
  - course: os-fundamentals
    note: "The mental model first. Processes, memory, files and boot, so everything Linux does later makes sense."
  - course: linux-fundamentals
    note: "Become fluent in the terminal. Files, pipes, text tools, permissions and processes."
  - course: linux-sysadmin
    note: "Run real servers. Services, logs, users, SSH, disks, firewall and backups."
  - course: linux-advanced-internals
    note: "Look inside. /proc, signals, performance, namespaces and cgroups, and a container built by hand."
  - course: bash-automation
    note: "Automate it. Scripts you can trust, ending with a backup script that checks, verifies, alerts and cleans up."
  - course: networking-fundamentals
    note: "How data really moves. Layers, subnetting, routing, TCP, DNS and TLS, from the ground up."
  - course: linux-network-security
    note: "Put networking to work on servers. nftables, NAT, SSH and TLS, auditing, and a hardening lab."
  - course: git-zero-to-master
    note: "Professional Git, from the first commit to recovering lost work with the reflog."
  - course: ssh-remote-admin
    note: "Manage remote machines like a pro. Keys, config, tunnels, bastions and SSH certificates."
  - course: docker-containers
    note: "Containers, properly. After the internals course you'll know which kernel feature does each part: images, Dockerfiles, Compose, security and shipping."
  - course: docker-kubernetes-en
    note: "Optional: Kubernetes in depth, from one container to a cluster. The video is in Egyptian Arabic; the English notes cover everything."
    optional: true
  - course: github-actions-cli
    note: "Pull requests, the GitHub CLI and Actions: your first steps into CI/CD."
  - course: aws-fundamentals
    note: "The cloud from the ground up. IAM, EC2, VPC, S3, databases, load balancers and cost."
  - course: cloud-linux-admin
    note: "Run Linux on AWS day to day. Session Manager, cloud-init, secrets, patching, golden AMIs."
  - course: devops-cicd
    note: "Pipelines that ship safely. Scanning, signed images, OIDC, canary, GitOps and rollback."
  - course: iac-terraform-ansible
    note: "Your whole cloud in Git. Terraform for resources, Ansible for servers, rebuilt in minutes."
  - course: observability-sre
    note: "Keep it running. Metrics, logs, traces, SLOs, alerts people trust, and blameless postmortems."
  - course: linux-cloud-capstone
    note: "The final project. One system that uses every course, tested with a game day and written up for your portfolio."
