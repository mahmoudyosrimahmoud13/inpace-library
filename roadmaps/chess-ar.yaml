id: chess-ar
title: الشطرنج من الصفر إلى أول بطولة
description: ثلاثة كورسات بالترتيب. تعلّم القواعد والعب أول مبارياتك، ثم التكتيكات التي تحسم أغلب المباريات، ثم قائمة افتتاحات بسيطة والخطط والنهايات التي يحتاجها كل لاعب. كل وضع معه رابط لفتحه على Lichess.
language: ar
author: inPace
official: true
order: 27
tags: [chess, beginner, arabic]
steps:
  - course: chess-1-rules-ar
    note: "ابدأ هنا: الرقعة وحركة كل قطعة والقواعد الخاصة وأول أنواع المات وروتين لكل نقلة."
  - course: chess-2-tactics-ar
    note: الشوكة والتثبيت والسيخ والهجوم المكشوف وأشكال المات والحساب. واستمر في الألغاز اليومية بعده.
  - course: chess-3-openings-endgames-ar
    note: الافتتاح الإيطالي وجامبيت الوزير المرفوض، وبنية الجنود والخطط، ونهايات الملك والجنود والقلاع المهمة.
