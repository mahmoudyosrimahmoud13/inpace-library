id: german-a1-to-b1
title: الألماني من الصفر إلى B1
description: ثلاث دورات بالترتيب، والشرح بالعربي، من أول «Hallo» إلى مستوى B1 المطلوب غالبًا للعمل والتدريب المهني في ألمانيا، مع فيلم «Nicos Weg» من Deutsche Welle.
language: ar
author: inPace
official: true
order: 20
tags: [german, arabic, grammar, speaking]
steps:
  - course: german-a1-ar
    note: "من الصفر: استمع ثم تكلّم، التحية والعائلة ويومك والمدينة والأكل والمواعيد، مع ترتيب الجملة وحالة المفعول."
  - course: german-a2-ar
    note: "الـ Perfekt، وحالة الجر، والمقارنة، والطبيب، وweil وdass، والشقة الجديدة."
  - course: german-b1-ar
    note: "الرأي وأدوات الربط، وKonjunktiv II، والجمل الموصولة، والمجهول، والتقديم للوظائف."
