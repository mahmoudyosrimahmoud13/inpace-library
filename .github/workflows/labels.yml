name: Make labels

# Creates the labels the forms and bots use. Runs once by itself; safe to run again.
on:
  push:
    branches: [main]
    paths: [".github/workflows/labels.yml"]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh label create course-submission --color FFD43B --description "A new or updated course" --force
          gh label create roadmap-submission --color 3D8FD1 --description "A new or updated roadmap" --force
          gh label create needs-changes --color E6007E --description "The bot found something to fix" --force
          gh label create report --color B60205 --description "A problem with a course" --force
