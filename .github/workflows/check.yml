name: Check courses

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "git+https://github.com/mahmoudyosrimahmoud13/inpace.git" pyyaml
      - run: python scripts/library_tools.py check
